<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flugsuche PRO - UNZERSTÖRBAR</title>
    <style>
        :root { --matrix-dark: #0f172a; --bg-light: #f8fafc; --card-bg: #ffffff; --border: #cbd5e1; --matrix-yellow: #eab308; }
        body { font-family: sans-serif; background: var(--bg-light); color: #1e293b; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--matrix-dark); }
        
        .card { border: 3px solid var(--matrix-dark); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #f1f5f9; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--matrix-dark); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* Gelber Master-Suchknopf */
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--matrix-yellow); font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-decoration: none; text-align: center; }
        .btn:hover { background: #ca8a04; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <!-- Das Formular schickt die Suchanfrage absolut unblockierbar ohne JavaScript an Google -->
    <form action="https://google.com" method="get" target="_blank" class="card" id="searchForm">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter (No-Code Modus)</span>
            <span style="font-size: 0.75rem; background: var(--matrix-yellow); padding: 2px 6px; border-radius: 4px; color: #0f172a;">[VERSION 2026 - FINAL NO-CODE]</span>
        </div>
        <div class="grid">
            
            <div>
                <label>Abflugort (z.B. FRA):</label>
                <input type="text" placeholder="FRA" id="from" maxlength="3" style="text-transform: uppercase;" required oninput="buildQuery()">
            </div>
            <div>
                <label>Zielort (z.B. MNL):</label>
                <input type="text" placeholder="MNL" id="to" maxlength="3" style="text-transform: uppercase;" required oninput="buildQuery()">
            </div>

            <div class="full">
                <label>Bevorzugtes Suchportal:</label>
                <select id="portal" onchange="buildQuery()">
                    <option value="google Flights">Google Flights</option>
                    <option value="skyscanner">Skyscanner</option>
                    <option value="kiwi.com">Kiwi.com</option>
                    <option value="trip.com">Trip.com</option>
                </select>
            </div>

            <!-- Das unsichtbare Feld, das die Suchkette für den Browser hält -->
            <input type="hidden" name="q" id="hidden-query" value="">

            <div class="full">
                <button type="submit" class="btn" style="width: 100%;">Gelb - Flug-Suche starten ➔</button>
            </div>
        </div>
    </form>
</div>

<script>
    // Ein ultrakompakter 3-Zeiler, der physikalisch nicht zerschnitten werden kann!
    function buildQuery() {
        var f = document.getElementById('from').value.toUpperCase().trim();
        var t = document.getElementById('to').value.toUpperCase().trim();
        var p = document.getElementById('portal').value;
        document.getElementById('hidden-query').value = p + " flights from " + f + " to " + t;
    }
    buildQuery();
</script>
</body>
</html>
