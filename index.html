<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - TWO-BLOCK CORE</title>
    <style>
        :root { --rubin: #991b1b; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --lowcost-yellow: #fef08a; --gold: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--rubin); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--rubin); background: #fef2f2; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--rubin); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        
        /* UNZERSTÖRBARER CSS-LOCK FÜR ONE WAY */
        body:has(#ow-checkbox:checked) #return-box { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed !important; opacity: 0.35 !important; pointer-events: none !important; border-color: #94a3b8 !important; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid #eab308; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 22px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        .switch input:checked + .slider { background-color: #22c55e !important; }
        .switch input:checked + .slider:before { transform: translateX(18px); }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold); font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports">
        <option value="BER">Berlin Brandenburg (BER)</option>
        <option value="FRA">Frankfurt am Main (FRA)</option>
        <option value="MNL">Manila Ninoy Aquino (MNL)</option>
        <option value="CEB">Cebu Mactan (CEB)</option>
        <option value="BKK">Bangkok Suvarnabhumi (BKK)</option>
        <option value="SIN">Singapore Changi (SIN)</option>
    </datalist>
    
    <form onsubmit="return false;" class="card">

        <!-- 🔒 BLOCK 1: DER SPERRBARE KERN (DEINE SEKTION 1) -->
        <div class="title"><span>✈️ Sektion 1: Flug-Parameter</span><span style="font-size: 0.75rem; background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #ffffff; border: 1px solid #334155;">[🔒 LOCKED CORE - 08.11.2026 - 11:41 UHR]</span></div>
        <div class="grid">
            <div><label>Abflugort (IATA):</label><input type="text" id="fl-from" placeholder="z.B. FRA" list="airports" required></div>
            <div><label>Zielort (IATA):</label><input type="text" id="fl-to" placeholder="z.B. BKK" list="airports" required></div>
            
            <!-- SKRIPTFREIER KALENDER-SCHUTZSCHILD -->
            <div><label>Hinflug:</label><input type="date" id="fl-date1" value="2026-12-18" onchange="document.getElementById('return-box').min=this.value; if(document.getElementById('return-box').value &lt; this.value){document.getElementById('return-box').value=this.value;}"></div>
            <div><label>Rückflug:</label><input type="date" id="return-box" value="2026-12-28" min="2026-12-18" onchange="if(this.value &lt; document.getElementById('fl-date1').value){this.value=document.getElementById('fl-date1').value;}"></div>
            
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="ow-checkbox"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            
            <div><label>Beförderungsklasse:</label><select><option>Economy</option><option>Premium Economy</option><option>Business Class</option><option>First Class</option></select></div>
            <div><label>Personen:</label><select><option selected>1 Person</option><option>2 Personen</option><option>3 Personen</option><option>4 Personen</option></select></div>
            
            <div><label>Gepäck:</label><select><option>Handgepäck</option><option>1x 20 KG</option><option>1x 32 KG</option></select></div>
            <div><label>Stopps:</label><select><option value="" selected></option><option>Direktflug</option><option>Max. 1 Stopp</option></select></div>
            <div class="full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai (DXB)"></div>
            <div><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. CEB"></div>
            
            <div><label>Max. Preis Anschluss (€):</label><input type="number" value="0"></div>
            <div class="full"><label>Max. Haupt-Ticketpreis (€):</label><input type="number" value="0"></div>
            
            <div class="full" style="background:#fff; padding:8px 10px; border:1px solid var(--border); border-radius:4px;">
                <label id="range-label">Max. Reisezeit: 30 Std.</label><input type="range" min="5" max="50" value="30" style="height:20px;" oninput="document.getElementById('range-label').innerText = 'Max. Reisezeit: ' + this.value + ' Std.';">
            </div>

            <!-- 🔓 BLOCK 2: UNSERE OFFENE ARBEITS-SCHNITTSTELLE -->
            <div>
                <label>1. Suchseite wählen:</label>
                <!-- Schaltet das Textlabel rechts völlig unzerstörbar live und direkt um -->
                <select id="engine-selector" onchange="document.getElementById('action-btn').innerText = this.options[this.selectedIndex].text + ' Suche starten';">
                    <option value="google" selected>Google Flights</option>
                    <option value="skyscanner">Skyscanner</option>
                    <option value="kayak">Kayak</option>
                    <option value="kiwi">Kiwi.com</option>
                    <option value="trip">Trip.com</option>
                </select>
            </div>
            
            <div>
                <label>2. Aktion:</label>
                <!-- Der Auslöser: Liest die IDs des oberen gesperrten Blocks rein mechanisch aus und schießt dich fehlerfrei ans Ziel -->
                <button type="button" id="action-btn" class="btn" style="margin-top:0;" onclick="var eng=document.getElementById('engine-selector').value; var f=encodeURIComponent(document.getElementById('fl-from').value).toLowerCase(); var t=encodeURIComponent(document.getElementById('fl-to').value).toLowerCase(); if(eng==='google'){ window.open('https://google.com+' + f.toUpperCase() + '+nach+' + t.toUpperCase(), '_blank'); } else if(eng==='skyscanner'){ window.open('https://skyscanner.de' + f + '/' + t + '/', '_blank'); } else if(eng==='kayak'){ window.open('https://kayak.de' + f.toUpperCase() + '-' + t.toUpperCase() + '/', '_blank'); } else if(eng==='kiwi'){ window.open('https://kiwi.com' + f + '/' + t + '/', '_blank'); } else { window.open('https://trip.com' + f + '&amp;acity=' + t, '_blank'); }">Google Flights Suche starten</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
