<title>✈️ Reisekonfiguration PRO - DASHBOARD LIVE</title>
<style>
:root{--rubin:#991b1b;--bg:#f0f4f8;--text:#1e293b;--border:#cbd5e1;--gold:#f59e0b;--lock-green:#22c55e;--lowcost-yellow:#fef08a}
html,body{height:auto!important;min-height:100%;margin:0;padding:15px;background:var(--bg);font-family:sans-serif;color:var(--text)}
.dashboard-container{width:100%;max-width:100%;box-sizing:border-box}
.main-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);padding-bottom:10px;margin-bottom:20px}
.main-title{font-weight:bold;color:var(--rubin);font-size:1.3rem;margin:0}
.cockpit-display{display:flex;gap:6px;background:#1e293b;padding:4px;border-radius:6px}
.cockpit-seg{font-size:0.75rem;padding:4px 10px;border-radius:4px;font-weight:bold;color:#fff;text-transform:uppercase}
@keyframes cockpitPulse{0%{background-color:#d946ef}25%{background-color:#991b1b}50%{background-color:#0284c7}75%{background-color:#059669}100%{background-color:#d946ef}}
@keyframes dateShift{0%{background-color:#475569}50%{background-color:#1e3a8a}100%{background-color:#475569}}
.seg-date{animation:dateShift 8s infinite ease-in-out}
.seg-time{animation:cockpitPulse 5s infinite ease-in-out}
.seg-state{background:var(--lock-green)}
.window-flex-row{display:flex;flex-wrap:wrap;gap:20px;width:100%;box-sizing:border-box;margin-bottom:20px}
.fortress-card{flex:1 1 450px;border:2px solid var(--rubin);border-radius:8px;padding:20px;background:#fef2f2;box-sizing:border-box}
.card-title{font-weight:bold;font-size:1.1rem;color:var(--rubin);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:15px}
.field{margin-bottom:16px;display:flex;flex-direction:column}
label{font-weight:bold;font-size:0.85rem;margin-bottom:6px;color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid #cbd5e1;border-radius:4px;box-sizing:border-box;font-size:1rem;background:#fff;width:100%;color:var(--text)}
body:has(#ow-checkbox:checked) #return-box{opacity:0.25;pointer-events:none}
body:has(#ow-checkbox:checked) #return-box input{background-color:#cbd5e1!important;border-color:#94a3b8!important}
body:has(#ow-checkbox:checked) .seg-state{background-color:var(--gold)!important;color:#000}
.switch-container{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:0 10px;border:1px solid #cbd5e1;border-radius:4px;height:40px;box-sizing:border-box}
.switch-container.yellow-highlight{background-color:var(--lowcost-yellow);border:1px solid #eab308}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;border-radius:20px;transition:.3s}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background-color:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background-color:var(--lock-green)!important}
.switch input:checked+.slider:before{transform:translateX(18px)}
.button-bar{width:100%;border:2px solid var(--border);background:#fff;border-radius:8px;padding:15px;box-sizing:border-box}
.btn-flow{display:flex;flex-wrap:wrap;gap:10px}
.touch-btn{flex:1 1 140px;display:flex;align-items:center;justify-content:center;height:45px;color:#fff;font-weight:bold;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem;text-transform:uppercase}
.btn-google{background:#4285f4}.btn-skyscanner{background:#007054}.btn-kayak{background:#ff690f}.btn-momondo{background:#84329b}.btn-kiwi{background:#00a699}.btn-trip{background:#2f55d4}
</style>
</head>
