<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - 80% MASTER SUCCESS</title>
    <style>
        :root { --primary: #1e40af; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --lowcost-yellow: #fef08a; --gold: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--primary); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--primary); background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        body:has(#ow-checkbox:checked) #return-box { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed !important; opacity: 0.35 !important; pointer-events: none !important; border-color: #94a3b8 !important; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid #eab308; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        .switch input:checked + .slider { background-color: #22c55e !important; }
        .switch input:checked + .slider:before { transform: translateX(18px); }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold); font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    <datalist id="airports-complete">
        <option value="Berlin (BER)"></option><option value="Frankfurt (FRA)"></option><option value="Manila (MNL)"></option><option value="Cebu (CEB)"></option><option value="Bangkok (BKK)"></option><option value="Singapore (SIN)"></option>
    </datalist>
    <div class="card">
        <div class="title"><span>✈️ Sektion 1: Flug-Parameter</span><span style="font-size: 0.75rem; background: #dbeafe; padding: 2px 6px; border-radius: 4px; color: var(--primary);">[VERSION 2026 - 80% MASTER]</span></div>
        <div class="grid">
            <div><label>Abflugort:</label><input type="text" placeholder="z.B. BER" id="fl-from" list="airports-complete" oninput="checkEngine()"></div>
            <div><label>Zielort:</label><input type="text" placeholder="z.B. MNL" id="fl-to" list="airports-complete" oninput="checkEngine()"></div>
            <div><label>Hinflug:</label><input type="date" id="fl-date1" onchange="checkEngine()"></div>
            <div><label>Rückflug:</label><input type="date" id="return-box" onchange="checkEngine()" oninput="checkEngine()"></div>
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="ow-checkbox" onchange="checkEngine()"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" id="fl-lowcost" onchange="checkEngine()"><span class="slider"></span></label></div>
            <div><label>Beförderungsklasse:</label><select id="fl-cabin" onchange="checkEngine()"><option value="Economy">Economy</option><option value="Premium Economy">Premium Economy</option><option value="Business">Business Class</option><option value="First">First Class</option></select></div>
            <div><label>Personen:</label><select id="fl-passengers" onchange="checkEngine()"><option value="1">1 Person</option><option value="2" selected>2 Personen</option><option value="3">3 Personen</option></select></div>
            <div>
                <label>Gepäck:</label>
                <select id="fl-baggage" onchange="checkEngine()">
                    <option value="Handgepäck">Handgepäck</option><option value="1x 20kg">1x 20 KG Gepäck</option><option value="1x 32kg">1x 32 KG Gepäck</option><option value="Handgepäck + 20 KG">Handgepäck + 20 KG</option><option value="Handgepäck + 32 KG">Handgepäck + 32 KG</option>
                </select>
            </div>
            <div>
                <label>Stopps:</label>
                <select id="fl-stops" onchange="checkEngine()"><option value="" selected></option><option value="Direktflug">Direktflug</option><option value="max 1 Stopp">Max. 1 Stopp</option><option value="max 2 Stopps">Max. 2 Stopps</option></select>
            </div>
            <div class="full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai (DXB)" id="fl-stop-location" list="airports-complete" oninput="checkEngine()"></div>
            <div><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. CEB" id="fl-from2" list="airports-complete"></div>
            <div><label>Preis Anschlussflug (€):</label><input type="number" placeholder="z.B. 80" id="fl-price2" value="0" oninput="checkEngine()"></div>
            <div class="full"><label>Haupt-Ticketpreis (€):</label><input type="number" placeholder="z.B. 800" id="fl-price" value="0" oninput="checkEngine()"></div>
            <div class="full" style="background:#fff; padding:8px 10px; border:1px solid var(--border); border-radius:4px;">
                <label id="range-label">Max. Reisezeit: 30 Std.</label><input type="range" id="fl-max-time" min="5" max="50" value="30" style="height:20px;" oninput="document.getElementById('range-label').innerText = 'Max. Reisezeit: ' + this.value + ' Std.'; checkEngine();">
            </div>
            <div class="full" style="margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 15px;">
                <label>Bevorzugtes Suchportal:</label>
                <select id="portal-selector" onchange="checkEngine()">
                    <option value="google">Google Flights</option><option value="skyscanner">Skyscanner</option><option value="kiwi">Kiwi.com</option><option value="trip">Trip.com (Asien-Spezialist)</option>
                </select>
            </div>
            <div class="full"><a href="#" target="_blank" class="btn" id="btn-search-flights">Gold - Flug-Suche starten</a></div>
        </div>
    </div>
</div>
<script>
    function checkEngine() {
        var d1 = document.getElementById('fl-date1'), d2 = document.getElementById('return-box'), ow = document.getElementById('ow-checkbox');
        var f1 = document.getElementById('fl-from'), t1 = document.getElementById('fl-to'), pSel = document.getElementById('portal-selector'), mBtn = document.getElementById('btn-search-flights'), sTime = document.getElementById('fl-max-time');
        var date1 = d1.value, date2 = d2.value;
        if (ow.checked) { d2.disabled = true; d2.value = ""; } 
        else { d2.disabled = false; if (date1) { d2.min = date1; if (!date2 || date2 < date1) { d2.value = date1; date2 = date1; } } }
        var getIATA = function(t) { var m = t.match(/\(([^)]+)\)/); return m ? m.toUpperCase().trim() : t.toUpperCase().trim(); };
        var from = getIATA(f1.value), to = getIATA(t1.value);
        if (from.length === 3 && to.length === 3 && date1) {
            var mode = pSel.value, sl = "/", cabin = document.getElementById('fl-cabin').value, pax = document.getElementById('fl-passengers').value, bag = document.getElementById('fl-baggage').value, stops = document.getElementById('fl-stops').value, duration = sTime.value;
            var q = "flights from " + from + " to " + to + " on " + date1 + (ow.checked ? " one way" : " return " + date2);
            if (mode === "google") mBtn.href = "https:" + sl + sl + "google.com" + sl + "travel" + sl + "flights?q=" + encodeURIComponent(q + " class:" + cabin + " passengers:" + pax + " baggage:" + bag + " stops:" + stops + " max duration:" + duration + " hours") + "&hl=de";
            else if (mode === "skyscanner") mBtn.href = "https:" + sl + sl + "www.skyscanner.de" + sl + "transport" + sl + "flights" + sl + from.toLowerCase() + sl + to.toLowerCase() + sl + date1.replace(/-/g, '').substring(2) + (ow.checked ? sl + "?adults=" + pax + "&rtn=0" : sl + date2.replace(/-/g, '').substring(2) + sl + "?adults=" + pax + "&rtn=1") + "&language=de";
            else if (mode === "kiwi") mBtn.href = "https:" + sl + sl + "kiwi.com" + sl + "de" + sl + "search" + sl + "tiles" + sl + from.toLowerCase() + sl + to.toLowerCase() + sl + date1 + (ow.checked ? "" : sl + date2);
