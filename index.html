<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - NO-JS PRO</title>
    <style>
        :root { --ocean-blue: #0284c7; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --google-red: #ea4335; --sky-blue: #0284c7; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--ocean-blue); }
        
        /* Schicke, getrennte Sektionen für absolute Stabilität */
        .card { border: 2px solid var(--ocean-blue); border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 12px; font-size: 1.1rem; color: var(--ocean-blue); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* Die echten, unblockierbaren Buttons */
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; margin-top: 10px; }
        .g-btn { background-color: var(--google-red); }
        .s-btn { background-color: var(--sky-blue); }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports">
        <option value="FRA"></option><option value="MNL"></option><option value="CEB"></option><option value="BKK"></option><option value="SIN"></option>
    </datalist>

    <!-- BLOCK 1: HIN- UND RÜCKFLUG (Formular sendet direkt an Google Flights) -->
    <form action="https://google.com" method="get" target="_blank" class="card">
        <div class="title">
            <span>✈️ Variante A: Hin- & Rückflug</span>
            <span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: var(--ocean-blue);">[STABLE]</span>
        </div>
        <input type="hidden" name="tbm" value="fl">
        <div class="grid">
            <div><label>Abflugort:</label><input type="text" name="q" placeholder="z.B. google flights FRA" value="google flights FRA" list="airports" required></div>
            <div><label>Zielort:</label><input type="text" placeholder="z.B. MNL" list="airports"></div>
            <div><label>Hinflug-Datum:</label><input type="date" required></div>
            <div><label>Rückflug-Datum:</label><input type="date" required></div>
            <div class="full">
                <button type="submit" class="btn g-btn">Rot - Google Flights starten ➔</button>
            </div>
        </div>
    </form>

    <!-- BLOCK 2: NUR HINFLUG (Das Rückflugfeld existiert hier physisch gar nicht!) -->
    <form action="https://google.com" method="get" target="_blank" class="card" style="border-color: #0284c7; background: #f0f9ff;">
        <div class="title" style="color: #0284c7;">
            <span>✈️ Variante B: Nur Hinflug (One Way)</span>
            <span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: #0284c7;">[EXPERT]</span>
        </div>
        <input type="hidden" name="tbm" value="fl">
        <div class="grid">
            <div><label>Abflugort:</label><input type="text" name="q" placeholder="z.B. google flights FRA" value="google flights FRA" list="airports" required></div>
            <div><label>Zielort:</label><input type="text" placeholder="z.B. MNL" list="airports"></div>
            <div class="full"><label>Hinflug-Datum:</label><input type="date" required></div>
            <div class="full">
                <button type="submit" class="btn s-btn">Blau - One-Way Suche starten ➔</button>
            </div>
        </div>
    </form>

</div>
</body>
</html>
