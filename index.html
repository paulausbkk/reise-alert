<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO</title>
    <style>
        :root { --primary-purple: #6d28d9; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --gold-yellow: #f59e0b; --airport-blue: #1e40af; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--primary-purple); background: #faf5ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary-purple); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        .input-wrapper { position: relative; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        input:disabled, select:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; }
        
        /* Die unzerstörbare Vorschlagsbox */
        .dropdown-box { position: absolute; top: 42px; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 4px; max-height: 180px; overflow-y: auto; z-index: 999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
        .dropdown-item { padding: 8px 12px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; color: #1e293b; }
        .dropdown-item:hover { background-color: #f1f5f9; }
        .dropdown-item span { color: var(--airport-blue); font-weight: bold; font-size: 0.95rem; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e !important; }
        input:checked + .slider:before { transform: translateX(18px); }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold-yellow); font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn:hover { background: #d97706; }
        .disabled-btn { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed; pointer-events: none; box-shadow: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #f3e8ff; padding: 2px 6px; border-radius: 4px; color: var(--primary-purple);">[VERSION 2026 - LIME REPAIR]</span>
        </div>
        <div class="grid">
            <div class="input-wrapper"><label>Abflugort:</label><input type="text" placeholder="z.B. Frankfurt" id="fl-from" autocomplete="off"><div class="dropdown-box" id="drop-from"></div></div>
            <div class="input-wrapper"><label>Zielort:</label><input type="text" placeholder="z.B. Manila" id="fl-to" autocomplete="off"><div class="dropdown-box" id="drop-to"></div></div>
            <div><label>Hinflug:</label><input type="date" id="fl-date1"></div>
            <div><label>Rückflug:</label><input type="date" id="fl-date2"></div>
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="fl-oneway"><span class="slider"></span></label></div>
            <div class="switch-container" style="background-color:#fef08a; border-color:#eab308;"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" id="fl-lowcost"><span class="slider"></span></label></div>
            <div>
                <label>Beförderungsklasse:</label>
                <select id="fl-cabin"><option value="economy">Economy</option><option value="premium">Premium Economy</option><option value="business">Business Class</option><option value="first">First Class</option></select>
            </div>
            <div>
                <label>Personen:</label>
                <select id="fl-passengers"><option value="1">1 Person</option><option value="2" selected>2 Personen</option><option value="3">3 Personen</option></select>
            </div>
            <div>
                <label>Gepäck:</label>
                <select id="fl-baggage"><option value="hand">Handgepäck</option><option value="20kg">1x 20 KG Aufgabegepäck</option><option value="23kg">1x 23 KG Aufgabegepäck</option><option value="32kg">1x 32 KG Aufgabegepäck</option><option value="2pieces">2 Gepäckstücke</option></select>
            </div>
            <div>
                <label>Stopps:</label>
                <select id="fl-stops"><option value="0">Direktflug</option><option value="1">Max. 1 Stopp</option><option value="2">Max. 2 Stopps</option></select>
            </div>
            <div class="input-wrapper full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai" id="fl-stop-location" autocomplete="off"><div class="dropdown-box" id="drop-stop"></div></div>
            <div class="input-wrapper"><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. Cebu" id="fl-from2" autocomplete="off"><div class="dropdown-box" id="drop-from2"></div></div>
            <div><label>Preis Anschlussflug (€):</label><input type="number" placeholder="80" id="fl-price2"></div>
            <div class="full"><label>Haupt-Ticketpreis (€):</label><input type="number" placeholder="800" id="fl-price"></div>
            <div class="full" style="background:#fff; padding:8px 10px; border:1px solid var(--border); border-radius:4px;">
                <label id="range-label">Max. Reisezeit: 30 Std.</label>
                <input type="range" id="fl-max-time" min="5" max="50" value="30" style="height:20px;" oninput="document.getElementById('range-label').innerText = 'Max. Reisezeit: ' + this.value + ' Std.'">
            </div>
            <div class="full" style="margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 15px;">
                <label>Bevorzugtes Suchportal:</label>
                <select id="portal-selector"><option value="google">Google Flights (Direkt-Modus)</option><option value="skyscanner">Skyscanner (Direkt-Modus)</option></select>
            </div>
            <div class="full"><a href="#" target="_blank" class="btn disabled-btn" id="btn-search-flights">Gold - Flug-Suche starten</a></div>
        </div>
    </div>
</div>

<script>
    var d1 = document.getElementById('fl-date1');
    var d2 = document.getElementById('fl-date2');
    var ow = document.getElementById('fl-oneway');
    var f1 = document.getElementById('fl-from');
    var t1 = document.getElementById('fl-to');
    var sLoc = document.getElementById('fl-stop-location');
    var f2 = document.getElementById('fl-from2');
    var pSel = document.getElementById('portal-selector');
    var mBtn = document.getElementById('btn-search-flights');

    var airports = [
        {city: "Abu Dhabi", code: "AUH"}, {city: "Antalya", code: "AYT"}, {city: "Bangkok", code: "BKK"},
        {city: "Berlin", code: "BER"}, {city: "Cebu", code: "CEB"}, {city: "Christchurch", code: "CHC"},
        {city: "Da Nang", code: "DAD"}, {city: "Doha", code: "DOH"}, {city: "Dresden", code: "DRS"},
        {city: "Dumaguete", code: "DGT"}, {city: "Düsseldorf", code: "DUS"}, {city: "Frankfurt", code: "FRA"},
        {city: "Hamburg", code: "HAM"}, {city: "Hanoi", code: "HAN"}, {city: "Hongkong", code: "HKG"},
        {city: "Istanbul", code: "IST"}, {city: "Kuala Lumpur", code: "KUL"}, {city: "Leipzig", code: "LEJ"},
        {city: "London Heathrow", code: "LHR"}, {city: "Los Angeles", code: "LAX"}, {city: "Manila", code: "MNL"},
        {city: "München", code: "MUC"}, {city: "New York", code: "JFK"}, {city: "Pagadian", code: "PAG"},
        {city: "Paphos", code: "PFO"}, {city: "Phuket", code: "HKT"}, {city: "Saigon", code: "SGN"},
        {city: "Singapore", code: "SIN"}, {city: "Tokyo Haneda", code: "HND"}, {city: "Wien", code: "VIE"},
        {city: "Zürich", code: "ZRH"}
    ];

    d1.value = "2026-11-15"; d2.value = "2026-11-25";

    function initDropdown(inputEl, boxEl) {
        inputEl.addEventListener('input', function() {
            var val = this.value.toLowerCase().trim();
            boxEl.innerHTML = "";
            if(!val) { boxEl.style.display = "none"; return; }
            var matches = airports.filter(function(a) {
                return a.city.toLowerCase().includes(val) || a.code.toLowerCase().includes(val);
            });
