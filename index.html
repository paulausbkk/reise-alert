<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f0f4f8; 
            --card-bg: #ffffff; 
            --text: #1e293b; 
            --border: #cbd5e1; 
            --flight: #0284c7; 
            --hotel: #0f766e; 
            --upgrade: #6d28d9; 
            --warn: #dc2626;
            --success: #16a34a;
            --asia: #ea580c;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card.fl { border-color: var(--flight); background: #f0f9ff; }
        .card.ho { border-color: var(--hotel); background: #f0fdf4; }
        .card.up { border-color: var(--upgrade); background: #faf5ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .fl .title { color: var(--flight); } 
        .ho .title { color: var(--hotel); } 
        .up .title { color: var(--upgrade); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; color: #475569; }
        input, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); }
        .btn-up { background: var(--upgrade); }
        .pass-box { position: relative; }
        .eye { position: absolute; right: 10px; top: 24px; cursor: pointer; font-size: 1.1rem; user-select: none; }
        .res-box { margin-top: 15px; padding: 15px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; }
        .l-btn { display: block; text-align: center; padding: 10px; margin-bottom: 8px; border-radius: 6px; text-decoration: none; color: white; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        .l-btn:hover { opacity: 0.9; }
        .l-btn.fl-btn { background: var(--flight); }
        .l-btn.ho-btn { background: var(--hotel); }
        .l-btn.up-btn { background: var(--upgrade); }
        .l-btn.as-btn { background: var(--asia); }
        
        /* Budget Rechner Display */
        .budget-calc-box { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; border: 1px solid #cbd5e1; }
        .budget-ok { background: #e6f4ea; color: var(--success); border-color: #a3cfbb; }
        .budget-error { background: #fce8e6; color: var(--warn); border-color: #f1aeb5; }

        /* Upgrade Protokoll Styling */
        .up-proto { margin-top: 15px; padding: 10px; background: #fff; border: 1px dashed var(--upgrade); border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #334155; }
        .check-box-container { display: flex; align-items: center; gap: 8px; margin-top: 5px; background: #fff7ed; padding: 8px; border: 1px dashed var(--asia); border-radius: 4px; }
        .check-box-container input { width: auto; cursor: pointer; }
        .check-box-container label { margin-bottom: 0; color: #c2410c; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. PASSWORT BEREICH -->
    <div id="auth-section">
        <h1>🔒 Passwort erforderlich</h1>
        <div class="form-group pass-box">
            <label>Passwort:</label>
            <input type="password" id="p-field" autocomplete="off" onkeydown="if(event.key==='Enter'){ event.preventDefault(); if(document.getElementById('p-field').value.trim()==='Reise2026'){ document.getElementById('auth-section').style.display='none'; document.getElementById('main-content').style.display='block'; }else{ alert('Falsches Passwort!'); } }">
            <span class="eye" onclick="if(document.getElementById('p-field').type==='password'){ document.getElementById('p-field').type='text'; this.innerText='👁️‍🗨️'; }else{ document.getElementById('p-field').type='password'; this.innerText='👁️'; }">👁️</span>
        </div>
        <button class="btn btn-main" type="button" onclick="if(document.getElementById('p-field').value.trim()==='Reise2026'){ document.getElementById('auth-section').style.display='none'; document.getElementById('main-content').style.display='block'; }else{ alert('Falsches Passwort!'); }">Freischalten</button>
    </div>

    <!-- 2. HAUPT-INHALT -->
    <div id="main-content" style="display: none;">
        <h1>✈️ McKinney Reisekonfiguration PRO</h1>
        
        <!-- SEKTION 1: FLUG KARTE -->
        <div class="card fl">
            <div class="title">✈️ Sektion 1: Flug-Parameter</div>
            <div class="grid">
                <div><label>Abflug (Code):</label><input type="text" id="dep" value="FRA"></div>
                <div><label>Endziel (Code):</label><input type="text" id="dest" value="MIA" oninput="checkAsiaDestination()"></div>
                <div class="full"><label>📍 Optionaler Stopover / Zwischenaufenthalt:</label><input type="text" id="via" placeholder="z.B. NYC"></div>
                <div><label>Frühestes Datum:</label><input type="date" id="start" value="2026-06-01"></div>
                <div><label>Spätestes Datum:</label><input type="date" id="end" value="2026-08-31"></div>
                <div><label>Zwischenstopps Filter:</label><select id="stops"><option value="any">Alle</option><option value="direct">Nur Direkt</option><option value="max1">Max 1</option><option value="max2">Max 2</option></select></div>
                <div><label>Klasse:</label><select id="cabin"><option value="economy">Economy</option><option value="premium">Premium Eco</option><option value="business">Business</option><option value="first">First</option></select></div>
                
                <div class="full">
                    <label>🧳 Reisegepäck:</label>
                    <select id="baggage">
                        <option value="nur handgepäck">nur handgepäck</option>
                        <option value="aufgabegepäck bis 20 kg">aufgabegepäck bis 20 kg</option>
                        <option value="aufgabegepäck bis 32 kg">aufgabegepäck bis 32 kg</option>
                        <option value="aufgabegepäck 20 kg plus handgepäck">aufgabegepäck 20 kg plus handgepäck</option>
                        <option value="aufgabegepäck plus handgepäck">aufgabegepäck plus handgepäck</option>
                    </select>
                </div>

                <!-- NEUER ASIEN MODUS SCHALTER -->
                <div class="full check-box-container">
                    <input type="checkbox" id="asia-mode">
                    <label for="asia-mode">💥 Asiatische Billigflieger aktivieren (Cebu, VietJet, AirAsia etc.)</label>
                </div>

                <div class="full"><label>Maximaler Ticketpreis (€):</label><input type="number" id="max-flight-price" placeholder="z.B. 1200"></div>
                <div class="full"><label>Max. Reisezeit: <span id="t-val">18 h</span></label><input type="range" id="m-time" min="5" max="40" value="18" oninput="document.getElementById('t-val').innerText = this.value + ' h'"></div>
            </div>
        </div>

        <!-- SEKTION 2: UPGRADE KARTE -->
        <div class="card up">
            <div class="title">💎 Sektion 2: Upgrade- & Status-Manager</div>
            <div class="grid">
                <div class="full"><label>Geplante Fluggesellschaft (z.B. Lufthansa):</label><input type="text" id="airline" value="Lufthansa"></div>
                <div><label>Aktueller Status:</label><input type="text" id="status" placeholder="z.B. Frequent Traveller"></div>
                <div><label>Buchungsnummer (PNR):</label><input type="text" id="booking-code" placeholder="z.B. A1B2C3"></div>
                <div class="full"><label>Name wie im Reisepass:</label><input type="text" id="passport-name" placeholder="z.B. MUSTERMANN / MAX DR"></div>
                <div><label>Reisepassnummer:</label><input type="text" id="passport-num" placeholder="z.B. CXXXXXXXX"></div>
                <div><label>Ticketnummer:</label><input type="text" id="ticket-num" placeholder="z.B. 220-1234567890"></div>
                <div class="full"><label>Maximaler Preis für das Upgrade (€):</label><input type="number" id="max-upgrade-price" placeholder="z.B. 450"></div>
            </div>
        </div>

        <!-- SEKTION 3: HOTEL KARTE -->
        <div class="card ho">
            <div class="title">🏨 Sektion 3: Hotel- & Budgetplanung</div>
            <div class="grid">
                <div><label>Gesamtbudget (€):</label><input type="number" id="total-budget" value="3000" oninput="calcBudget()"></div>
                <div><label>Max. Hotelpreis / Nacht (€):</label><input type="number" id="hotel-per-night" value="150" oninput="calcBudget()"></div>
                <div><label>Anzahl Nächte:</label><input type="number" id="nights" value="10" oninput="calcBudget()"></div>
                <div><label>Geschätzte Flugkosten (€):</label><input type="number" id="est-flight" value="800" oninput="calcBudget()"></div>
                
                <!-- Live Budgetrechner -->
                <div class="full">
                    <label>Live-Budget-Status:</label>
                    <div id="budget-display" class="budget-calc-box budget-ok">Berechnung läuft...</div>
                </div>

                <!-- Hotel-Zielort ganz unten -->
