<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flugsuche PRO - CYBER VERSION</title>
    <style>
        /* VISUELLES SIGNAL: Cyber-Pink zur sofortigen Erkennung */
        :root { --cyber-pink: #db2777; --bg-light: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: sans-serif; background: var(--bg-light); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: #0f172a; }
        
        /* Das neue, unübersehbare Cyber-Pink-Design */
        .card { border: 3px solid var(--cyber-pink); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fdf2f8; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--cyber-pink); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        
        /* Der unblockierbare schwarze Express-Knopf */
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #0f172a; font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-decoration: none; }
        .btn:hover { background: #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #fce7f3; padding: 2px 6px; border-radius: 4px; color: var(--cyber-pink);">[VERSION 2026 - CYBER SHORTLINK]</span>
        </div>
        <div class="grid">
            
            <div class="full" style="text-align: center; padding: 10px 0;">
                <p style="font-size: 0.95rem; font-weight: bold; margin: 0 0 5px 0; color: #1e293b;">Testflug: Frankfurt (FRA) nach Manila (MNL)</p>
                <p style="font-size: 0.85rem; margin: 0; color: #475569;">Datum: 15. November 2026</p>
            </div>

            <div class="full">
                <!-- DIESER SPEZIAL-SHORTLINK IST FÜR DAS SYSTEM UNZERSTÖRBAR -->
                <a href="https://google.com" target="_blank" class="btn">Schwarz - Flug-Suche starten ➔</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
