<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - DATE LOCK</title>
    <style>
        :root { --primary-blue: #0284c7; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --flight: #0284c7; --lowcost-yellow: #fef08a; --lowcost-border: #eab308; --active-green: #22c55e; --gold-yellow: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--primary-blue); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--primary-blue); background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary-blue); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        input:disabled, select:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; border: 1px solid #94a3b8; }
        
        /* Das rote Warnsignal bei falschem Datum */
        input.date-error { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; font-weight: bold; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid var(--lowcost-border); }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-green) !important; }
        input:checked + .slider:before { transform: translateX(18px); }
        .range-container { background: #fff; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold-yellow); font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn:hover { background: #d97706; }
        .disabled-btn { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed; pointer-events: none; box-shadow: none; border-color: #cbd5e1 !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports-complete">
        <option value="Abu Dhabi (AUH)"></option><option value="Antalya (AYT)"></option><option value="Bangkok (BKK)"></option><option value="Berlin (BER)"></option><option value="Cebu (CEB)"></option><option value="Christchurch (CHC)"></option><option value="Da Nang (DAD)"></option><option value="Doha (DOH)"></option><option value="Dresden (DRS)"></option><option value="Dumaguete (DGT)"></option><option value="Düsseldorf (DUS)"></option><option value="Frankfurt (FRA)"></option><option value="Hamburg (HAM)"></option><option value="Hanoi (HAN)"></option><option value="Hongkong (HKG)"></option><option value="Istanbul (IST)"></option><option value="Kuala Lumpur (KUL)"></option><option value="Leipzig (LEJ)"></option><option value="London Heathrow (LHR)"></option><option value="Los Angeles (LAX)"></option><option value="Manila (MNL)"></option><option value="München (MUC)"></option><option value="New York (JFK)"></option><option value="Pagadian (PAG)"></option><option value="Paphos (PFO)"></option><option value="Phuket (HKT)"></option><option value="Saigon / Ho-Chi-Minh-Stadt (SGN)"></option><option value="Singapore (SIN)"></option><option value="Tokyo Haneda (HND)"></option><option value="Wien (VIE)"></option><option value="Zürich (ZRH)"></option>
    </datalist>

    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: var(--primary-blue);">[VERSION 2026 - DATE LOCK]</span>
        </div>
        <div class="grid">
            <div><label>Abflugort:</label><input type="text" placeholder="z.B. Frankfurt" id="fl-from" list="airports-complete"></div>
            <div><label>Zielort:</label><input type="text" placeholder="z.B. Manila" id="fl-to" list="airports-complete"></div>
            <div><label>Hinflug:</label><input type="date" id="fl-date1"></div>
            <div><label>Rückflug:</label><input type="date" id="fl-date2"></div>
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="fl-oneway"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" id="fl-lowcost"><span class="slider"></span></label></div>
            <div>
                <label>Beförderungsklasse:</label>
                <select id="fl-cabin"><option value="economy">Economy</option><option value="premium">Premium Economy</option><option value="business">Business Class</option><option value="first">First Class</option></select>
            </div>
            <div>
                <label>Personen:</label>
                <select id="fl-passengers"><option value="1">1 Person</option><option value="2" selected>2 Personen</option><option value="3">3 Personen</option></select>
            </div>
            <div>
                <label>Gepäck:</label>
                <select id="fl-baggage">
                    <option value="hand">Handgepäck</option>
                    <option value="20kg">1x 20 KG Aufgabegepäck</option>
                    <option value="23kg">1x 23 KG Aufgabegepäck</option>
                    <option value="32kg">1x 32 KG Aufgabegepäck</option>
                    <option value="2pieces">2 Gepäckstücke</option>
                </select>
            </div>
            <div>
                <label>Stopps:</label>
                <select id="fl-stops"><option value="0">Direktflug</option><option value="1">Max. 1 Stopp</option><option value="2">Max. 2 Stopps</option></select>
            </div>
            <div class="full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai" id="fl-stop-location" list="airports-complete"></div>
            
            <div><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. Cebu" id="fl-from2" list="airports-complete"></div>
            <div><label>Preis Anschlussflug (€):</label><input type="number" placeholder="80" id="fl-price2"></div>
            <div class="full"><label>Haupt-Ticketpreis (€):</label><input type="number" placeholder="800" id="fl-price"></div>
            
            <div class="full range-container">
                <label id="range-label">Max. Reisezeit: 30 Std.</label>
                <input type="range" id="fl-max-time" min="5" max="50" value="30" style="height:20px;" oninput="document.getElementById('range-label').innerText = 'Max. Reisezeit: ' + this.value + ' Std.'">
            </div>
            
            <div class="full" style="margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 15px;">
                <label>Bevorzugtes Suchportal:</label>
                <select id="portal-selector">
                    <option value="google">Google Flights (Direkt-Modus)</option>
                    <option value="skyscanner">Skyscanner (Direkt-Modus)</option>
                </select>
            </div>

            <div class="full">
                <a href="#" target="_blank" class="btn disabled-btn" id="btn-search-flights">Gold - Flug-Suche starten</a>
            </div>
        </div>
    </div>
</div>

<script>

    var d2 = document.getElementById('fl-date2');
    var ow = document.getElementById('fl-oneway');
    var fInput1 = document.getElementById('fl-from');
    var tInput1 = document.getElementById('fl-to');
    var pSelect = document.getElementById('portal-selector');
    var mBtn = document.getElementById('btn-search-flights');

    // Standarddaten fest hinterlegen
    d1.value = "2026-11-15"; 
    d2.value = "2026-11-25";

    // Globale Variable zur Prüfung von Datumsfehlern
    var hasDateError = false;

    var checkDates = function() {

            updateMasterEngine();
            return;
        }
        
        if (d1.value && d2.value && d2.value < d1.value) {
            d2.classList.add('date-error'); 
            hasDateError = true;
        } else {
