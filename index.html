<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .hidden {
            display: none;
        }
        .result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            box-sizing: border-box;
        }
        .kiwi-btn { background-color: #00a699; }
        .kiwi-btn:hover { background-color: #00847a; }
        .booking-btn { background-color: #003580; }
        .booking-btn:hover { background-color: #002254; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Passwort-Bereich -->
    <div id="auth-section">
        <h1>🔒 Bitte Passwort eingeben</h1>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Passwort hier eingeben...">
        </div>
        <button onclick="checkPassword()">Freischalten</button>
        <p id="error-msg" style="color: #dc2626; text-align: center; font-size: 0.9rem; margin-top: 1rem;" class="hidden">Falsches Passwort. Bitte versuche es erneut.</p>
    </div>

    <!-- 2. Eigentlicher Formular-Bereich (wird erst nach Passwort sichtbar) -->
    <div id="main-content" class="hidden">
        <h1>✈️ McKinney Reisekonfiguration</h1>
        
        <div class="form-group">
            <label for="departure">Abflughafen (Code):</label>
            <input type="text" id="departure" value="FRA" placeholder="z.B. FRA, MUC, BER">
        </div>

        <div class="form-group">
            <label for="destination">Zielflughafen (Code):</label>
            <input type="text" id="destination" value="MIA" placeholder="z.B. MIA, JFK, LAX">
        </div>

        <div class="form-group">
            <label for="start-date">Frühestes Hinreisedatum:</label>
            <input type="date" id="start-date" value="2026-06-01">
        </div>

        <div class="form-group">
            <label for="end-date">Spätestes Rückreisedatum:</label>
            <input type="date" id="end-date" value="2026-08-31">
        </div>

        <div class="form-group">
            <label for="duration-min">Mindestaufenthalt (Nächte):</label>
            <input type="number" id="duration-min" value="10" min="1">
        </div>

        <div class="form-group">
            <label for="duration-max">Maximalaufenthalt (Nächte):</label>
            <input type="number" id="duration-max" value="14" min="1">
        </div>

        <div class="form-group">
            <label for="hotel-stars">Mindest-Sterne (Hotel):</label>
            <select id="hotel-stars">
                <option value="3">3 Sterne</option>
                <option value="4" selected>4 Sterne</option>
                <option value="5">5 Sterne</option>
            </select>
        </div>

        <div class="form-group">
            <label for="max-budget">Maximales Gesamtbudget (€):</label>
            <input type="number" id="max-budget" value="2500" min="100">
        </div>

        <button onclick="generateLinks()">Live-Suchlinks generieren</button>

        <!-- 3. Ergebnis-Bereich für die Links -->
        <div id="results" class="result-box hidden">
            <h3 style="margin-top: 0;">Deine persönlichen Suchlinks:</h3>
            <a id="kiwi-link" href="#" target="_blank" class="link-btn kiwi-btn">🥝 Flüge auf Kiwi.com suchen</a>
            <a id="booking-link" href="#" target="_blank" class="link-btn booking-btn">🏨 Hotels auf Booking.com suchen</a>
        </div>
    </div>
</div>

<script>
    // Passwort-Schutz prüfen
    function checkPassword() {
        const input = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('error-msg');
        
        if (input === 'Reise2026') {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        } else {
            errorMsg.classList.remove('hidden');
        }
    }

    // Eingabe per Enter-Taste im Passwortfeld erlauben
    document.getElementById('password-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });

    // Datumsformatierung für Kiwi (DD/MM/YYYY)
    function formatDateKiwi(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    // Links dynamisch zusammenbauen
    function generateLinks() {
        const dep = document.getElementById('departure').value.trim().toLowerCase();
        const dest = document.getElementById('destination').value.trim().toLowerCase();
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const durMin = document.getElementById('duration-min').value;
        const durMax = document.getElementById('duration-max').value;
        const stars = document.getElementById('hotel-stars').value;

        // 1. Unzerstörbarer Kiwi-Link (Flexibles Datumsfenster + Reisedauer)
        const kiwiStart = formatDateKiwi(start);
        const kiwiEnd = formatDateKiwi(end);
        const kiwiUrl = `https://kiwi.com{dep}/${dest}/${kiwiStart}-${kiwiEnd}/${durMin}-${durMax}`;
        
        // 2. Booking.com Link (Vorauswahl Ort und Filter-Anker für Sterne)
        // nclass=3: 3 Sterne, nclass=4: 4 Sterne, nclass=5: 5 Sterne
        const bookingUrl = `https://booking.com{encodeURIComponent(dest.toUpperCase())}&nclass=${stars}`;

        // Links setzen und Resultat-Box anzeigen
        document.getElementById('kiwi-link').href = kiwiUrl;
        document.getElementById('booking-link').href = bookingUrl;
        document.getElementById('results').classList.remove('hidden');
        
        // Sanftes Runterscrollen zu den Ergebnissen
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
