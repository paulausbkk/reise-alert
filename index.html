<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✈️ Reisekonfiguration PRO</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--g:#f59e0b;
--v:#15803d;--lg:#22c55e;--ly:#fef08a}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.cp{display:flex;gap:6px;background:#1e293b;padding:4px;border-radius:6px;
align-items:center}
.seg{font-size:.75rem;padding:4px 10px;border-radius:4px;font-weight:bold;
color:#fff;text-transform:uppercase;background:var(--v);text-decoration:none}
.seg.upg{background:#dc2626}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 420px;border:2px solid var(--r);border-radius:8px;padding:20px;
background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column;position:relative}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#475569}
input[type=text],input[type=date]{height:40px;padding:0 10px;
border:1px solid var(--b);border-radius:4px;box-sizing:border-box;
font-size:.98rem;background:#fff;width:100%}
.ac{position:absolute;top:65px;left:0;right:0;background:#fff;
border:1px solid var(--r);border-radius:4px;z-index:99;max-height:180px;
overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.ac div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;
font-size:.95rem}
.ac div:hover{background:#fee2e2;font-weight:bold}
.bn{background:#fff;border:2px solid #ff0000;border-radius:4px;
padding:9px 12px;color:#ff0000;font-weight:bold;font-size:.9rem;
line-height:1.35}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.bf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;height:45px;
color:#fff;font-weight:bold;border-radius:4px;font-size:.82rem;
text-transform:uppercase;text-decoration:none}
.b2{background:#007054}.b3{background:#ff690f}.b4{background:#84329b}
.b5{background:#00a699}.b6{background:#2f55d4}
.sb{position:relative;display:flex;align-items:center;background:#fff;
border:1px solid var(--b);border-radius:4px;height:40px;padding:0 26px;
user-select:none;touch-action:none;cursor:pointer}
.trk{position:relative;width:100%;height:6px;background:#cbd5e1;
border-radius:3px}
#fl{height:100%;background:var(--r);border-radius:3px;width:37%}
#sv{position:absolute;top:50%;left:37%;transform:translate(-50%,-50%);
width:48px;height:30px;line-height:30px;text-align:center;background:var(--r);
color:#fff;font-size:1.05rem;font-weight:bold;border-radius:15px;
box-shadow:0 2px 5px rgba(0,0,0,.3)}
#rb:has(input:invalid),#od:out-of-range{opacity:.35}
#rb:has(input:invalid) input,#od:out-of-range{background:#cbd5e1!important}
body:has(#ow:checked) #rb{opacity:.25;pointer-events:none}
body:has(#ow:checked) #rb input{background:#cbd5e1!important}
body:has(#ow:checked) .st{background:var(--g)!important;color:#000}
.swc{display:flex;align-items:center;justify-content:space-between;
background:#fff;padding:0 10px;border:1px solid var(--b);border-radius:4px;
height:40px}
.swc.yl{background:var(--ly);border:1px solid #eab308}
.sw{position:relative;display:inline-block;width:40px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#ccc;
border-radius:20px;transition:.3s}
.sl:before{position:absolute;content:"";height:16px;width:16px;left:3px;
bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.sw input:checked+.sl{background:var(--lg)!important}
.sw input:checked+.sl:before{transform:translateX(18px)}
</style>
</head>
<body>
<div class="hdr"><h1 class="tit">✈️ Reisekonfiguration PRO - DASHBOARD</h1>
<div class="cp"><div class="seg">15.11.2026</div>
<div class="seg st">5/5 AKTIV</div>
<a href="upgrade.html" class="seg upg">🎫 Upgrade-Cockpit ➡️</a></div>
</div>
<div class="row">
<div class="card">
<div class="ct">📋 Kern-Reisedaten (Direkt-Absprung)</div>
<div class="f"><label>Abflug (IATA oder Stadt)</label>
<input type="text" id="i1" placeholder="z.B. BER, FRA, MUC">
<div id="l1" class="ac"></div></div>
<div class="f"><label>Ziel (IATA oder Stadt)</label>
<input type="text" id="i2" placeholder="z.B. BKK, DAD, MNL">
<div id="l2" class="ac"></div></div>
<div class="f"><label>Hinflug</label>
<input type="date" id="od" min="2026-11-15"></div>
<div class="f" id="rb"><label>Rückflug</label>
<input type="date" id="rd" min="2026-11-15"></div>
</div>
<div class="card">
<div class="ct">⚙️ Filter & Flug-Parameter</div>
<div class="f"><div class="swc">
<label for="ow" style="margin:0;cursor:pointer">Nur Hinflug (One-Way Lock)</label>
<label class="sw"><input type="checkbox" id="ow"><span class="sl"></span></label>
</div></div>
<div class="f"><label>Max. Reisezeit (1 – 36 Std.)</label>
<div class="sb" id="sb"><div class="trk" id="tk">
<div id="fl"></div><div id="sv">14h</div></div></div></div>
<div class="f"><div class="swc yl">
<label for="ns" style="margin:0;cursor:pointer">Nur Direktflüge (Non-Stop)</label>
<label class="sw"><input type="checkbox" id="ns"><span class="sl"></span></label>
</div></div>
<div class="bn" id="bn">Bitte Abflug, Ziel & Datum wählen – danach Portal anklicken.</div>
</div>
</div>
<div class="bb">
<div class="bf">
<a id="u1" href="https://skyscanner.de" target="_blank" class="btn b2">Skyscanner</a>
<a id="u2" href="https://kayak.de" target="_blank" class="btn b3">Kayak</a>
<a id="u3" href="https://momondo.de" target="_blank" class="btn b4">Momondo</a>
<a id="u4" href="https://expedia.de" target="_blank" class="btn b5">Expedia</a>
<a id="u5" href="https://google.com" target="_blank" class="btn b6">Google Flights</a>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const ap=[
  ["BER","Berlin Brandenburg"],["FRA","Frankfurt am Main"],["MUC","München"],
  ["DUS","Düsseldorf"],["HAM","Hamburg"],["LEJ","Leipzig/Halle"],
  ["DRS","Dresden"],["VIE","Wien"],["ZRH","Zürich"],["IST","Istanbul"],
  ["BKK","Bangkok Suvarnabhumi"],["HKT","Phuket"],["CNX","Chiang Mai"],
  ["DAD","Da Nang"],["SGN","Ho-Chi-Minh-Stadt"],["HAN","Hanoi"],
  ["MNL","Manila"],["CEB","Cebu"],["SIN","Singapur"],["KUL","Kuala Lumpur"],
  ["DXB","Dubai"],["DOH","Doha"],["HND","Tokio Haneda"],["NRT","Tokio Narita"]
];
let hrs=14;
function code(v){
  const m=v.trim().toUpperCase().match(/\b([A-Z]{3})\b/);
  return m?m[1]:v.trim().toUpperCase().slice(0,3);
}
function ac(inp,box){
  inp.addEventListener("input",()=>{
    const q=inp.value.trim().toLowerCase();
    box.innerHTML="";
    if(!q){box.style.display="none";upd();return;}
    const hits=ap.filter(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    if(!hits.length){box.style.display="none";upd();return;}
    hits.forEach(h=>{
      const d=document.createElement("div");
      d.textContent=h[0]+" – "+h[1];
      d.onclick=()=>{inp.value=h[0]+" ("+h[1]+")";box.style.display="none";upd();};
      box.appendChild(d);
    });
    box.style.display="block";
    upd();
  });
  document.addEventListener("click",e=>{if(!box.contains(e.target)&&e.target!==inp)box.style.display="none";});
}
function upd(){
  const o=code($("i1").value),d=code($("i2").value);
  const od=$("od").value,rd=$("rd").value,ow=$("ow").checked,ns=$("ns").checked;
  const st=document.querySelector(".st");
  if(st)st.textContent=ow?"ONE-WAY":"HIN & RÜCK";
  if(o.length===3&&d.length===3&&od){
    const od6=od.replace(/-/g,"").slice(2);
    const rd6=(!ow&&rd)?rd.replace(/-/g,"").slice(2):"";
    $("u1").href="https://skyscanner.de/transport/fluge/"+o.toLowerCase()+"/"+d.toLowerCase()+"/"+od6+(rd6?"/"+rd6:"")+"/?adultsv2=1"+(ns?"&preferdirects=true":"");
    $("u2").href="https://kayak.de/flights/"+o+"-"+d+"/"+od+(rd6?"/"+rd:"")+"?sort=bestflight_a"+(ns?"&fs=stops=0":"")+"&fs=bfc=1;dur=-"+(hrs*60);
    $("u3").href="https://momondo.de/flight-search/"+o+"-"+d+"/"+od+(rd6?"/"+rd:"")+"?sort=bestflight_a"+(ns?"&fs=stops=0":"");
    $("u4").href="https://expedia.de/Flights-Search?trip="+(ow?"oneway":"roundtrip")+"&leg1=from:"+o+",to:"+d+",departure:"+od+"TANYT"+(!ow&&rd?"&leg2=from:"+d+",to:"+o+",departure:"+rd+"TANYT":"")+"&passengers=adults:1&mode=search";
    $("u5").href="https://google.com?q=Flights%20to%20"+d+"%20from%20"+o+"%20on%20"+od+(!ow&&rd?"%20through%20"+rd:"");
    $("bn").textContent="✅ Bereit: "+o+" → "+d+" | Max. "+hrs+"h"+(ns?" | Direktflug":"");
  }
  const s=JSON.stringify({i1:$("i1").value,i2:$("i2").value,od,rd,ow,ns,hrs});
  try{localStorage.setItem("rk_main",s)}catch(e){}
}
(function init(){
  try{
    const raw=localStorage.getItem("rk_main");
    if(raw){
      const d=JSON.parse(raw);
      if(d.i1)$("i1").value=d.i1;if(d.i2)$("i2").value=d.i2;
      if(d.od)$("od").value=d.od;if(d.rd)$("rd").value=d.rd;
      if(d.ow)$("ow").checked=true;if(d.ns)$("ns").checked=true;
      if(d.hrs)hrs=d.hrs;
    }
  }catch(e){}
  const pct=Math.round(((hrs-1)/35)*100);
  $("fl").style.width=pct+"%";$("sv").style.left=pct+"%";$("sv").textContent=hrs+"h";
  ac($("i1"),$("l1"));ac($("i2"),$("l2"));
  ["i1","i2","od","rd","ow","ns"].forEach(id=>{$(id).addEventListener("input",upd);$(id).addEventListener("change",upd);});
  const sb=$("sb"),tk=$("tk");
  let drag=false;
  function move(e){
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const r=tk.getBoundingClientRect();
    let p=Math.max(0,Math.min(1,(cx-r.left)/r.width));
    hrs=Math.round(1+p*35);
    const pc=Math.round(((hrs-1)/35)*100);
    $("fl").style.width=pc+"%";$("sv").style.left=pc+"%";$("sv").textContent=hrs+"h";
    upd();
  }
  sb.addEventListener("pointerdown",e=>{drag=true;move(e)});
  window.addEventListener("pointermove",e=>{if(drag)move(e)});
  window.addEventListener("pointerup",()=>{drag=false});
  upd();
})();
</script>
</body>
</html>
