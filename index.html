<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --kiwi: #00a699;
            --kiwi-hover: #00847a;
            --booking: #003580;
            --booking-hover: #002254;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-block {
            background: #fafafa;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: #475569;
        }
        input, select {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            margin-top: 0.5rem;
        }
        .action-btn:active {
            transform: scale(0.99);
        }
        .kiwi-btn { background-color: var(--kiwi); }
        .kiwi-btn:hover { background-color: var(--kiwi-hover); }
        .booking-btn { background-color: var(--booking); }
        .booking-btn:hover { background-color: var(--booking-hover); }
        
        .hidden { display: none; }
        
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Passwort-Bereich -->
    <div id="auth-section">
        <h1>🔒 Passwort erforderlich</h1>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Passwort eingeben...">
        </div>
        <button class="action-btn" style="background-color: var(--primary);" onclick="checkPassword()">Freischalten</button>
        <p id="error-msg" style="color: #dc2626; text-align: center; font-size: 0.9rem; margin-top: 1rem;" class="hidden">Falsches Passwort. Bitte versuche es erneut.</p>
    </div>

    <!-- 2. Haupt-Inhalt (Getrennte Sektionen) -->
    <div id="main-content" class="hidden">
        <h1>✈️ McKinney Reisekonfiguration</h1>
        
        <!-- FLUG-SUCHE SEKTION -->
        <div class="section-block" style="border-left: 4px solid var(--kiwi);">
            <h2>🥝 1. Flugsuche konfigurieren</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="departure">Abflughafen (Code):</label>
                    <input type="text" id="departure" value="FRA">
                </div>
                <div class="form-group">
                    <label for="destination">Zielflughafen (Code):</label>
                    <input type="text" id="destination" value="MIA" oninput="syncDestination(this.value)">
                </div>
                <div class="form-group">
                    <label for="start-date">Frühestes Hinreisedatum:</label>
                    <input type="date" id="start-date" value="2026-06-01">
                </div>
                <div class="form-group">
                    <label for="end-date">Spätestes Rückreisedatum:</label>
                    <input type="date" id="end-date" value="2026-08-31">
                </div>
                <div class="form-group">
                    <label for="duration-min">Mindestaufenthalt (Nächte):</label>
                    <input type="number" id="duration-min" value="10">
                </div>
                <div class="form-group">
                    <label for="duration-max">Maximalaufenthalt (Nächte):</label>
                    <input type="number" id="duration-max" value="14">
                </div>
            </div>
            <button onclick="openKiwi()" class="action-btn kiwi-btn">Flüge auf Kiwi.com suchen ↗</button>
        </div>

        <!-- HOTEL-SUCHE SEKTION -->
        <div class="section-block" style="border-left: 4px solid var(--booking);">
            <h2>🏨 2. Hotelsuche konfigurieren</h2>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="hotel-destination">Zielort / Flughafen-Code:</label>
                    <input type="text" id="hotel-destination" value="MIA" placeholder="Wird automatisch synchronisiert">
                </div>
                <div class="form-group">
                    <label for="hotel-stars">Mindest-Sterne:</label>
                    <select id="hotel-stars">
                        <option value="3">3 Sterne</option>
                        <option value="4" selected>4 Sterne</option>
                        <option value="5">5 Sterne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="max-budget">Max. Gesamtbudget (€):</label>
                    <input type="number" id="max-budget" value="2500">
                </div>
            </div>
            <button onclick="openBooking()" class="action-btn booking-btn">Hotels auf Booking.com suchen ↗</button>
        </div>
    </div>
</div>

<script>
    // Passwort-Schutz prüfen
    function checkPassword() {
        const input = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('error-msg');
        
        if (input === 'Reise2026') {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        } else {
            errorMsg.classList.remove('hidden');
        }
    }

    // Enter-Taste im Passwortfeld
    document.getElementById('password-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { checkPassword(); }
    });

    // Synchronisiert das Hotel-Ziel automatisch mit dem Flug-Ziel
    function syncDestination(val) {
        document.getElementById('hotel-destination').value = val;
    }

    // Datumsformatierung für Kiwi (DD/MM/YYYY)
    function formatDateKiwi(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-'); // YYYY-MM-DD -> [YYYY, MM, DD]
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    // FLUG-SUCHE STARTEN
    function openKiwi() {
        const dep = document.getElementById('departure').value.trim().toLowerCase();
        const dest = document.getElementById('destination').value.trim().toLowerCase();
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const durMin = document.getElementById('duration-min').value;
        const durMax = document.getElementById('duration-max').value;

        const kiwiStart = formatDateKiwi(start);
        const kiwiEnd = formatDateKiwi(end);
        
        // Unzerstörbares Kiwi-Suchlink-Format
        const kiwiUrl = `https://kiwi.com{dep}/${dest}/${kiwiStart}-${kiwiEnd}/${durMin}-${durMax}`;
        window.open(kiwiUrl, '_blank');
    }

    // HOTEL-SUCHE STARTEN
    function openBooking() {
        const hotelDest = document.getElementById('hotel-destination').value.trim().toUpperCase();
        const stars = document.getElementById('hotel-stars').value;

        // Booking Link mit Ort und vorausgewähltem Sterne-Filter
        const bookingUrl = `https://booking.com{encodeURIComponent(hotelDest)}&nclass=${stars}`;
        window.open(bookingUrl, '_blank');
    }
</script>

</body>
</html>
