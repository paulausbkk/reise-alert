<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --flight-theme: #0284c7;
            --hotel-theme: #0f766e;
            --upgrade-theme: #6d28d9;
            --kiwi: #00a699;
            --google: #4285f4;
            --skyscanner: #007054;
            --booking: #003580;
            --trivago: #ff5a5f;
            --tripadvisor: #34e0a1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .search-card {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 1.5rem;
        }
        .search-card.flight {
            border-color: var(--flight-theme);
            background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
        }
        .search-card.hotel {
            border-color: var(--hotel-theme);
            background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
        }
        .search-card.upgrade {
            border-color: var(--upgrade-theme);
            background: linear-gradient(180deg, #faf5ff 0%, #ffffff 100%);
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.25rem;
        }
        .card-title.flight { color: var(--flight-theme); }
        .card-title.hotel { color: var(--hotel-theme); }
        .card-title.upgrade { color: var(--upgrade-theme); }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 0.5rem;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: #475569;
        }
        input, select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .range-container input {
            flex: 1;
        }
        .range-value {
            font-weight: bold;
            font-size: 0.95rem;
            min-width: 55px;
            text-align: right;
        }
        .main-submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .upgrade-btn {
            background: linear-gradient(135deg, var(--upgrade-theme) 0%, #5b21b6 100%);
        }
        .hidden {
            display: none;
        }
        .result-box {
            margin-top: 2rem;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }
        .result-section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            box-sizing: border-box;
        }
        .kiwi-btn { background-color: var(--kiwi); }
        .google-btn { background-color: var(--google); }
        .skyscanner-btn { background-color: var(--skyscanner); }
        .booking-btn { background-color: var(--booking); }
        .trivago-btn { background-color: var(--trivago); }
        .tripadvisor-btn { background-color: var(--tripadvisor); color: #000000 !important; }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Passwort-Bereich -->
    <div id="auth-section">
        <h1>🔒 Bitte Passwort eingeben</h1>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Passwort hier eingeben...">
        </div>
        <button class="main-submit-btn" onclick="if(document.getElementById('password-input').value==='Reise2026'){document.getElementById('auth-section').classList.add('hidden');document.getElementById('main-content').classList.remove('hidden');}else{document.getElementById('error-msg').classList.remove('hidden');}">Freischalten</button>
        <p id="error-msg" style="color: #dc2626; text-align: center; font-size: 0.9rem; margin-top: 1rem;" class="hidden">Falsches Passwort.</p>
    </div>

    <!-- 2. Formular-Bereich -->
    <div id="main-content" class="hidden">
        <h1>✈️ McKinney Reisekonfiguration PRO</h1>
        
        <!-- BLAUE KARTE: FLUG -->
        <div class="search-card flight">
            <div class="card-title flight">✈️ Sektion 1: Flug-Parameter</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="departure">Abflughafen (Code):</label>
                    <input type="text" id="departure" value="FRA">
                </div>
                <div class="form-group">
                    <label for="destination">Zielflughafen (Code):</label>
                    <input type="text" id="destination" value="MIA" oninput="document.getElementById('hotel-destination').value=this.value;">
                </div>
                <div class="form-group">
                    <label for="start-date">Frühestes Hinreisedatum:</label>
                    <input type="date" id="start-date" value="2026-06-01">
                </div>
                <div class="form-group">
                    <label for="end-date">Spätestes Rückreisedatum:</label>
                    <input type="date" id="end-date" value="2026-08-31">
                </div>
                <div class="form-group">
                    <label for="stops">Zwischenstopps:</label>
                    <select id="stops">
                        <option value="any">Beliebig viele Stopps</option>
                        <option value="direct">Nur Direktflüge</option>
                        <option value="max1">Max. 1 Zwischenstopp</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cabin-class">Beförderungsklasse:</label>
                    <select id="cabin-class">
                        <option value="economy" selected>Economy Class</option>
                        <option value="premium">Premium Economy</option>
                        <option value="business">Business Class</option>
                        <option value="first">First Class</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="max-travel-time">Maximale Reisezeit (Std. pro Strecke):</label>
                    <div class="range-container">
                        <input type="range" id="max-travel-time" min="5" max="40" value="18" oninput="document.getElementById('travel-time-val').innerText=this.value+' h';">
                        <span class="range-value" id="travel-time-val">18 h</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- GRÜNE KARTE: HOTEL -->
        <div class="search-card hotel">
            <div class="card-title hotel">🏨 Sektion 2: Hotel & Budget</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="hotel-destination">Zielort für Hotelsuche:</label>
                    <input type="text" id="hotel-destination" value="MIA">
                </div>
                <div class="form-group">
                    <label for="hotel-stars">Mindest-Sterne (Hotel):</label>
                    <select id="hotel-stars">
                        <option value="3">3 Sterne</option>
                        <option value="4" selected>4 Sterne</option>
                        <option value="5">5 Sterne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="max-budget">Maximales Gesamtbudget (€):</label>
                    <input type="number" id="max-budget" value="2500">
                </div>
            </div>
