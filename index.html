<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - COMPLETE CORE</title>
    <style>
        :root { --primary-blue: #1e40af; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --lowcost-yellow: #fef08a; --lowcost-border: #eab308; --active-green: #22c55e; --gold-yellow: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--primary-blue); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--primary-blue); background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary-blue); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        input:disabled, select:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; border: 1px solid #94a3b8; opacity: 0.6; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid var(--lowcost-border); }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-green) !important; }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    <datalist id="airports-complete">
        <option value="Frankfurt (FRA)"></option><option value="Manila (MNL)"></option><option value="Cebu (CEB)"></option><option value="Bangkok (BKK)"></option>
    </datalist>
    
    <!-- Unblockierbares Formular übergibt die Daten direkt an Google -->
    <form action="https://google.com" method="get" target="_blank" class="card" id="flightForm">
        <div class="title"><span>✈️ Sektion 1: Flug-Parameter</span><span style="font-size: 0.75rem; background: #dbeafe; padding: 2px 6px; border-radius: 4px; color: var(--primary-blue);">[VERSION 2026 - COMPLETE CORE]</span></div>
        <input type="hidden" name="tbm" value="fl">
        <div class="grid">
            <div><label>Abflugort:</label><input type="text" placeholder="z.B. FRA" id="fl-from" list="airports-complete" required oninput="syncQuery()"></div>
            <div><label>Zielort:</label><input type="text" placeholder="z.B. MNL" id="fl-to" list="airports-complete" required oninput="syncQuery()"></div>
            <div><label>Hinflug:</label><input type="date" id="fl-date1" onchange="syncQuery()"></div>
            <div><label>Rückflug:</label><input type="date" id="fl-date2" onchange="syncQuery()"></div>
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="fl-oneway" onchange="syncQuery()"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" id="fl-lowcost" onchange="syncQuery()"><span class="slider"></span></label></div>
            <div>
                <label>Beförderungsklasse:</label>
                <select id="fl-cabin" onchange="syncQuery()"><option value="Economy">Economy</option><option value="Premium Economy">Premium Economy</option><option value="Business">Business Class</option><option value="First">First Class</option></select>
            </div>
            <div>
                <label>Personen:</label>
                <select id="fl-passengers" onchange="syncQuery()"><option value="1">1 Person</option><option value="2" selected>2 Personen</option><option value="3">3 Personen</option></select>
            </div>
            <div>
                <label>Gepäck:</label>
                <select id="fl-baggage" onchange="syncQuery()"><option value="Handgepäck">Handgepäck</option><option value="1x 20kg">1x 20 KG Gepäck</option><option value="1x 23kg">1x 23 KG Gepäck</option><option value="2 Gepäckstücke">2 Gepäckstücke</option></select>
            </div>
            <div>
                <label>Stopps:</label>
                <select id="fl-stops" onchange="syncQuery()"><option value="Direktflug">Direktflug</option><option value="max 1 Stopp">Max. 1 Stopp</option><option value="max 2 Stopps">Max. 2 Stopps</option></select>
            </div>
            <div class="full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai (DXB)" id="fl-stop-location" list="airports-complete" oninput="syncQuery()"></div>
            <div><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. Cebu (CEB)" id="fl-from2" list="airports-complete"></div>
            <div><label>Preis Anschlussflug (€):</label><input type="number" placeholder="80" id="fl-price2"></div>
            <div class="full"><label>Haupt-Ticketpreis (€):</label><input type="number" placeholder="800" id="fl-price"></div>
            <div class="full" style="background:#fff; padding:8px 10px; border:1px solid var(--border); border-radius:4px;">
                <label id="range-label">Max. Reisezeit: 30 Std.</label><input type="range" id="fl-max-time" min="5" max="50" value="30" style="height:20px;" oninput="document.getElementById('range-label').innerText = 'Max. Reisezeit: ' + this.value + ' Std.'; syncQuery();">
            </div>
            
            <input type="hidden" name="q" id="hidden-master-query">
            <div class="full"><button type="submit" class="btn" style="width:100%; height:45px; color:#ffffff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:15px; background:var(--gold-yellow); font-size:1rem; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">Gold - Flug-Suche starten ➔</button></div>
        </div>
    </form>
</div>
<script>
    var d1 = document.getElementById('fl-date1'), d2 = document.getElementById('fl-date2'), ow = document.getElementById('fl-oneway');
    d1.value = "2026-12-18"; d2.value = "2026-12-28";
    function getIATA(txt) { var m = txt.match(/\(([^)]+)\)/); return m ? m.toUpperCase().trim() : txt.toUpperCase().trim(); }
    function syncQuery() {
        if (ow.checked) { d2.disabled = true; d2.value = ""; } 
        else { d2.disabled = false; d2.min = d1.value; if (!d2.value || d2.value < d1.value) d2.value = d1.value; }
        var from = getIATA(document.getElementById('fl-from').value), to = getIATA(document.getElementById('fl-to').value);
        var q = "google flights from " + from + " to " + to + " on " + d1.value;
        if (!ow.checked && d2.value) q += " return " + d2.value; else q += " one way";
        q += " class:" + document.getElementById('fl-cabin').value + " passengers:" + document.getElementById('fl-passengers').value + " baggage:" + document.getElementById('fl-baggage').value + " stops:" + document.getElementById('fl-stops').value + " max duration:" + document.getElementById('fl-max-time').value + " hours";
        var sLoc = document.getElementById('fl-stop-location').value; if (sLoc) q += " via " + getIATA(sLoc);
        if (document.getElementById('fl-lowcost').checked) q += " including low cost airlines";
        document.getElementById('hidden-master-query').value = q;
    }
    syncQuery();
</script>
</body>
</html>
