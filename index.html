<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            
            /* Suchmaschinen-Farben */
            --kiwi: #00a699;
            --google: #4285f4;
            --skyscanner: #007054;
            --booking: #003580;
            --trivago: #007faf;
            --tripadvisor: #34e0a1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }
        .section-block {
            background: #fafafa;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 0.5rem;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: #475569;
        }
        input, select {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: center;
        }
        .action-btn:hover { opacity: 0.9; }
        .action-btn:active { transform: scale(0.98); }
        
        .btn-kiwi { background-color: var(--kiwi); }
        .btn-google { background-color: var(--google); }
        .btn-skyscanner { background-color: var(--skyscanner); }
        .btn-booking { background-color: var(--booking); }
        .btn-trivago { background-color: var(--trivago); color: white; }
        .btn-tripadvisor { background-color: var(--tripadvisor); color: #000000; }
        
        .hidden { display: none; }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Passwort-Bereich -->
    <div id="auth-section">
        <h1>🔒 Passwort erforderlich</h1>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Passwort eingeben...">
        </div>
        <button class="action-btn" style="background-color: var(--primary); width: 100%; margin-top: 10px;" onclick="checkPassword()">Freischalten</button>
        <p id="error-msg" style="color: #dc2626; text-align: center; font-size: 0.9rem; margin-top: 1rem;" class="hidden">Falsches Passwort.</p>
    </div>

    <!-- 2. Haupt-Inhalt -->
    <div id="main-content" class="hidden">
        <h1>✈️ McKinney Reisekonfiguration PRO</h1>
        
        <!-- FLUG-SUCHE SEKTION -->
        <div class="section-block" style="border-left: 4px solid var(--primary);">
            <h2>🥝 1. Flugsuche (Flexibles Zeitfenster)</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="departure">Abflughafen (Code):</label>
                    <input type="text" id="departure" value="FRA">
                </div>
                <div class="form-group">
                    <label for="destination">Zielflughafen (Code):</label>
                    <input type="text" id="destination" value="MIA" oninput="syncDestination(this.value)">
                </div>
                <div class="form-group">
                    <label for="start-date">Frühestes Hinreisedatum:</label>
                    <input type="date" id="start-date" value="2026-06-01">
                </div>
                <div class="form-group">
                    <label for="end-date">Spätestes Rückreisedatum:</label>
                    <input type="date" id="end-date" value="2026-08-31">
                </div>
                <div class="form-group">
                    <label for="duration-min">Mindestaufenthalt (Nächte):</label>
                    <input type="number" id="duration-min" value="10">
                </div>
                <div class="form-group">
                    <label for="duration-max">Maximalaufenthalt (Nächte):</label>
                    <input type="number" id="duration-max" value="14">
                </div>
            </div>
            
            <label style="margin-bottom: 0.5rem;">Suche starten auf:</label>
            <div class="btn-group">
                <button onclick="searchFlight('kiwi')" class="action-btn btn-kiwi">🥝 Kiwi.com</button>
                <button onclick="searchFlight('google')" class="action-btn btn-google">🌐 Google Flights</button>
                <button onclick="searchFlight('skyscanner')" class="action-btn btn-skyscanner">🚀 Skyscanner</button>
            </div>
        </div>

        <!-- HOTEL-SUCHE SEKTION -->
        <div class="section-block" style="border-left: 4px solid var(--booking);">
            <h2>🏨 2. Hotelsuche & Vergleich</h2>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="hotel-destination">Zielort / Flughafen-Code:</label>
                    <input type="text" id="hotel-destination" value="MIA">
                </div>
                <div class="form-group">
                    <label for="hotel-stars">Mindest-Sterne:</label>
                    <select id="hotel-stars">
                        <option value="3">3 Sterne</option>
                        <option value="4" selected>4 Sterne</option>
                        <option value="5">5 Sterne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="max-budget">Max. Gesamtbudget (€):</label>
                    <input type="number" id="max-budget" value="2500">
                </div>
            </div>
            
            <label style="margin-bottom: 0.5rem;">Preise vergleichen auf:</label>
            <div class="btn-group">
                <button onclick="searchHotel('booking')" class="action-btn btn-booking">🏨 Booking.com</button>
                <button onclick="searchHotel('trivago')" class="action-btn btn-trivago">🔍 Trivago</button>
                <button onclick="searchHotel('tripadvisor')" class="action-btn btn-tripadvisor">🦉 TripAdvisor</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Passwort-Schutz prüfen
    function checkPassword() {
        const input = document.getElementById('password-input').value;
        if (input === 'Reise2026') {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        } else {
            document.getElementById('error-msg').classList.remove('hidden');
        }
    }

    document.getElementById('password-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { checkPassword(); }
    });

    // Synchronisation der Reiseziele
    function syncDestination(val) {
        document.getElementById('hotel-destination').value = val;
    }

    // Hilfsfunktion für Kiwi-Format (DD/MM/YYYY)
    function formatKiwiDate(dateStr) {
        if(!dateStr) return '';
        const p = dateStr.split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
    }

    // FLUG-SUCHE LOGIK
    function searchFlight(engine) {
        const dep = document.getElementById('departure').value.trim().toLowerCase();
        const dest = document.getElementById('destination').value.trim().toLowerCase();
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;

        if (engine === 'kiwi') {
            const kStart = formatKiwiDate(start);
            const kEnd = formatKiwiDate(end);
            const dMin = document.getElementById('duration-min').value;
            const dMax = document.getElementById('duration-max').value;
