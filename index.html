<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎫 Flug-Upgrade & Buchungs-Check</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.bk{background:#1e293b;color:#fff;text-decoration:none;padding:8px 14px;
border-radius:6px;font-weight:bold;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 360px;border:2px solid var(--r);border-radius:8px;padding:18px;
background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.05rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:14px}
.f{margin-bottom:13px;display:flex;flex-direction:column}
label{font-weight:bold;font-size:.84rem;margin-bottom:5px;color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);
border-radius:4px;box-sizing:border-box;font-size:.96rem;background:#fff;
width:100%}
.cpb{display:flex;gap:6px}
.cpb button{width:46px;height:40px;border:1px solid var(--b);background:#fff;
border-radius:4px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;
height:48px;background:var(--v);color:#fff;font-weight:bold;border:none;
border-radius:6px;font-size:.95rem;text-transform:uppercase;cursor:pointer}
.info{margin-top:10px;background:#f8fafc;border:1px solid var(--b);
color:#334155;padding:8px 12px;border-radius:4px;font-size:.85rem}
#ts{display:none;margin-top:10px;background:#dcfce7;border:1px solid var(--v);
color:#14532d;padding:8px 12px;border-radius:4px;font-weight:bold;
font-size:.86rem}
</style>
</head>
<body>
<div class="hdr">
<h1 class="tit">🎫 Flug-Upgrade & Buchungs-Cockpit</h1>
<a href="index.html" class="bk">⬅️ Zurück zur Flugsuche</a>
</div>
<div class="row">
<div class="card">
<div class="ct">🔑 Login-Daten für die Airline</div>
<div class="f"><label>Airline-Buchungscode (PNR, 6-stellig)</label>
<div class="cpb"><input type="text" id="u3" placeholder="z.B. TW8ZRK" style="text-transform:uppercase">
<button type="button" onclick="cp('u3','Buchungscode')">📋</button></div></div>
<div class="f"><label>Nachname wie in der Buchung (strikt ohne Vornamen!)</label>
<div class="cpb"><input type="text" id="u6" placeholder="z.B. MÜLLER" style="text-transform:uppercase">
<button type="button" onclick="cp('u6','Nachname')">📋</button></div></div>
<div class="f"><label>Ticketnummer (13-stellig – Backup falls PNR nicht klappt)</label>
<div class="cpb"><input type="text" id="u4" placeholder="z.B. 2354817365876">
<button type="button" onclick="cp('u4','Ticketnummer')">📋</button></div></div>
</div>
<div class="card">
<div class="ct">🎯 Airline & Upgrade-Teilstrecke</div>
<div class="f"><label>Airline / Reiseveranstalter (Direktsprung)</label><select id="u5">
<option value="https://turkishairlines.com">Turkish Airlines (Buchung verwalten)</option>
<option value="https://expedia.de">Expedia (Meine Reisen / PNR)</option>
<option value="https://lufthansa.com">Lufthansa (Meine Buchungen)</option>
<option value="https://qatarairways.com">Qatar Airways (Buchung verwalten)</option>
<option value="https://emirates.com">Emirates (Buchung verwalten)</option>
<option value="https://singaporeair.com">Singapore Airlines (Manage Booking)</option>
<option value="https://thaiairways.com">Thai Airways (My Booking)</option>
<option value="https://cathaypacific.com">Cathay Pacific (Manage Booking)</option>
<option value="https://philippineairlines.com">Philippine Airlines (Manage Booking)</option>
<option value="https://cebupacificair.com">Cebu Pacific (Manage Booking)</option>
<option value="https://airasia.com">AirAsia (My Bookings)</option>
<option value="https://trip.com">Trip.com (Buchungen)</option>
<option value="https://kiwi.com">Kiwi.com (Buchungen)</option>
</select></div>
<div class="f"><label>Upgrade-Teilstrecke (Gedächtnisstütze)</label>
<input type="text" id="u8" placeholder="z.B. IST - BKK" style="text-transform:uppercase"></div>
</div>
</div>
<div class="bb">
<button type="button" id="go" onclick="openSplit()" class="btn">
🚀 Split-Screen: Airline & Cockpit nebeneinander öffnen</button>
<div id="info" class="info">💡 Tipp: Beim Klick kopiert sich der PNR automatisch und beide Fenster ordnen sich nebeneinander an.</div>
<div id="ts"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const keys=["u3","u4","u5","u6","u8"];
function cp(id,lbl){
  const v=$(id).value.trim();if(!v)return;
  try{navigator.clipboard.writeText(v);
  $("ts").textContent="✅ "+lbl+" kopiert: "+v;
  $("ts").style.display="block"}catch(e){}
}
function openSplit(){
  cp("u3","Buchungscode");
  const url=$("u5").value;
  const sw=screen.availWidth||1280;
  const sh=screen.availHeight||800;
  const cw=Math.min(430,Math.floor(sw*0.34));
  try{window.moveTo(0,0);window.resizeTo(cw,sh)}catch(e){}
  const aw=sw-cw;
  const w=window.open(url,"airline_upg","left="+cw+",top=0,width="+aw+",height="+sh+",resizable=yes,scrollbars=yes");
  if(!w)window.open(url,"_blank");
}
function sv(){
  const seg=$("u8").value.trim().toUpperCase();
  if(seg){
    $("info").innerHTML="🎯 <b>Upgrade-Fokus:</b> "+seg+" – rechts PNR & Nachname einkopieren und dieses Segment wählen.";
  }else{
    $("info").textContent="💡 Tipp: Beim Klick kopiert sich der PNR automatisch und beide Fenster ordnen sich nebeneinander an.";
  }
  const d={};keys.forEach(k=>d[k]=$(k).value);
  const s=JSON.stringify(d);
  try{localStorage.setItem("rk_upg2",s)}catch(e){}
  try{window.name="UPG2:"+s}catch(e){}
}
(function ld(){
  let raw="";
  try{raw=localStorage.getItem("rk_upg2")||""}catch(e){}
  if(!raw&&window.name&&window.name.startsWith("UPG2:"))raw=window.name.slice(5);
  if(raw){
    try{
      const d=JSON.parse(raw);
      keys.forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]});
    }catch(e){}
  }
  sv();
})();
keys.forEach(k=>{
  $(k).addEventListener("input",sv);
  $(k).addEventListener("change",sv);
});
</script>
</body>
</html>
