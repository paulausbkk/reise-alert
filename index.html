<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ REBOOT</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; margin: 0; }
        .fullscreen-box { width: 100%; background: #ffffff; border: 3px solid #991b1b; padding: 20px; border-radius: 8px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 20px; }
        .title { font-weight: bold; color: #991b1b; font-size: 1.2rem; }
        .cockpit { display: flex; gap: 5px; background: #1e293b; padding: 4px; border-radius: 4px; }
        .seg { font-size: 0.75rem; padding: 4px 8px; border-radius: 2px; font-weight: bold; color: #ffffff; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; color: #475569; }
        input { width: 100%; height: 40px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        
        body:has(#ow:checked) #return-field { opacity: 0.25; pointer-events: none; }
        body:has(#ow:checked) .status-ok { background: #f59e0b !important; color: #000000; }
        input:invalid { border: 2px solid #ef4444 !important; background: #fff5f5; }
        form:has(input:invalid) .status-ok { background: #ef4444 !important; color: #ffffff; }

        .btn-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn { flex: 1 1 140px; height: 45px; color: #ffffff; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        .b-g { background: #4285f4; } .b-s { background: #007054; } .b-k { background: #ff690f; }
        .b-m { background: #84329b; } .b-ki { background: #00a699; } .b-t { background: #2f55d4; }
    </style>
</head>
<body>

<div class="fullscreen-box">
    <form action="https://google.com" method="get" target="_blank">
        
        <div class="header">
            <div class="title">Flug-Absprung (REBOOT BASE)</div>
            <div class="cockpit">
                <div class="seg" style="background: #475569;">09.11.2026</div>
                <div class="seg" style="background: #d946ef;">17:15</div>
                <div class="seg status-ok" style="background: #22c55e;">BASE OK</div>
            </div>
        </div>

        <div class="field">
            <label>Abflug (IATA)</label>
            <input type="text" name="as_q" value="FRA" required>
        </div>

        <div class="field">
            <label>Ziel (IATA)</label>
            <input type="text" name="as_epq" value="BKK" required>
        </div>

        <div class="field">
            <label>Hinflug</label>
            <input type="date" min="2026-11-09" value="2026-11-19" required>
        </div>

        <div class="field" id="return-field">
            <label>Rückflug</label>
            <input type="date" min="2026-11-09">
        </div>

        <div class="field" style="display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;">
            <input type="checkbox" id="ow" style="width: 20px; height: 20px; margin: 0;">
            <label for="ow" style="margin: 0; cursor: pointer;">Nur Hinflug (One-Way Riegel)</label>
        </div>

        <div class="btn-container">
            <button type="submit" name="q" value="Flüge" class="btn b-g">Google</button>
            <button type="submit" name="q" value="Skyscanner Flüge" class="btn b-s">Skyscan</button>
            <button type="submit" name="q" value="Kayak Flüge" class="btn b-k">Kayak</button>
            <button type="submit" name="q" value="Momondo Flüge" class="btn b-m">Momondo</button>
            <button type="submit" name="q" value="Kiwi.com Flüge" class="btn b-ki">Kiwi</button>
            <button type="submit" name="q" value="Trip.com Flüge" class="btn b-t">Trip</button>
        </div>

    </form>
</div>

</body>
</html>
