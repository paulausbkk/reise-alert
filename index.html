<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root { --primary: #2563eb; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --flight: #0284c7; --hotel: #0f766e; --upgrade: #6d28d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card.fl { border-color: var(--flight); background: #f0f9ff; }
        .card.ho { border-color: var(--hotel); background: #f0fdf4; }
        .card.up { border-color: var(--upgrade); background: #faf5ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .fl .title { color: var(--flight); } .ho .title { color: var(--hotel); } .up .title { color: var(--upgrade); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; color: #475569; }
        input, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); }
        .btn-up { background: var(--upgrade); }
        .hidden { display: none; }
        .pass-box { position: relative; }
        .eye { position: absolute; right: 10px; top: 24px; cursor: pointer; font-size: 1.1rem; }
        .res-box { margin-top: 15px; padding: 15px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; }
        .l-btn { display: block; text-align: center; padding: 8px; margin-bottom: 5px; border-radius: 4px; text-decoration: none; color: white; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. PASSWORT BEREICH -->
    <div id="auth-section">
        <h1>🔒 Passwort erforderlich</h1>
        <div class="form-group pass-box">
            <label>Passwort:</label>
            <input type="password" id="password-input" value="">
            <span class="eye" onclick="var p=document.getElementById('password-input'); if(p.type=='password'){p.type='text';this.innerText='👁️‍🗨️';}else{p.type='password';this.innerText='👁️';}">👁️</span>
        </div>
        <button class="btn btn-main" onclick="if(document.getElementById('password-input').value==='Reise2026'){document.getElementById('auth-section').classList.add('hidden');document.getElementById('main-content').classList.remove('hidden');}else{alert('Falsches Passwort!');}">Freischalten</button>
    </div>

    <!-- 2. HAUPT-INHALT -->
    <div id="main-content" class="hidden">
        <h1>✈️ McKinney Reisekonfiguration PRO</h1>
        
        <!-- FLUG KARTE -->
        <div class="card fl">
            <div class="title">✈️ Sektion 1: Flug-Parameter</div>
            <div class="grid">
                <div><label>Abflug (Code):</label><input type="text" id="dep" value="FRA"></div>
                <div><label>Endziel (Code):</label><input type="text" id="dest" value="MIA" oninput="document.getElementById('h-dest').value=this.value;"></div>
                <div class="full"><label>📍 Optionaler Stopover / Zwischenaufenthalt:</label><input type="text" id="via" placeholder="z.B. NYC"></div>
                <div><label>Frühestes Datum:</label><input type="date" id="start" value="2026-06-01"></div>
                <div><label>Spätestes Datum:</label><input type="date" id="end" value="2026-08-31"></div>
                <div><label>Zwischenstopps Filter:</label><select id="stops"><option value="any">Alle</option><option value="direct">Nur Direkt</option><option value="max1">Max 1</option></select></div>
                <div><label>Klasse:</label><select id="cabin"><option value="economy">Economy</option><option value="premium">Premium Eco</option><option value="business">Business</option><option value="first">First</option></select></div>
                <div class="full"><label>Max. Reisezeit: <span id="t-val">18 h</span></label><input type="range" id="m-time" min="5" max="40" value="18" oninput="document.getElementById('t-val').innerText=this.value+' h';"></div>
            </div>
        </div>

        <!-- HOTEL KARTE -->
        <div class="card ho">
            <div class="title">🏨 Sektion 2: Hotel & Budget</div>
            <div class="grid">
                <div class="full"><label>Zielort für Hotelsuche:</label><input type="text" id="h-dest" value="MIA"></div>
                <div><label>Mindest-Sterne:</label><select id="stars"><option value="3">3★</option><option value="4" selected>4★</option><option value="5">5★</option></select></div>
                <div><label>Max. Gesamtbudget (€):</label><input type="number" id="budget" value="2500"></div>
                <div class="full"><label> Davon Budget 2. Teilstrecke (Stopover -> Ziel) (€):</label><input type="number" id="sub-budget" value="500"></div>
            </div>
        </div>

        <button class="btn btn-main" onclick="var d=document.getElementById('dep').value.trim(); var st=document.getElementById('dest').value.trim(); var v=document.getElementById('via').value.trim(); var h=document.getElementById('h-dest').value.trim(); var s=document.getElementById('start').value; var c=document.getElementById('cabin').value; var star=document.getElementById('stars').value; var sP=s.split('-'); var kS=sP+'/'+sP+'/'+sP; document.getElementById('k-l').href='https://kiwi.com; document.getElementById('g-l').href='https://google.com; document.getElementById('s-l').href='https://skyscanner.de; document.getElementById('b-l').href='https://booking.com; document.getElementById('t-l').href='https://trivago.de; document.getElementById('tr-l').href='https://tripadvisor.de; document.getElementById('res').classList.remove('hidden');">Live-Suchlinks generieren ✨</button>

        <!-- UPGRADE KARTE -->
        <div class="card up" style="margin-top: 20px;">
            <div class="title">🔮 Sektion 3: Upgrade & Status Check (Bereits gebucht)</div>
            <div class="grid">
                <div><label>Airline:</label><input type="text" id="air" placeholder="Lufthansa"></div>
                <div><label>Flugnummer:</label><input type="text" id="f-num" placeholder="LH430"></div>
                <div><label>Buchungscode / Ticketnr:</label><input type="text" id="t-num" placeholder="ABCDEF"></div>
                <div><label>Nachname Inhaber:</label><input type="text" id="p-name" placeholder="Müller"></div>
                <div class="full"><label>Mitgliedsnummer / Vielflieger-ID:</label><input type="text" id="ff-num" placeholder="Miles & More Nr."></div>
            </div>
            <button class="btn btn-up" onclick="var a=document.getElementById('air').value.trim(); var t=document.getElementById('t-num').value.trim(); var n=document.getElementById('p-name').value.trim(); if(!a){alert('Bitte Airline eingeben!');}else{window.open('https://google.com(a+' upgrade buchen ticket '+t+' '+n),'_blank');}">Upgrade-Optionen prüfen ↗</button>
        </div>

        <!-- ERGEBNISSE -->
        <div id="res" class="res-box hidden">
            <h3 style="margin:0 0 10px 0; text-align:center;">🎉 Deine Live-Links</h3>
            <div style="font-weight:bold; color:var(--flight); margin-bottom:5px;">✈️ Flüge:</div>
            <a id="k-l" href="#" target="_blank" class="l-btn" style="background:#00a699;">🥝 Kiwi.com</a>
            <a id="g-l" href="#" target="_blank" class="l-btn" style="background:#4285f4;">🌐 Google Flights</a>
            <a id="s-l" href="#" target="_blank" class="l-btn" style="background:#007054;">🚀 Skyscanner</a>
            <div style="font-weight:bold; color:var(--hotel); margin:10px 0 5px 0;">🏨 Hotels:</div>
            <a id="b-l" href="#" target="_blank" class="l-btn" style="background:#003580;">🏨 Booking.com</a>
            <a id="t-l" href="#" target="_blank" class="l-btn" style="background:#ff5a5f;">🔍 Trivago</a>
            <a id="tr-l" href="#" target="_blank" class="l-btn" style="background:#34e0a1; color:black;">🦉 TripAdvisor</a>
        </div>
    </div>
</div>

</body>
</html>
