<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - NEW CORE</title>
    <style>
        :root { 
            --rubin: #991b1b; 
            --bg: #f0f4f8; 
            --card-bg: #ffffff; 
            --text: #1e293b; 
            --border: #cbd5e1; 
            --lowcost-yellow: #fef08a; 
            --gold: #f59e0b; 
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--rubin); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--rubin); background: #fef2f2; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--rubin); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        
        /* UNZERSTÖRBARER CSS-LOCK FÜR ONE WAY (Sperrt Rückflug ohne JS) */
        body:has(#ow-checkbox:checked) #return-box { 
            background-color: #cbd5e1 !important; 
            color: #94a3b8 !important; 
            cursor: not-allowed !important; 
            opacity: 0.35 !important; 
            pointer-events: none !important; 
            border-color: #94a3b8 !important; 
        }
        
        /* MULTI-CITY GABELFLUG-WEICHE REIN ÜBER CSS */
        .multi-city-block { display: none; }
        body:has(#mc-checkbox:checked) .multi-city-block { display: block !important; }
        body:has(#mc-checkbox:checked) .return-flight-box { display: none !important; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid #eab308; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 22px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        .switch input:checked + .slider { background-color: #22c55e !important; }
        .switch input:checked + .slider:before { transform: translateX(18px); }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold); font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-transform: uppercase; }
        
        .password-box { border: 3px solid var(--rubin) !important; background-color: #ffffff; font-weight: bold; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .range-container { background: #fff; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .section-divider { grid-column: span 2; font-weight: bold; font-size: 0.85rem; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports">
        <option value="BER">Berlin Brandenburg (BER)</option>
        <option value="FRA">Frankfurt am Main (FRA)</option>
        <option value="MNL">Manila Ninoy Aquino (MNL)</option>
        <option value="CEB">Cebu Mactan (CEB)</option>
        <option value="BKK">Bangkok Suvarnabhumi (BKK)</option>
        <option value="SIN">Singapore Changi (SIN)</option>
    </datalist>
    
    <!-- 100% SKRIPTFREIE FORMULAR-ÜBERGABE ÜBER GOOGLE FLIGHTS SCHNITTSTELLE -->
    <form action="https://google.com" method="get" target="_blank" class="card">

        <div class="title"><span>✈️ Sektion 1: Flug-Parameter</span><span style="font-size: 0.75rem; background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #ffffff; border: 1px solid #334155;">[🆕 PRO NEW CORE - STAND 08.11.2026]</span></div>
        <div class="grid">
            
            <!-- STRECKEN-MODI (REIN ELEGANTE CSS-SCHALTER) -->
            <div class="switch-container"><label>Gabelflug aktivieren:</label><label class="switch"><input type="checkbox" id="mc-checkbox"><span class="slider"></span></label></div>
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="ow-checkbox"><span class="slider"></span></label></div>

            <div class="section-divider">🛫 Hauptstrecke</div>
            <div><label>Abflugort (IATA):</label><input type="text" name="q" placeholder="z.B. FRA" list="airports" required></div>
            <div><label>Zielort (IATA):</label><input type="text" name="q" placeholder="z.B. BKK" list="airports" required></div>
            
            <div><label>Hinflugdatum:</label><input type="date" name="q" value="2026-12-18"></div>
            <div class="return-flight-box"><label>Rückflugdatum:</label><input type="date" id="return-box" name="q" value="2026-12-28"></div>
            
            <!-- OPTIONALE GABELFLUG-ZEILEN (Blenden sich vollautomatisch per CSS ein, wenn oben aktiviert) -->
            <div class="section-divider multi-city-block">🛬 Zusätzliche Teilstrecke (Gabelflug)</div>
            <div class="multi-city-block"><label>Abflugort Teilstrecke 2:</label><input type="text" name="q" placeholder="z.B. BKK" list="airports"></div>
            <div class="multi-city-block"><label>Zielort Teilstrecke 2:</label><input type="text" name="q" placeholder="z.B. MNL" list="airports"></div>

            <div class="section-divider">🧳 Gepäck & Logistik</div>
            <div>
                <label>Handgepäck:</label>
                <select name="q">
                    <option value="inklusive Handgepäck">1x Handgepäck</option>
                    <option value="ohne Handgepäck">Kein Handgepäck</option>
                </select>
            </div>
            <div>
                <label>Aufgabegepäck:</label>
                <select name="q">
                    <option value="mit Aufgabegepäck">1x Koffer (23kg)</option>
                    <option value="mit 2 Gepäckstücken">2x Koffer (2x 23kg)</option>
                    <option value="ohne Gepäck">Nur Handgepäck</option>
                </select>
            </div>

            <div class="section-divider">⏱️ Flugzeiten & Stopps</div>
            <div>
                <label>Zwischenstopps:</label>
                <select name="q">
                    <option value="Direktflug">Nur Nonstop</option>
                    <option value="maximal 1 Stopp">Maximal 1 Stopp</option>
                    <option value="beliebige Stopps" selected>Beliebig</option>
                </select>
            </div>
            <div class="range-container">
                <!-- Da JS verboten ist, nutzen wir hier ein Standard-Textfeld für die Flugzeit, um Übertragungsfehler zu vermeiden -->
                <label>Max. Reisedauer (Std.):</label>
                <input type="number" name="q" min="2" max="48" value="24">
            </div>

            <div class="section-divider">🛡️ Airline & Tarife</div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" name="q" value="inklusive Billigflieger" checked><span class="slider"></span></label></div>
            <div>
                <label>Reiseklasse:</label>
                <select name="q">
                    <option value="Economy">Economy</option>
                    <option value="Premium Economy">Premium Economy</option>
                    <option value="Business Class">Business Class</option>
                    <option value="First Class">First Class</option>
                </select>
            </div>
            
            <div class="full">
                <label>Anzahl Passagiere:</label>
                <select name="q">
                    <option value="1 Person">1 Person</option>
                    <option value="2 Personen">2 Personen</option>
                    <option value="3 Personen">3 Personen</option>
                    <option value="4 Personen">4 Personen</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn">FLUGSUCHE STARTEN</button>

        <!-- 🔒 UNANTASTBARER PASSWORT-TRESOR RAHMEN -->
        <div class="password-box">
            <label style="color: var(--rubin); font-weight: bold; margin-bottom: 8px; display: block;">🔒 [LOCKED CORE] PASSWORT-TRESOR</label>
            <input type="password" id="core-vault" placeholder="Systemschutz aktiv..." disabled style="border-color: var(--rubin); background: #fff5f5;">
        </div>

    </form>
</div>
</body>
</html>
