<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - PURE</title>
    <style>
        :root { --ocean-blue: #0284c7; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --google-red: #ea4335; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--ocean-blue); }
        .card { border: 2px solid var(--ocean-blue); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--ocean-blue); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* Zwingt den Browser nativ, das Rückflugfeld im One-Way-Modus komplett grau einzufrieren */
        input:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; opacity: 0.4 !important; border: 1px solid #94a3b8 !important; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e !important; }
        input:checked + .slider:before { transform: translateX(18px); }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background-color: var(--google-red); font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-decoration: none; text-align: center; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <!-- Die native, unzerstörbare Formular-Schnittstelle direkt an Google Flights -->
    <form action="https://google.com" method="get" target="_blank" class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter (Getrennte Spalten)</span>
            <span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: var(--ocean-blue);">[VERSION 2026 - PURE]</span>
        </div>
        <div class="grid">
            
            <div class="full">
                <label>Suchkriterien für Google Flights:</label>
                <input type="text" name="q" placeholder="z.B. Flüge von FRA nach MNL am 18.12.2026" value="Flüge von FRA nach MNL am 18.12.2026" required>
            </div>

            <!-- Hinflug und Rückflug stehen jetzt sauber untereinander getrennt -->
            <div class="full">
                <label>Hinflug-Datum (Zur Info):</label>
                <input type="date" value="2026-12-18">
            </div>
            
            <div class="full">
                <label>Rückflug-Datum:</label>
                <input type="date" id="return-date" value="2026-12-28">
            </div>

            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="ow-toggle" onchange="document.getElementById('return-date').disabled = this.checked;"><span class="slider"></span></label></div>
            <div class="switch-container" style="background-color:#fef08a; border-color:#eab308;"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            
            <div>
                <label>Beförderungsklasse:</label>
                <select><option>Economy</option><option>Business</option></select>
            </div>
            <div>
                <label>Personen:</label>
                <select><option>1 Person</option><option selected>2 Personen</option></select>
            </div>

            <div class="full">
                <button type="submit" class="btn">Rot - Google Flights direkt starten ➔</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
