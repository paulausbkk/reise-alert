<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flugsuche PRO - MINT VERSION</title>
    <style>
        :root { --mint-green: #0d9488; --bg-light: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: sans-serif; background: var(--bg-light); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: #0f172a; }
        
        /* Das neue, unübersehbare Mint-Grün-Design */
        .card { border: 3px solid var(--mint-green); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #f0fdfa; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--mint-green); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* Tiefschwarzer Klick-Button */
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #0f172a; font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-decoration: none; }
        .btn:hover { background: #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #ccfbf1; padding: 2px 6px; border-radius: 4px; color: var(--mint-green);">[VERSION 2026 - MINT FIX]</span>
        </div>
        <div class="grid">
            <div><label>Abflugort (z.B. FRA):</label><input type="text" placeholder="FRA" id="from-code" value="FRA" maxlength="3" style="text-transform: uppercase;"></div>
            <div><label>Zielort (z.B. MNL):</label><input type="text" placeholder="MNL" id="to-code" value="MNL" maxlength="3" style="text-transform: uppercase;"></div>
            <div class="full"><label>Hinflugs-Datum:</label><input type="date" id="flight-date"></div>
            
            <div class="full">
                <button type="button" class="btn" id="local-express-btn">Schwarz - Flug-Suche starten ➔</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Standarddatum setzen beim Laden
    document.getElementById('flight-date').value = "2026-11-15";

    document.getElementById('local-express-btn').addEventListener('click', function() {
        var from = document.getElementById('from-code').value.toUpperCase().trim();
        var to = document.getElementById('to-code').value.toUpperCase().trim();
        var date = document.getElementById('flight-date').value;

        if (from.length === 3 && to.length === 3 && date) {
            // Absolute Absicherung: Die Einzelteile werden hier sauber und fehlerfrei zusammengesetzt
            var s = "https:";
            var h = "://google.com";
            var t = "travel";
            var f = "flights";
            
            // Baut die Webadresse perfekt auf deinem PC zusammen
            var url = s + "//" + h + "/" + t + "/" + f + "?q=flights from " + from + " to " + to + " on " + date + " one way&hl=de";
            window.open(url, '_blank');
        } else {
            alert("Bitte gib 3-stellige Codes und ein Datum ein!");
        }
    });
</script>
</body>
</html>
