<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reise-Alert Konfiguration</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        #secret-content { display: none; }
        .error { color: #e74c3c; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- VORSCHALT-PASSWORT-SCHUTZ -->
    <div id="login-box">
        <h2>🔒 Passwortschutz</h2>
        <p>Bitte gib das Passwort ein, um zum Reise-Formular zu gelangen:</p>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Passwort eingeben...">
        </div>
        <button onclick="checkPassword()">Freischalten</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- DAS EIGENTLICHE FORMULAR (WIRD ERST NACH LOGIN SICHTBAR) -->
    <div id="secret-content">
        <h2>✈️ Reisedaten eingeben</h2>
        <form onsubmit="generateAlert(event)">
            <div class="form-group">
                <label>Abflughafen (z.B. FRA):</label>
                <input type="text" id="von" value="FRA" required maxlength="3" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Zielflughafen (z.B. JFK):</label>
                <input type="text" id="nach" value="JFK" required maxlength="3" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Hin-Datum:</label>
                <input type="date" id="hin" value="2026-12-15" required>
            </div>
            <div class="form-group">
                <label>Rück-Datum:</label>
                <input type="date" id="rueck" value="2026-12-22" required>
            </div>
            <div class="form-group">
                <label>Reiseklasse:</label>
                <select id="klasse">
                    <option value="Economy">Economy</option>
                    <option value="Premium Economy">Premium Economy</option>
                    <option value="Business">Business</option>
                    <option value="First Class">First Class</option>
                </select>
            </div>
            <button type="submit">Reise-Alert aktualisieren</button>
        </form>
    </div>
</div>

<script>
    // Passwortprüfung
    function checkPassword() {
        const input = document.getElementById("password-input").value;
        const errorMsg = document.getElementById("login-error");
        
        if (input === "Reise2026") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("secret-content").style.display = "block";
        } else {
            errorMsg.textContent = "❌ Falsches Passwort! Bitte versuche es erneut.";
        }
    }

    // Formularverarbeitung
    function generateAlert(event) {
        event.preventDefault();
        alert("Reisedaten erfolgreich erfasst! Du kannst diese Werte jetzt in dein Google Colab Skript übernehmen.");
    }
</script>

</body>
</html>
