<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - PURE HTML CORE</title>
    <style>
        :root { --rubin: #991b1b; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --lowcost-yellow: #fef08a; --gold: #f59e0b; --sky-blue: #0077b6; --kiwi-green: #00a699; --trip-orange: #ff7f00; --kayak-orange: #ff6600; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--rubin); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--rubin); background: #fef2f2; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--rubin); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* UNZERSTÖRBARER CSS-LOCK FÜR ONE WAY */
        body:has(#ow-checkbox:checked) #return-box { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed !important; opacity: 0.35 !important; pointer-events: none !important; border-color: #94a3b8 !important; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid #eab308; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        .switch input:checked + .slider { background-color: #22c55e !important; }
        .switch input:checked + .slider:before { transform: translateX(18px); }
        
        /* FIXIERTES BUTTONS-MANAGEMENT OHNE ÜBERLAGERUNG */
        .action-box { width: 100%; height: 45px; display: block; position: relative; }
        .btn-search { display: none; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; line-height: 45px; box-sizing: border-box; }
        
        /* HIER WIRD IMMER REIN ÜBER NATIVES CSS ALLES ANDERE HUNDERTPROZENTIG UNSICHTBAR GEMACHT */
        body:has(#engine-selector option[value="google"]:checked) #btn-google { display: block !important; background: var(--gold); }
        body:has(#engine-selector option[value="skyscanner"]:checked) #btn-skyscanner { display: block !important; background: var(--sky-blue); }
        body:has(#engine-selector option[value="kayak"]:checked) #btn-kayak { display: block !important; background: var(--kayak-orange); }
        body:has(#engine-selector option[value="kiwi"]:checked) #btn-kiwi { display: block !important; background: var(--kiwi-green); }
        body:has(#engine-selector option[value="trip"]:checked) #btn-trip { display: block !important; background: var(--trip-orange); }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports-complete">
        <option value="Flug von FRA nach BKK">Frankfurt nach Bangkok</option>
        <option value="Flug von BER nach MNL">Berlin nach Manila</option>
        <option value="Flug von BER nach CEB">Berlin nach Cebu</option>
    </datalist>
    
    <div class="card">
        <!-- PRÄZISER ZEITSTEMPEL & ABSOLUTER LOCK -->
        <div class="title"><span>✈️ Sektion 1: Flug-Parameter</span><span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: #0369a1; border: 1px solid #bae6fd;">[08.11.2026 - 11:21 UHR - OCEAN DIRECT]</span></div>
        <div class="grid">
            
            <div class="full">
                <label>Gewünschte Flugstrecke (z.B. Flug von FRA nach BKK):</label>
                <input type="text" id="route-display" value="Flug von FRA nach BKK" list="airports-complete" required>
            </div>
            
            <div><label>Hinflug:</label><input type="date" id="fl-date1" value="2026-12-18"></div>
            <div><label>Rückflug:</label><input type="date" id="return-box" value="2026-12-28"></div>
            
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="ow-checkbox"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            
            <div><label>Beförderungsklasse:</label><select><option>Economy</option><option>Premium Economy</option><option value="Business">Business Class</option><option value="First">First Class</option></select></div>
            <div><label>Personen:</label><select><option selected>1 Person</option><option>2 Personen</option><option>3 Personen</option><option>4 Personen</option></select></div>
            
            <div>
                <label>Gepäck:</label>
                <select>
                    <option>Handgepäck</option><option>1x 20 KG Gepäck</option><option>1x 32 KG Gepäck</option><option>Handgepäck + 20 KG</option><option>Handgepäck + 32 KG</option>
                </select>
            </div>
            <div>
                <label>Stopps:</label>
                <select><option value="" selected></option><option>Direktflug</option><option>Max. 1 Stopp</option><option>Max. 2 Stopps</option></select>
            </div>
            <div class="full"><label>Ort des Stopps:</label><input type="text" placeholder="z.B. Dubai (DXB)"></div>
            <div><label>2. Abflugort (Anschluss):</label><input type="text" placeholder="z.B. CEB"></div>
            
            <div><label>Max. Preis Anschlussflug (€):</label><input type="number" placeholder="z.B. 80" value="0"></div>
            <div class="full"><label>Max. Haupt-Ticketpreis (€):</label><input type="number" placeholder="z.B. 800" value="0"></div>
            
            <div class="full" style="background:#fff; padding:8px 10px; border:1px solid var(--border); border-radius:4px;">
                <label>Max. Reisezeit (Schieberegler optisch):</label><input type="range" min="5" max="50" value="30" style="height:20px;">
            </div>
            
            <!-- Linkes Auswahlfeld steuert die CSS-Weiche für die Buttons -->
            <div>
                <label>1. Suchseite wählen:</label>
                <select id="engine-selector">
                    <option value="google" selected>Google Flights</option>
                    <option value="skyscanner">Skyscanner</option>
                    <option value="kayak">Kayak</option>
                    <option value="kiwi">Kiwi.com</option>
                    <option value="trip">Trip.com</option>
                </select>
            </div>
            
            <!-- Rechte Seite blendet rein über HTML/CSS den passenden, fest beschrifteten Button ein -->
            <div class="action-box">
                
                <!-- Google Formular -->
                <form action="https://google.com" method="get" target="_blank">
                    <input type="hidden" name="tbm" value="fl">
                    <button type="submit" id="btn-google" class="btn-search" onclick="this.form.q.value = document.getElementById('route-display').value;">Google Flights Suche starten</button>
                    <input type="hidden" name="q">
                </form>
                
                <!-- Skyscanner Formular -->
                <form action="https://skyscanner.de" method="get" target="_blank">
                    <button type="submit" id="btn-skyscanner" class="btn-search" onclick="this.form.q.value = document.getElementById('route-display').value;">Skyscanner Suche starten</button>
                    <input type="hidden" name="q">
                </form>
                
                <!-- Kayak Formular -->
                <form action="https://kayak.de" method="get" target="_blank">
                    <button type="submit" id="btn-kayak" class="btn-search">Kayak Suche starten</button>
                </form>
                
                <!-- Kiwi Formular -->
                <form action="https://kiwi.com" method="get" target="_blank">
                    <button type="submit" id="btn-kiwi" class="btn-search">Kiwi.com Suche starten</button>
                </form>
                
                <!-- Trip Formular -->
                <form action="https://trip.com" method="get" target="_blank">
                    <button type="submit" id="btn-trip" class="btn-search">Trip.com Suche starten</button>
                </form>
                
            </div>
        </div>
    </div>
</div>
</body>
</html>
