<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO</title>
    <style>
        :root { --primary: #2563eb; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --flight: #0284c7; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--flight); background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--flight); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; color: #475569; }
        input, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
    </style>
    <script>
        window.onload = function() {
            var pw = prompt("🔑 Passwort erforderlich:");
            if (pw === "Reise2026") { document.getElementById("main-content").style.display = "block"; } 
            else { alert("Falsches Passwort!"); window.location.reload(); }
        };
    </script>
</head>
<body>
<div class="container">
    <div id="main-content" style="display:none;">
        <h1>✈️ Reisekonfiguration PRO</h1>
        <div class="card">
            <div class="title">✈️ Sektion 1: Flug-Parameter</div>
            <div class="grid">
                <div><label>Abflugort (Code):</label><input type="text" placeholder="FRA" id="from"></div>
                <div><label>Zielort (Code):</label><input type="text" placeholder="MNL" id="to"></div>
                <div><label>Hinflug:</label><input type="text" placeholder="15.11.2026"></div>
                <div><label>Rückflug:</label><input type="text" placeholder="25.11.2026"></div>
                <div>
                    <label>Personenanzahl:</label>
                    <select><option>1 Person</option><option selected>2 Personen</option><option>3 Personen</option><option>4 Personen</option></select>
                </div>
                <div>
                    <label>Gepäckauswahl:</label>
                    <select><option>handgepäck</option><option>aufgabegepäck 20 kg</option><option>aufgabegepäck 32 KG</option></select>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
