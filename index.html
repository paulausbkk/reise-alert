<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✈️ Reisekonfiguration PRO</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--g:#f59e0b;--v:#6d28d9;--lg:#22c55e;--ly:#fef08a}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.cp{display:flex;gap:6px;background:#1e293b;padding:4px;border-radius:6px}
.seg{font-size:.75rem;padding:4px 10px;border-radius:4px;font-weight:bold;color:#fff;text-transform:uppercase;background:var(--v)}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 420px;border:2px solid var(--r);border-radius:8px;padding:20px;background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:16px;display:flex;flex-direction:column;position:relative}
label{font-weight:bold;font-size:.85rem;margin-bottom:6px;color:#475569}
input[type=text],input[type=date]{height:40px;padding:0 10px;border:1px solid var(--b);border-radius:4px;box-sizing:border-box;font-size:1rem;background:#fff;width:100%}
.ac{position:absolute;top:66px;left:0;right:0;background:#fff;border:1px solid var(--r);border-radius:4px;z-index:99;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.ac div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:.95rem}
.ac div:hover{background:#fee2e2;font-weight:bold}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--b);border-radius:4px;height:40px;padding:0 12px}
.swr{position:relative;flex:1;display:flex;align-items:center}
.swr input{width:100%;accent-color:var(--r);cursor:pointer;margin:0}
#sv{position:absolute;top:-22px;transform:translateX(-50%);background:var(--r);color:#fff;font-size:1.05rem;font-weight:bold;padding:1px 6px;border-radius:4px;pointer-events:none;white-space:nowrap}
.sc{font-size:.75rem;font-weight:bold;color:#64748b}
#rb:has(input:invalid),#od:invalid{opacity:.35}
#rb:has(input:invalid) input,#od:invalid{background:#cbd5e1!important}
body:has(#ow:checked) #rb{opacity:.25;pointer-events:none}
body:has(#ow:checked) #rb input{background:#cbd5e1!important}
body:has(#ow:checked) .st{background:var(--g)!important;color:#000}
.swc{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:0 10px;border:1px solid var(--b);border-radius:4px;height:40px}
.swc.yl{background:var(--ly);border:1px solid #eab308}
.sw{position:relative;display:inline-block;width:40px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:20px;transition:.3s}
.sl:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.sw input:checked+.sl{background:var(--lg)!important}
.sw input:checked+.sl:before{transform:translateX(18px)}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.bf{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;height:45px;color:#fff;font-weight:bold;border:none;border-radius:4px;cursor:pointer;font-size:.78rem;text-transform:uppercase}
.b1{background:#4285f4}.b2{background:#007054}.b3{background:#ff690f}.b4{background:#84329b}.b5{background:#00a699}.b6{background:#2f55d4}
</style>
</head>
<body>
<form action="https://google.com" method="get" target="_blank">
<div class="hdr">
<h1 class="tit">✈️ Reisekonfiguration PRO - DASHBOARD</h1>
<div class="cp"><div class="seg">15.11.2026</div><div class="seg">V35 - SLIDER+BADGE</div><div class="seg st">ALL 6 BTN</div></div>
</div>
<div class="row">
<div class="card">
<div class="ct">📋 Kern-Reisedaten (Direkt-Absprung)</div>
<div class="f"><label>Abflug (IATA oder Stadt)</label><input type="text" id="i1" name="from" autocomplete="off" placeholder="z.B. FRA, Frankfurt, PAG" required><div id="l1" class="ac"></div></div>
<div class="f"><label>Ziel (IATA oder Stadt)</label><input type="text" id="i2" name="to" autocomplete="off" placeholder="z.B. BKK, Bangkok, MNL" required><div id="l2" class="ac"></div></div>
<div class="f"><label>Hinflug</label><input type="date" id="od" name="outbound" min="2026-11-15" required></div>
<div class="f" id="rb"><label>Rückflug</label><input type="date" name="return" min="2026-11-15"></div>
</div>
<div class="card">
<div class="ct">⚙️ Filter & Flug-Parameter</div>
<div class="f"><div class="swc"><label for="ow" style="margin:0;cursor:pointer">Nur Hinflug (One-Way Lock)</label><label class="sw"><input type="checkbox" id="ow" name="oneway"><span class="sl"></span></label></div></div>
<div class="f"><label>Max. Reisezeit (1 – 36 Std.)</label><div class="sb"><span class="sc">1h</span><div class="swr"><output id="sv">14h</output><input type="range" id="sr" name="max_duration" min="1" max="36" value="14"></div><span class="sc">36h</span></div></div>
<div class="f"><label>Transit-Drehkreuz (Optional)</label><input type="text" id="i3" name="transit" autocomplete="off" placeholder="z.B. DXB, DOH, IST, SIN"><div id="l3" class="ac"></div></div>
<div class="f"><div class="swc yl"><label for="lc" style="margin:0;cursor:pointer">Sichere Low-Cost Airlines (Asien)</label><label class="sw"><input type="checkbox" id="lc" name="safe_asia_lcc" value="TR,3K,AK,FD,D7,VJ,5J,ZG,MM,GK,UO,IT,7C,TW,LJ,BX,6E,IX,FZ,G9"><span class="sl"></span></label></div></div>
</div>
</div>
<div class="bb">
<div class="ct" style="font-size:.95rem;margin-bottom:12px;border:none">🔍 Direkte Such-Schnittstellen (Google-Brücke)</div>
<div class="bf">
<button type="submit" name="q" value="Flüge" class="btn b1">Google</button>
<button type="submit" class="btn b2" formaction="https://skyscanner.de">Skyscanner</button>
<button type="submit" class="btn b3" formaction="https://kayak.de">Kayak</button>
<button type="submit" class="btn b4" formaction="https://momondo.de">Momondo</button>
<button type="submit" class="btn b5" formaction="https://kiwi.com">Kiwi</button>
<button type="submit" class="btn b6" formaction="https://trip.com">Trip.com</button>
</div>
</div>
</form>
<script>
const A=["FRA - Frankfurt","MUC - München","BER - Berlin","DUS - Düsseldorf","HAM - Hamburg","LEJ - Leipzig/Halle","CGN - Köln/Bonn","STR - Stuttgart","HAJ - Hannover","NUE - Nürnberg","DRS - Dresden","VIE - Wien","ZRH - Zürich","GVA - Genf","AMS - Amsterdam","CDG - Paris","LHR - London","IST - Istanbul","DXB - Dubai","DOH - Doha","AUH - Abu Dhabi","BKK - Bangkok","HKT - Phuket","CNX - Chiang Mai","USM - Koh Samui","KBV - Krabi","SIN - Singapur","KUL - Kuala Lumpur","PEN - Penang","SGN - Ho-Chi-Minh-Stadt","HAN - Hanoi","DAD - Da Nang","DPS - Bali","CGK - Jakarta","MNL - Manila","CEB - Cebu","DVO - Davao","PAG - Pagadian","ILO - Iloilo","CRK - Clark","PPS - Puerto Princesa","KLO - Kalibo","TYO - Tokio","HND - Tokio Haneda","NRT - Tokio Narita","KIX - Osaka","ICN - Seoul","HKG - Hongkong","TPE - Taipeh","DEL - Neu-Delhi","BOM - Mumbai","CMB - Colombo","MLE - Malé","SYD - Sydney","MEL - Melbourne","AKL - Auckland","JFK - New York","LAX - Los Angeles","MIA - Miami","CPT - Kapstadt"];.forEach(n=>{const i=document.getElementById("i"+n),l=document.getElementById("l"+n);i.oninput=()=>{const v=i.value.toLowerCase().trim();l.innerHTML="";if(!v){l.style.display="none";return}const m=A.filter(x=>x.toLowerCase().includes(v));l.style.display=m.length?"block":"none";m.forEach(x=>{const d=document.createElement("div");d.textContent=x;d.onclick=()=>{i.value=x;l.style.display="none"};l.appendChild(d)})};document.addEventListener("click",e=>{if(e.target!==i)l.style.display="none"})});const r=document.getElementById("sr"),o=document.getElementById("sv"),u=()=>{const p=(r.value-1)/35;o.textContent=r.value+"h";o.style.left=`calc(${p*100}% + ${8-p*16}px)`};r.oninput=u;u();
</script>
</body>
</html>
