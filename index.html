<script>
const $=id=>document.getElementById(id);
const P="https://";
const cols="#0284c7;#0369a1;#1d4ed8;#0077b6;#0ea5e9;#1e40af".split(";");
const airports="BER|Berlin Brandenburg|berlin;FRA|Frankfurt am Main|frankfurt;MUC|München|munich;LEJ|Leipzig/Halle|leipzig;DUS|Düsseldorf|dusseldorf;HAM|Hamburg|hamburg;CGN|Köln/Bonn|cologne;STR|Stuttgart|stuttgart;HAJ|Hannover|hanover;NUE|Nürnberg|nuremberg;VIE|Wien|vienna;ZRH|Zürich|zurich;BKK|Bangkok Suvarnabhumi|bangkok;DMK|Bangkok Don Mueang|bangkok;HKT|Phuket|phuket;CNX|Chiang Mai|chiang-mai;USM|Koh Samui|ko-samui;KBV|Krabi|krabi;DAD|Da Nang|da-nang;UIH|Quy Nhon|quy-nhon;SGN|Ho-Chi-Minh-Stadt (Saigon)|ho-chi-minh-city;HAN|Hanoi|hanoi;MNL|Manila|manila;CEB|Cebu|cebu;DGT|Dumaguete|dumaguete;PAG|Pagadian|pagadian;SIN|Singapur|singapore;KUL|Kuala Lumpur|kuala-lumpur;DPS|Denpasar Bali|denpasar;DXB|Dubai|dubai;DOH|Doha|doha;IST|Istanbul|istanbul;TYO|Tokio|tokyo;FAO|Faro|faro;CHC|Christchurch|christchurch".split(";");
let hrs=14,cidx=0,drag=false;

function isThreeLetters(s){
  if(s.length!==3)return false;
  for(let i=0;i<3;i++){
    const c=s.toUpperCase().charCodeAt(i);
    if(c<65||c>90)return false;
  }
  return true;
}

function iata(v){
  const s=v.trim();
  const idx1=s.indexOf("(");
  const idx2=s.indexOf(")");
  if(idx1!==-1&&idx2===idx1+4){
    const sub=s.slice(idx1+1,idx2);
    if(isThreeLetters(sub))return sub.toUpperCase();
  }
  if(isThreeLetters(s))return s.toUpperCase();
  const q=s.toLowerCase();
  const hit=airports.find(row=>row.toLowerCase().includes(q));
  if(hit)return hit.split("|").shift();
  return s.toUpperCase().slice(0,3);
}

function ac(inp,box){
  inp.addEventListener("input",()=>{
    const q=inp.value.trim().toLowerCase();
    box.innerHTML="";
    if(!q){box.style.display="none";upd();return;}
    const hits=airports.filter(row=>row.toLowerCase().includes(q));
    if(!hits.length){box.style.display="none";upd();return;}
    hits.forEach(row=>{
      const parts=row.split("|");
      const code=parts.shift();
      const name=parts.shift();
      const d=document.createElement("div");
      d.textContent=name+" ("+code+")";
      d.onclick=()=>{inp.value=name+" ("+code+")";box.style.display="none";upd();};
      box.appendChild(d);
    });
    box.style.display="block";
    upd();
  });
  document.addEventListener("click",e=>{
    if(!box.contains(e.target)&&e.target!==inp)box.style.display="none";
  });
}

function setHrs(h){
  hrs=Math.max(1,Math.min(36,Math.round(h)));
  const pct=((hrs-1)/35)*100;
  $("fl").style.width=pct+"%";
  $("sv").style.left=pct+"%";
  $("sv").textContent=hrs+"h";
  upd();
}

function bindSlider(){
  const sb=$("sb"),tk=$("tk");
  const move=clientX=>{
    const r=tk.getBoundingClientRect();
    const ratio=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    setHrs(1+ratio*35);
  };
  sb.addEventListener("pointerdown",e=>{drag=true;sb.setPointerCapture(e.pointerId);move(e.clientX);});
  sb.addEventListener("pointermove",e=>{if(drag)move(e.clientX);});
  sb.addEventListener("pointerup",e=>{drag=false;try{sb.releasePointerCapture(e.pointerId);}catch(err){}});
  sb.addEventListener("pointercancel",()=>{drag=false;});
}
  function upd(){
  const now=new Date(),dtEl=$("dt");
  dtEl.textContent=now.toLocaleDateString("de-DE")+" • "+now.toLocaleTimeString("de-DE");
  const idx=cidx++%cols.length;
  dtEl.style.setProperty("background-color",cols.slice(idx,idx+1).join(""),"important");

  const ow=$("ow").checked;
  $("st").textContent=ow?"NUR HINFLUG":"HIN & RÜCK";

  const c1=iata($("i1").value);
  const c2=iata($("i2").value);
  const od=$("od").value;
  const rd=$("rd").value;
  const px=+$("px").value||1;
  const ns=$("ns").checked;
  const s1=$("s1").checked;
  const s2=$("s2").checked;
  const lc=$("lc").checked;

  const badDate=(!ow&&od&&rd&&rd<od);
  $("rb").classList.toggle("err",badDate);

  if(isThreeLetters(c1)&&isThreeLetters(c2)&&od&&(ow||(rd&&!badDate))){
    const ymd1=od.slice(2).replace(/-/g,"");
    const ymd2=(!ow&&rd)?rd.slice(2).replace(/-/g,""):"";
    const mins=hrs*60;

    let skyStp="";
    if(ns)skyStp="&stops=!oneStop,!twoPlusStops";
    else if(s1)skyStp="&stops=!twoPlusStops";
    $("u1").href=P+"www.skyscanner.de/transport/fluge/"+c1.toLowerCase()+"/"+c2.toLowerCase()+"/"+ymd1+(ymd2?"/"+ymd2:"")+"/?adults="+px+"&duration="+mins+skyStp;

    const kStp=ns?"stops=0":(s1?"stops=1":(s2?"stops=2":""));
    const kQ=(kStp+"|duration=-"+mins+"|"+(lc?"":"noLowCost=true")).split("|").filter(Boolean).join("&");
    $("u2").href=P+"www.kayak.de/flights/"+c1+"-"+c2+"/"+od+(!ow&&rd?"/"+rd:"")+"/"+px+"adults"+(kQ?"?"+kQ:"");
    $("u3").href=P+"www.momondo.de/flight-search/"+c1+"-"+c2+"/"+od+(!ow&&rd?"/"+rd:"")+"/"+px+"adults"+(kQ?"?"+kQ:"");

    const tripType=ow?"oneway":"roundtrip";
    const leg1="from:"+c1+",to:"+c2+",departure:"+od+"TANYT";
    const leg2=!ow&&rd?"&leg2=from:"+c2+",to:"+c1+",departure:"+rd+"TANYT":"";
    $("u4").href=P+"www.expedia.de/Flights-Search?trip="+tripType+"&leg1="+leg1+leg2+"&passengers=adults:"+px+"&mode=search";

    const kwStp=ns?"&stopNumber=0":(s1?"&stopNumber=1":(s2?"&stopNumber=2":""));
    $("u5").href=P+"://kiwi.com"+c1+"&to="+c2+"&departure="+od+(!ow&&rd?"&return="+rd:"")+"&adults="+px+"&maxDuration="+hrs+kwStp;

    const trWay=ow?"OW":"RT";
    const trStp=ns?"&nonstoponly=1":(s1?"&maxstop=1":(s2?"&maxstop=2":""));
    $("u6").href=P+"://trip.com"+c1+"&acity="+c2+"&ddate="+od+(!ow&&rd?"&rdate="+rd:"")+"&triptype="+trWay+"&class=y&quantity="+px+"&locale=de-DE&curr=EUR"+trStp;
  }

  try{
    localStorage.setItem("rk_flt",JSON.stringify({
      i1:$("i1").value,i2:$("i2").value,od,rd,ow,px,hrs,ns,s1,s2,lc
    }));
  }catch(e){}
}

(function(){
  const t=new Date().toISOString().slice(0,10);
  $("od").min=t;
  $("rd").min=t;

  try{
    const d=JSON.parse(localStorage.getItem("rk_flt")||"null");
    if(d){
      if(d.i1)$("i1").value=d.i1;
      if(d.i2)$("i2").value=d.i2;
      if(d.od)$("od").value=d.od;
      if(d.rd)$("rd").value=d.rd;
      if(d.ow!==undefined)$("ow").checked=d.ow;
      if(d.px)$("px").value=d.px;
      if(d.hrs)hrs=d.hrs;
      if(d.ns!==undefined)$("ns").checked=d.ns;
      if(d.s1!==undefined)$("s1").checked=d.s1;
      if(d.s2!==undefined)$("s2").checked=d.s2;
      if(d.lc!==undefined)$("lc").checked=d.lc;
    }
  }catch(e){}

  $("ns").addEventListener("change",()=>{if($("ns").checked){$("s1").checked=false;$("s2").checked=false;}upd();});
  $("s1").addEventListener("change",()=>{if($("s1").checked){$("ns").checked=false;$("s2").checked=false;}upd();});
  $("s2").addEventListener("change",()=>{if($("s2").checked){$("ns").checked=false;$("s1").checked=false;}upd();});

  ac($("i1"),$("l1"));
  ac($("i2"),$("l2"));
  bindSlider();

  "i1;i2;od;rd;ow;px;lc".split(";").forEach(id=>{
    $(id).addEventListener("input",upd);
    $(id).addEventListener("change",upd);
  });
  "u1;u2;u3;u4;u5;u6".split(";").forEach(id=>{
    $(id).addEventListener("click",upd);
  });

  setHrs(hrs);
})();
</script>
</body>
</html>
