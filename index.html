<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f0f4f8; 
            --card-bg: #ffffff; 
            --text: #1e293b; 
            --border: #cbd5e1; 
            --flight: #0284c7; 
            --hotel: #0f766e; 
            --upgrade: #6d28d9; 
            --warn: #dc2626;
            --success: #16a34a;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card.fl { border-color: var(--flight); background: #f0f9ff; }
        .card.ho { border-color: var(--hotel); background: #f0fdf4; }
        .card.up { border-color: var(--upgrade); background: #faf5ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .fl .title { color: var(--flight); } 
        .ho .title { color: var(--hotel); } 
        .up .title { color: var(--upgrade); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; color: #475569; }
        input, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); }
        .btn-up { background: var(--upgrade); }
        .hidden { display: none !important; }
        .pass-box { position: relative; }
        .eye { position: absolute; right: 10px; top: 24px; cursor: pointer; font-size: 1.1rem; user-select: none; }
        .res-box { margin-top: 15px; padding: 15px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; }
        .l-btn { display: block; text-align: center; padding: 10px; margin-bottom: 8px; border-radius: 6px; text-decoration: none; color: white; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        .l-btn:hover { opacity: 0.9; }
        .l-btn.fl-btn { background: var(--flight); }
        .l-btn.ho-btn { background: var(--hotel); }
        .l-btn.up-btn { background: var(--upgrade); }
        
        /* Budget Rechner Display */
        .budget-calc-box { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; border: 1px solid #cbd5e1; }
        .budget-ok { background: #e6f4ea; color: var(--success); border-color: #a3cfbb; }
        .budget-error { background: #fce8e6; color: var(--warn); border-color: #f1aeb5; }
    </style>

    <script>
        // Haupt-Logik wird hier sicher geladen und überwacht alle Elemente
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- LOGIN & AUGE STEUERUNG ---
            var passInput = document.getElementById("password-input");
            var eyeIcon = document.getElementById("toggle-eye");
            var authButton = document.getElementById("auth-btn");
            var authSection = document.getElementById("auth-section");
            var mainContent = document.getElementById("main-content");

            function verifyAndLogin() {
                if (passInput.value.trim() === "Reise2026") {
                    authSection.classList.add("hidden");
                    mainContent.classList.remove("hidden");
                } else {
                    alert("Falsches Passwort!");
                }
            }

            // Klick auf das Auge-Symbol
            if(eyeIcon) {
                eyeIcon.addEventListener("click", function() {
                    if (passInput.type === "password") {
                        passInput.type = "text";
                        eyeIcon.innerText = "👁️‍🗨️";
                    } else {
                        passInput.type = "password";
                        eyeIcon.innerText = "👁️";
                    }
                });
            }

            // Klick auf Freischalten-Button
            if(authButton) {
                authButton.addEventListener("click", verifyAndLogin);
            }

            // Enter-Taste im Passwort-Feld
            if(passInput) {
                passInput.addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        verifyAndLogin();
                    }
                });
            }

            // --- AUTO-SYNC FLUG ZU HOTEL ---
            var destInput = document.getElementById("dest");
            var hDestInput = document.getElementById("h-dest");
            if(destInput && hDestInput) {
                destInput.addEventListener("input", function() {
                    hDestInput.value = destInput.value;
                });
            }

            // --- MULTISTOPP BUDGETRECHNER ---
            var budgetInput = document.getElementById("budget");
            var subBudgetInput = document.getElementById("sub-budget");
            var displayBox = document.getElementById("budget-calc-display");

            function updateBudgets() {
                var total = parseFloat(budgetInput.value) || 0;
                var sub = parseFloat(subBudgetInput.value) || 0;
                var diff = total - sub;
                
                if (diff < 0) {
                    displayBox.className = "budget-calc-box budget-error";
                    displayBox.innerHTML = "⚠️ Achtung: Teilbudget der 2. Teilstrecke übersteigt das Gesamtbudget! (Differenz: " + diff + " €)";
                } else {
                    displayBox.className = "budget-calc-box budget-ok";
                    displayBox.innerHTML = "📊 Restbudget 1. Teilstrecke: <span>" + diff + "</span> €";
                }
            }

            if(budgetInput && subBudgetInput) {
                budgetInput.addEventListener("input", updateBudgets);
                subBudgetInput.addEventListener("input", updateBudgets);
            }

            // --- TRAVEL TIME DISPLAY ---
            var mTimeInput = document.getElementById("m-time");
            var tValSpan = document.getElementById("t-val");
            if(mTimeInput && tValSpan) {
                mTimeInput.addEventListener("input", function() {
                    tValSpan.innerText = mTimeInput.value + " h";
                });
            }

            // --- SEKTION 3: UPGRADE LOGIK ---
            var upgradeBtn = document.getElementById("submit-upgrade-btn");
            var airlineInput = document.getElementById("airline");

            if(upgradeBtn) {
                upgradeBtn.addEventListener("click", function() {
                    var airline = airlineInput.value.trim();
                    if (!airline) { alert("Bitte eine Airline eingeben!"); return; }
                    
                    var airlineLower = airline.toLowerCase();
                    var upgradeUrl = "https://google.com" + encodeURIComponent(airline + " upgrade optionen vorteile");
                    
                    if (airlineLower.includes("lufthansa")) {
                        upgradeUrl = "https://lufthansa.com";
                    } else if (airlineLower.includes("condor")) {
                        upgradeUrl = "https://condor.com";
                    }
                    
                    var expertFlyerUrl = "https://expertflyer.com";
                    var seatGuruUrl = "https://google.com" + encodeURIComponent(airline + " seat map seatguru aerolopa");

                    window.open(upgradeUrl, '_blank');
                    window.open(expertFlyerUrl, '_blank');
                    window.open(seatGuruUrl, '_blank');
                });
            }

            // --- GENERATE LINKS LOGIK ---
            var generateBtn = document.getElementById("submit-generate-btn");
            if(generateBtn) {
                generateBtn.addEventListener("click", function() {
                    var dep = document.getElementById("dep").value.trim().toUpperCase();
                    var dest = destInput.value.trim().toUpperCase();
                    var via = document.getElementById("via").value.trim().toUpperCase();
                    var hDest = hDestInput.value.trim();
                    
                    var start = document.getElementById("start").value;
                    var end = document.getElementById("end").value;
                    var stops = document.getElementById("stops").value;
                    var cabin = document.getElementById("cabin").value;
                    var stars = document.getElementById("stars").value;

                    if (!dep || !dest || !start || !end) {
                        alert("Bitte füllen Sie mindestens Abflug, Endziel, Start- und Enddatum aus.");
                        return;
                    }

                    var gCabin = "economy";
                    if (cabin === "premium") gCabin = "premium_economy";
                    if (cabin === "business") gCabin = "business";
                    if (cabin === "first") gCabin = "first";

                    var gStops = "";
                    if (stops === "direct") gStops = ";20";
                    if (stops === "max1") gStops = ";11";
