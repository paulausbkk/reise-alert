<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO</title>
    <style>
        :root { --primary: #2563eb; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --flight: #0284c7; --hotel: #0f766e; --upgrade: #6d28d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card.fl { border-color: var(--flight); background: #f0f9ff; }
        .card.up { border-color: var(--upgrade); background: #faf5ff; }
        .card.ho { border-color: var(--hotel); background: #f0fdf4; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .fl .title { color: var(--flight); } .up .title { color: var(--upgrade); } .ho .title { color: var(--hotel); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; text-transform: none !important; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; text-transform: none !important; font-variant: normal !important; background-color: #ffffff; font-size: 0.9rem; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; background: var(--primary); font-size: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <!-- UPDATETE FLUGHAFEN-DATENLISTE -->
    <datalist id="airports-complete">
        <option value="Abu Dhabi (AUH)"></option>
        <option value="Antalya (AYT)"></option>
        <option value="Bangkok (BKK)"></option>
        <option value="Berlin (BER)"></option>
        <option value="Cebu (CEB)"></option>
        <option value="Christchurch (CHC)"></option>
        <option value="Da Nang (DAD)"></option>
        <option value="Doha (DOH)"></option>
        <option value="Dresden (DRS)"></option>
        <option value="Dumaguete (DGT)"></option>
        <option value="Düsseldorf (DUS)"></option>
        <option value="Frankfurt (FRA)"></option>
        <option value="Hamburg (HAM)"></option>
        <option value="Hanoi (HAN)"></option>
        <option value="Hongkong (HKG)"></option>
        <option value="Istanbul (IST)"></option>
        <option value="Kuala Lumpur (KUL)"></option>
        <option value="Leipzig (LEJ)"></option>
        <option value="London Heathrow (LHR)"></option>
        <option value="Los Angeles (LAX)"></option>
        <option value="Manila (MNL)"></option>
        <option value="München (MUC)"></option>
        <option value="New York (JFK)"></option>
        <option value="Pagadian (PAG)"></option>
        <option value="Paphos (PFO)"></option>
        <option value="Phuket (HKT)"></option>
        <option value="Saigon / Ho-Chi-Minh-Stadt (SGN)"></option>
        <option value="Singapore (SIN)"></option>
        <option value="Tokyo Haneda (HND)"></option>
        <option value="Wien (VIE)"></option>
        <option value="Zürich (ZRH)"></option>
    </datalist>

    <!-- SEKTION 1: Flug-Parameter -->
    <div class="card fl">
        <div class="title">✈️ Sektion 1: Flug-Parameter</div>
        <div class="grid">
            <div>
                <label>Abflugort (Stadt oder Code):</label>
                <input type="text" placeholder="z.B. Frankfurt" id="fl-from" list="airports-complete">
            </div>
            <div>
                <label>Zielort (Stadt oder Code):</label>
                <input type="text" placeholder="z.B. Manila" id="fl-to" list="airports-complete">
            </div>

            <div><label>Hinflug:</label><input type="text" placeholder="15.11.2026" id="fl-date1"></div>
            <div><label>Rückflug:</label><input type="text" placeholder="25.11.2026" id="fl-date2"></div>
            
            <div class="switch-container">
                <label>Nur Hinflug (One Way):</label>
                <label class="switch">
                    <input type="checkbox" id="fl-oneway">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="switch-container">
                <label>Asiatische Low-Cost Airlines einbeziehen (Cebu Pacific, VietJet, etc.):</label>
                <label class="switch">
                    <input type="checkbox" id="fl-lowcost">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <label>Beförderungsklasse:</label>
                <select id="fl-cabin">
                    <option>Economy</option>
                    <option>Premium Economy</option>
                    <option>Business Class</option>
                    <option>First Class</option>
                </select>
            </div>
            
            <div>
                <label>Personenanzahl:</label>
                <select id="fl-passengers">
                    <option>1 Person</option>
                    <option selected>2 Personen</option>
                    <option>3 Personen</option>
                    <option>4 Personen</option>
                </select>
            </div>
            
            <div>
                <label>Gepäckauswahl:</label>
                <select id="fl-baggage">
                    <option>Nur Handgepäck</option>
                    <option>Aufgabegepäck 20 KG</option>
                    <option>Aufgabegepäck 32 KG</option>
                    <option>Handgepäck plus 20 KG Aufgabegepäck</option>
                    <option>Handgepäck plus 32 KG Aufgabegepäck</option>
                </select>
            </div>
            
            <div>
                <label>Zwischenstopps:</label>
                <select id="fl-stops">
                    <option>Direktflug</option>
                    <option>Max. 1 Stopp</option>
                    <option>Max. 2 Stopps</option>
                </select>
            </div>

            <div>
                <label>Ort des Stopps (Stadt oder Code):</label>
                <input type="text" placeholder="z.B. Dubai" id="fl-stop-location" list="airports-complete">
            </div>

            <div>
                <label>Ticketpreis (€):</label>
                <input type="number" placeholder="800" id="fl-price">
            </div>

            <div class="full">
                <button type="button" class="btn" id="btn-search-flights" style="background: var(--flight); margin-top: 10px;">✈️ Flug-Suche starten</button>
            </div>
        </div>
    </div>

    <!-- SEKTION 2: Upgrade-Suche (Bestehendes Ticket) -->
    <div class="card up">
        <div class="title">🎫 Sektion 2: Upgrade-Suche & Ticket-Details</div>
        <div class="grid">
            <div class="full">
                <label>Name wie im Reisepass:</label>
                <input type="text" placeholder="z.B. MUELLER / MAXIMILIAN" id="up-name">
            </div>
            <div>
                <label>Buchungscode (6-stellig, z.B. PNR):</label>
                <input type="text" placeholder="z.B. X1Y2Z3" id="up-pnr" maxlength="6" style="text-transform: uppercase !important;">
            </div>
            <div>
                <label>Ticketnummer (13-stellig):</label>
                <input type="text" placeholder="z.B. 2201234567890" id="up-ticketno" maxlength="13">
            </div>
            <div>
                <label>Aktuelle Klasse:</label>
                <select id="up-current-class">
                    <option>Economy</option>
                    <option>Premium Economy</option>
                    <option>Business Class</option>
                </select>
            </div>
            <div>
                <label>Wunsch-Upgrade:</label>
                <select id="up-target-class">
                    <option>Premium Economy</option>
                    <option selected>Business Class</option>
                    <option>First Class</option>
                </select>
            </div>
        </div>
    </div>

    <!-- SEKTION 3: Hotel-Optionen -->
    <div class="card ho">
        <div class="title">🏨 Sektion 3: Hotel-Optionen</div>
        <div class="grid">
            <div class="full">
                <label>Hotel-Wunsch / Destination:</label>
                <input type="text" placeholder="z.B. Manila Bel-Air" id="ho-destination">
            </div>
            <div>
                <label>Sterne-Kategorie:</label>
                <select id="ho-stars">
                    <option>Beliebig</option>
