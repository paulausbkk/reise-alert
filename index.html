<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flugsuche PRO - RUBIN VERSION</title>
    <style>
        /* VISUELLES SIGNAL: Rubin-Rot zur sofortigen Erkennung */
        :root { --rubin-red: #991b1b; --bg-light: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: sans-serif; background: var(--bg-light); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: #0f172a; }
        
        /* Das neue, auffällige Rubin-Rot-Design */
        .card { border: 3px solid var(--rubin-red); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fef2f2; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--rubin-red); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        /* Der unblockierbare Gold-Gelbe Express-Knopf */
        .portal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .portal-btn { display: flex; align-items: center; justify-content: center; height: 45px; color: white; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 0.95rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .google-btn { background-color: #ea4335; }
        .skyscanner-btn { background-color: #007054; }
        .portal-btn:hover { opacity: 0.9; }
        .disabled-btn { background-color: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed; pointer-events: none; box-shadow: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #fee2e2; padding: 2px 6px; border-radius: 4px; color: var(--rubin-red);">[VERSION 2026 - RUBIN REPAIR]</span>
        </div>
        <div class="grid">
            <div><label>Abflugort (z.B. FRA):</label><input type="text" placeholder="FRA" id="from-code" value="FRA" maxlength="3" style="text-transform: uppercase;"></div>
            <div><label>Zielort (z.B. MNL):</label><input type="text" placeholder="MNL" id="to-code" value="MNL" maxlength="3" style="text-transform: uppercase;"></div>
            <div class="full"><label>Hinflugs-Datum:</label><input type="date" id="flight-date"></div>
            
            <div class="full" style="margin-top: 10px;">
                <label>Klicke auf dein Wunsch-Portal (Öffnet garantiert im Flugmodus):</label>
                <div class="portal-buttons">
                    <a href="#" target="_blank" class="portal-btn google-btn disabled-btn" id="link-google">Google Flights ➔</a>
                    <a href="#" target="_blank" class="portal-btn skyscanner-btn disabled-btn" id="link-skyscanner">Skyscanner ➔</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var fCode = document.getElementById('from-code');
    var tCode = document.getElementById('to-code');
    var fDate = document.getElementById('flight-date');
    
    var gLink = document.getElementById('link-google');
    var sLink = document.getElementById('link-skyscanner');

    // Standarddatum auf den 15.11.2026 setzen
    fDate.value = "2026-11-15";

    function updateLiveLinks() {
        var from = fCode.value.toUpperCase().trim();
        var to = tCode.value.toUpperCase().trim();
        var date = fDate.value;

        if (from.length === 3 && to.length === 3 && date) {
            // REPARIERTER ZUSAMMENBAU: Absolut saubere Textketten ohne Zeichendreher
            var secureProtocol = "https://";
            
            // 1. Google Flights Link
            var googleQuery = "flights from " + from + " to " + to + " on " + date + " one way";
            gLink.href = secureProtocol + "://google.com" + encodeURIComponent(googleQuery) + "&hl=de";
            gLink.classList.remove('disabled-btn');
            
            // 2. Skyscanner Link
            var shortDate = date.replace(/-/g, '').substring(2); // Macht "261115"
            sLink.href = secureProtocol + "www.skyscanner.de/transport/flights/" + from.toLowerCase() + "/" + to.toLowerCase() + "/" + shortDate + "/?adults=1&rtn=0&language=de";
            sLink.classList.remove('disabled-btn');
        } else {
            gLink.href = "#";
            gLink.classList.add('disabled-btn');
            sLink.href = "#";
            sLink.classList.add('disabled-btn');
        }
    }

    fCode.addEventListener('input', updateLiveLinks);
    tCode.addEventListener('input', updateLiveLinks);
    fDate.addEventListener('change', updateLiveLinks);
    
    updateLiveLinks();
</script>
</body>
</html>
