<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Reisekonfiguration PRO - HTML PRO</title>
    <style>
        :root { --primary-blue: #0284c7; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --lowcost-yellow: #fef08a; --lowcost-border: #eab308; --active-green: #22c55e; --gold-yellow: #f59e0b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: var(--primary-blue); }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-color: var(--primary-blue); background: #f0f9ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary-blue); display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; height: 38px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; background-color: #ffffff; font-size: 0.9rem; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; height: 38px; box-sizing: border-box; }
        .switch-container.yellow-highlight { background-color: var(--lowcost-yellow); border: 1px solid var(--lowcost-border); }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-green) !important; }
        input:checked + .slider:before { transform: translateX(18px); }
        .range-container { background: #fff; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        
        /* Der unblockierbare Formular-Button */
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 45px; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; background: var(--gold-yellow); font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn:hover { background: #d97706; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <datalist id="airports-complete">
        <option value="FRA"></option><option value="MNL"></option><option value="CEB"></option><option value="BKK"></option><option value="DXB"></option><option value="SIN"></option><option value="MUC"></option><option value="DUS"></option>
    </datalist>

    <!-- Das Formular übergibt die Kriterien unblockierbar direkt an die Google-Suche -->
    <form action="https://google.com" method="get" target="_blank" class="card">
        <div class="title">
            <span>✈️ Sektion 1: Flug-Parameter</span>
            <span style="font-size: 0.75rem; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; color: var(--primary-blue);">[VERSION 2026 - HTML PRO]</span>
        </div>
        <div class="grid">
            
            <!-- Die Eingabefelder füttern direkt das Suchfeld im Hintergrund -->
            <div><label>Abflugort (Code):</label><input type="text" placeholder="z.B. FRA" id="fl-from" value="FRA" maxlength="3" style="text-transform: uppercase;" required></div>
            <div><label>Zielort (Code):</label><input type="text" placeholder="z.B. MNL" id="fl-to" value="MNL" maxlength="3" style="text-transform: uppercase;" required></div>
            
            <!-- Hinflug setzt live das "min"-Attribut für den Rückflug -->
            <div><label>Hinflug:</label><input type="date" id="fl-date1" value="2026-11-15" required></div>
            
            <!-- Das Rückflugfeld blockiert über min="2026-11-15" nativ alle Tage davor im Kalender -->
            <div><label>Rückflug:</label><input type="date" id="fl-date2" value="2026-11-25" min="2026-11-15"></div>
            
            <div class="switch-container"><label>Nur Hinflug (One Way):</label><label class="switch"><input type="checkbox" id="fl-oneway"><span class="slider"></span></label></div>
            <div class="switch-container yellow-highlight"><label style="color:#854d0e;">Low-Cost Airlines:</label><label class="switch"><input type="checkbox" id="fl-lowcost"><span class="slider"></span></label></div>
            
            <div>
                <label>Beförderungsklasse:</label>
                <select id="fl-cabin"><option value="Economy">Economy</option><option value="Business">Business Class</option></select>
            </div>
            <div>
                <label>Personen:</label>
                <select id="fl-passengers"><option value="1">1 Person</option><option value="2" selected>2 Personen</option></select>
            </div>
            
            <!-- Das versteckte Feld, das die Suchanfrage unzerstörbar für Google verpackt -->
            <input type="hidden" name="q" id="hidden-query" value="">

            <div class="full">
                <button type="submit" class="btn" style="width:100%;">Gold - Flug-Suche starten</button>
            </div>
        </div>
    </form>
</div>

<script>
    var d1 = document.getElementById('fl-date1');
    var d2 = document.getElementById('fl-date2');
    var ow = document.getElementById('fl-oneway');
    var from = document.getElementById('fl-from');
    var to = document.getElementById('fl-to');
    var hQuery = document.getElementById('hidden-query');

    function updateFormEngine() {
        // NATIVE KALENDER-SPERRE: Setzt das aktuelle Hinflugdatum als absolutes Minimum für den Rückflugkalender
        if(d1.value) {
            d2.min = d1.value;
            if(d2.value && d2.value < d1.value) {
                d2.value = d1.value;
            }
        }

        if(ow.checked) {
            d2.disabled = true;
            d2.value = "";
            hQuery.value = "google flights from " + from.value + " to " + to.value + " on " + d1.value + " one way";
        } else {
            d2.disabled = false;
            hQuery.value = "google flights from " + from.value + " to " + to.value + " on " + d1.value + " return " + d2.value;
        }
    }

    // Event-Listener aktivieren
    d1.addEventListener('change', updateFormEngine);
    d2.addEventListener('change', updateFormEngine);
    ow.addEventListener('change', updateFormEngine);
    from.addEventListener('input', updateFormEngine);
    to.addEventListener('input', updateFormEngine);

    // Initialer Start beim Laden der Seite
    updateFormEngine();
</script>
</body>
</html>
