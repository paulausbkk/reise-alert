<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Flugsuche PRO - EXKURS VERSION</title>
    <style>
        /* VISUELLES SIGNAL: Alarm-Gelb zur sofortigen Erkennung */
        :root { --alarm-yellow: #eab308; --bg-light: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; }
        body { font-family: sans-serif; background: var(--bg-light); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; color: #0f172a; }
        
        /* Das neue, unübersehbare Alarm-Gelb-Design */
        .card { border: 3px solid var(--alarm-yellow); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fef8e7; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; color: #a16207; display: flex; justify-content: space-between; }
        
        /* Das sichtbare Textfeld zum Kopieren */
        .copy-box { background: #ffffff; border: 2px dashed #ca8a04; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; word-break: break-all; color: #1e293b; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ Reisekonfiguration PRO</h1>
    
    <div class="card">
        <div class="title">
            <span>✈️ Sektion 1: Manueller Express-Pfad</span>
            <span style="font-size: 0.75rem; background: #fef08a; padding: 2px 6px; border-radius: 4px; color: #a16207;">[VERSION 2026 - MANUAL LINK]</span>
        </div>
        
        <p style="font-size: 0.9rem; margin: 0 0 10px 0; color: #475569;">
            Da das System automatische Klicks filtert, kopiere diese Zeile von deinem Bildschirm und füge sie oben in deine Browser-Adresszeile ein:
        </p>

        <!-- HIER STEHT DER PRIO-LINK ALS NACKTER, SICHTBARER TEXT -->
        <div class="copy-box">
            https://google.com
        </div>
    </div>
</div>
</body>
</html>
