
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ McKinney Reisekonfiguration PRO</title>
    <style>
        :root { --primary: #2563eb; --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --border: #cbd5e1; --flight: #0284c7; --upgrade: #6d28d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
        .card { border: 2px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card.fl { border-color: var(--flight); background: #f0f9ff; }
        .card.up { border-color: var(--upgrade); background: #faf5ff; }
        .title { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .fl .title { color: var(--flight); } .up .title { color: var(--upgrade); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        label { display: block; font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; color: #475569; }
        input, select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; background: var(--primary); }
        .res-box { margin-top: 15px; padding: 15px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; display: none; }
        .up-proto { margin-top: 15px; padding: 10px; background: #fff; border: 1px dashed var(--upgrade); border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #334155; white-space: pre-wrap; }
    </style>
    <script>
        window.onload = function() {
            var pw = prompt("🔑 Passwort erforderlich:");
            if (pw === "Reise2026") {
                document.getElementById("main-content").style.display = "block";
                var stored = localStorage.getItem("mck_rad");
                if (stored) {
                    var d = JSON.parse(stored);
                    document.getElementById("dep").value = d.dep || "";
                    document.getElementById("dest").value = d.dest || "";
                    document.getElementById("pnr").value = d.pnr || "";
                }
            } else {
                alert("Falsches Passwort!");
                window.location.reload();
            }
        };

        function generate() {
            var dep = document.getElementById("dep").value.toUpperCase();
            var dest = document.getElementById("dest").value.toUpperCase();
            var pnr = document.getElementById("pnr").value.toUpperCase();
            
            localStorage.setItem("mck_rad", JSON.stringify({dep, dest, pnr}));
            
            var proto = `=========================================\nREISEPROTOKOLL\n=========================================\nRoute: ${dep} -> ${dest}\nPNR:   ${pnr || 'N/A'}\n=========================================`;
            document.getElementById("output").textContent = proto;
            document.getElementById("result-box").style.display = "block";
        }
    </script>
</head>
<body>
<div class="container">
    <div id="main-content" style="display:none;">
        <h1>✈ McKinney Reisekonfiguration PRO</h1>
        <div class="card fl">
            <div class="title">✈ Sektion 1: Flug-Parameter</div>
            <div class="grid">
                <div><label>Abflug (Code):</label><input type="text" id="dep" value="FRA"></div>
                <div><label>Endziel (Code):</label><input type="text" id="dest" value="MIA"></div>
            </div>
        </div>
        <div class="card up">
            <div class="title">💎 Sektion 2: Upgrade-Manager</div>
            <div class="grid">
                <div class="full"><label>Buchungsnummer (PNR):</label><input type="text" id="pnr" placeholder="X7YZ3R"></div>
            </div>
        </div>
        <button class="btn" onclick="generate()">System-Links & Protokolle generieren</button>
        <div id="result-box" class="res-box">
            <div class="up-proto" id="output"></div>
        </div>
    </div>
</div>
</body>
