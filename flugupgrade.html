<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✈️ Flugcockpit</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.bk{background:#1e293b;color:#fff;text-decoration:none;padding:8px 14px;
border-radius:6px;font-weight:bold;font-size:.85rem}
.card{max-width:650px;margin:0 auto 20px auto;border:2px solid var(--r);
border-radius:8px;padding:20px;background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#ff0000}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);
border-radius:4px;box-sizing:border-box;font-size:.98rem;background:#fff;
width:100%;color:#000}
input::placeholder{color:#ff0000;font-weight:bold;opacity:1}
.cpb{display:flex;gap:6px}
.cpb button{width:46px;height:40px;border:1px solid var(--b);background:#fff;
border-radius:4px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.bb{max-width:650px;margin:0 auto;border:2px solid var(--b);background:#fff;
border-radius:8px;padding:15px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;
background:var(--v);color:#fff;font-weight:bold;border-radius:6px;
font-size:.95rem;text-transform:uppercase;text-decoration:none}
.hinweis{background:#fff;border:1px solid var(--r);color:#991b1b;
padding:8px 12px;border-radius:4px;font-size:.85rem;margin-bottom:14px;font-weight:bold}
#ts{display:none;margin-top:10px;background:#dcfce7;border:1px solid var(--v);
color:#14532d;padding:8px 12px;border-radius:4px;font-weight:bold;
font-size:.88rem}
</style>
</head>
<body>
<div class="hdr">
<h1 class="tit">✈️ Flugcockpit – Meine Buchungen</h1>
<a href="index.html" class="bk">⬅️ Zurück zur Flugsuche</a>
</div>
<div class="card">
<div class="ct">1️⃣ Airline / Veranstalter wählen</div>
<div class="f"><label>Airline / Reiseveranstalter</label>
<select id="u5">
<optgroup label="✈️ Airlines">
<option value="pnr_ln|https://turkishairlines.com">Turkish Airlines</option>
<option value="pnr_ln|https://lufthansa.com">Lufthansa</option>
<option value="pnr_ln|https://qatarairways.com">Qatar Airways</option>
<option value="pnr_ln|https://emirates.com">Emirates</option>
<option value="pnr_ln|https://singaporeair.com">Singapore Airlines</option>
<option value="pnr_ln|https://thaiairways.com">Thai Airways</option>
<option value="pnr_ln|https://cathaypacific.com">Cathay Pacific</option>
<option value="pnr_ln|https://philippineairlines.com">Philippine Airlines</option>
<option value="pnr_ln|https://cebupacificair.com">Cebu Pacific (Low-Cost Asien)</option>
<option value="pnr_ln|https://flyscoot.com">Scoot (Low-Cost Asien)</option>
<option value="pnr_ln|https://bangkokair.com">Bangkok Airways</option>
<option value="pnr_fn_ln|https://vietjetair.com">VietJet Air (Low-Cost Asien)</option>
<option value="mail_pnr|https://airasia.com">AirAsia (Low-Cost Asien)</option>
</optgroup>
<optgroup label="🧳 Reisevermittler & Portale">
<option value="mail_pnr|https://gotogate.de">Gotogate (Meine Buchungen)</option>
<option value="mail_only|https://expedia.de">Expedia (Reiseplan)</option>
<option value="mail_pnr|https://trip.com?">Trip.com (Buchungen)</option>
<option value="mail_only|https://kiwi.com">Kiwi.com (Buchungen)</option>
<option value="mail_only|https://skyscanner.de">Skyscanner (Mein Konto)</option>
<option value="mail_only|https://kayak.de">Kayak (Trips)</option>
<option value="mail_only|https://momondo.de">Momondo (Trips)</option>
<option value="mail_pnr|https://opodo.de">Opodo (Meine Reisen)</option>
</optgroup>
</select></div>
<div id="hint" class="hinweis">Benötigt: 6-stelliger Buchungscode (PNR) + Nachname</div>
<div id="f_pnr" class="f"><label>Airline- / Vermittler-Buchungscode (PNR)</label>
<div class="cpb"><input type="text" id="u3" placeholder="PFLICHT: Buchungscode (z.B. TW8ZRK)" style="text-transform:uppercase">
<button type="button" onclick="cp('u3','Buchungscode')">📋</button></div></div>

<div id="f_fn" class="f" style="display:none"><label>Vorname wie im Reisepass</label>
<div class="cpb"><input type="text" id="u1" placeholder="PFLICHT: Vorname (z.B. MAX)" style="text-transform:uppercase">
<button type="button" onclick="cp('u1','Vorname')">📋</button></div></div>

<div id="f_ln" class="f"><label>Nachname wie im Reisepass (ohne Vornamen!)</label>
<div class="cpb"><input type="text" id="u6" placeholder="PFLICHT: Nur Nachname (z.B. MÜLLER)" style="text-transform:uppercase">
<button type="button" onclick="cp('u6','Nachname')">📋</button></div></div>

<div id="f_mail" class="f" style="display:none"><label>Buchungs-E-Mail / Konto-Login</label>
<div class="cpb"><input type="email" id="u4" placeholder="PFLICHT: E-Mail-Adresse der Buchung">
<button type="button" onclick="cp('u4','E-Mail')">📋</button></div></div>
</div>

<div class="bb">
<a id="go" href="https://turkishairlines.com"
target="_blank" onclick="cpAuto()" class="btn">
🚀 Buchung bei Anbieter öffnen (Code wird kopiert)</a>
<div id="ts"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const keys="u1;u3;u4;u5;u6".split(";");
function cp(id,lbl){
  const v=$(id).value.trim();if(!v)return;
  try{navigator.clipboard.writeText(v);
  $("ts").textContent="✅ "+lbl+" kopiert: "+v;
  $("ts").style.display="block"}catch(e){}
}
function cpAuto(){
  const mode=$("u5").value.split("|").shift();
  if(mode==="mail_only")cp("u4","E-Mail");
  else cp("u3","Buchungscode");
}
function sv(){
  const parts=$("u5").value.split("|");
  const mode=parts.shift();
  const url=parts.join("|");
  $("go").href=url;
  $("f_pnr").style.display=(mode==="mail_only")?"none":"flex";
  $("f_fn").style.display=(mode==="pnr_fn_ln")?"flex":"none";
  $("f_ln").style.display=(mode==="pnr_ln"||mode==="pnr_fn_ln")?"flex":"none";
  $("f_mail").style.display=(mode==="mail_pnr"||mode==="mail_only")?"flex":"none";
  if(mode==="pnr_ln")$("hint").textContent="Benötigt: Buchungscode (PNR) + Nachname";
  if(mode==="pnr_fn_ln")$("hint").textContent="Benötigt (VietJet Air): Buchungscode (PNR) + Vorname + Nachname";
  if(mode==="mail_pnr")$("hint").textContent="Benötigt: Buchungs-E-Mail + Buchungscode (PNR)";
  if(mode==="mail_only")$("hint").textContent="Benötigt: Login mit deiner Buchungs-E-Mail beim Portal";
  const d={};keys.forEach(k=>d[k]=$(k).value);
  try{localStorage.setItem("rk_upg",JSON.stringify(d))}catch(e){}
}
(function ld(){
  try{
    const raw=localStorage.getItem("rk_upg");
    if(raw){
      const d=JSON.parse(raw);
      keys.forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]});
    }
  }catch(e){}
  sv();
})();
keys.forEach(k=>{
  $(k).addEventListener("input",sv);
  $(k).addEventListener("change",sv);
});
</script>
</body>
</html>
