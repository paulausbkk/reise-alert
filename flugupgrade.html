<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎫 Flug-Upgrade & Buchungs-Check</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.bk{background:#1e293b;color:#fff;text-decoration:none;padding:8px 14px;
border-radius:6px;font-weight:bold;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 420px;border:2px solid var(--r);border-radius:8px;padding:20px;
background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);
border-radius:4px;box-sizing:border-box;font-size:.98rem;background:#fff;
width:100%}
.cpb{display:flex;gap:6px}
.cpb button{width:46px;height:40px;border:1px solid var(--b);background:#fff;
border-radius:4px;cursor:pointer;font-size:1.1rem}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;
background:var(--v);color:#fff;font-weight:bold;border-radius:6px;
font-size:.95rem;text-transform:uppercase;text-decoration:none}
#ts{display:none;margin-top:10px;background:#dcfce7;border:1px solid var(--v);
color:#14532d;padding:8px 12px;border-radius:4px;font-weight:bold;
font-size:.88rem}
</style>
</head>
<body>
<div class="hdr">
<h1 class="tit">🎫 Flug-Upgrade & Buchungs-Cockpit</h1>
<a href="index.html" class="bk">⬅️ Zurück zur Flugsuche</a>
</div>
<div class="row">
<div class="card">
<div class="ct">✈️ Flug- & Ticketdaten</div>
<div class="f"><label>Reisedatum</label>
<input type="date" id="u1" min="2026-11-15"></div>
<div class="f"><label>Strecke (z.B. BER - BKK)</label>
<input type="text" id="u2" placeholder="z.B. BER - BKK"></div>
<div class="f"><label>Buchungsnummer (PNR, 6-stellig)</label>
<div class="cpb"><input type="text" id="u3" placeholder="z.B. ABC123">
<button type="button" onclick="cp('u3','Buchungscode')">📋</button></div></div>
<div class="f"><label>Ticketnummer (13-stellig)</label>
<div class="cpb"><input type="text" id="u4" placeholder="z.B. 220-1234567890">
<button type="button" onclick="cp('u4','Ticketnummer')">📋</button></div></div>
</div>
<div class="card">
<div class="ct">🛂 Passagier & Airline / Veranstalter</div>
<div class="f"><label>Airline / Reiseveranstalter</label><select id="u5">
<option value="https://lufthansa.com">Lufthansa</option>
<option value="https://qatarairways.com">Qatar Airways</option>
<option value="https://emirates.com">Emirates</option>
<option value="https://singaporeair.com">Singapore Airlines</option>
<option value="https://thaiairways.com">Thai Airways</option>
<option value="https://turkishairlines.com">Turkish Airlines</option>
<option value="https://cathaypacific.com">Cathay Pacific</option>
<option value="https://philippineairlines.com">Philippine Airlines</option>
<option value="https://cebupacificair.com">Cebu Pacific</option>
<option value="https://airasia.com">AirAsia</option>
<option value="https://trip.com">Trip.com (Veranstalter)</option>
<option value="https://kiwi.com">Kiwi.com (Veranstalter)</option>
</select></div>
<div class="f"><label>Name wie im Reisepass</label>
<div class="cpb"><input type="text" id="u6" placeholder="Nachname / Vorname">
<button type="button" onclick="cp('u6','Name')">📋</button></div></div>
<div class="f"><label>Reisepassnummer (Optional)</label>
<div class="cpb"><input type="text" id="u7" placeholder="Passnummer">
<button type="button" onclick="cp('u7','Passnummer')">📋</button></div></div>
</div>
</div>
<div class="bb">
<a id="go" href="https://lufthansa.com"
target="_blank" class="btn">🚀 Upgrade & Buchung bei Airline prüfen</a>
<div id="ts"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function cp(id,lbl){
  const v=$(id).value;if(!v)return;
  try{navigator.clipboard.writeText(v);
  $("ts").textContent="✅ "+lbl+" kopiert: "+v;
  $("ts").style.display="block"}catch(e){}
}
function sv(){
  $("go").href=$("u5").value;
  const d={};
  Array.of("u1","u2","u3","u4","u5","u6","u7").forEach(k=>d[k]=$(k).value);
  try{localStorage.setItem("rk_upg",JSON.stringify(d))}catch(e){}
  window.name="UPG:"+JSON.stringify(d);
}
try{
  const r=window.name.startsWith("UPG:")?window.name.slice(4):
    (localStorage.getItem("rk_upg")||"{}");
  const d=JSON.parse(r);
  Array.of("u1","u2","u3","u4","u5","u6","u7")
    .forEach(k=>{if(d[k])$(k).value=d[k]});
}catch(e){}
sv();
Array.of("u1","u2","u3","u4","u5","u6","u7").forEach(k=>{
  $(k).oninput=sv;$(k).onchange=sv;
});
</script>
</body>
</html>
