<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎫 Flug-Upgrade & Buchungs-Check</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.bk{background:#1e293b;color:#fff;text-decoration:none;padding:8px 14px;
border-radius:6px;font-weight:bold;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 420px;border:2px solid var(--r);border-radius:8px;padding:20px;
background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column}
.f2{display:flex;gap:10px;margin-bottom:14px}
.f2>div{flex:1;display:flex;flex-direction:column}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);
border-radius:4px;box-sizing:border-box;font-size:.98rem;background:#fff;
width:100%;color:#000}
.req::placeholder{color:#ff0000;font-weight:bold;opacity:1}
.req-lbl{color:#ff0000}
.cpb{display:flex;gap:6px}
.cpb button{width:46px;height:40px;border:1px solid var(--b);background:#fff;
border-radius:4px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;
background:var(--v);color:#fff;font-weight:bold;border-radius:6px;
font-size:.95rem;text-transform:uppercase;text-decoration:none}
.info{margin-top:10px;background:#f8fafc;border:1px solid var(--b);
color:#334155;padding:8px 12px;border-radius:4px;font-size:.86rem}
#ts{display:none;margin-top:10px;background:#dcfce7;border:1px solid var(--v);
color:#14532d;padding:8px 12px;border-radius:4px;font-weight:bold;
font-size:.88rem}
</style>
</head>
<body>
<div class="hdr">
<h1 class="tit">🎫 Flug-Upgrade & Buchungs-Cockpit</h1>
<a href="index.html" class="bk">⬅️ Zurück zur Flugsuche</a>
</div>
<div class="row">
<div class="card">
<div class="ct">✈️ Flug- & Segmentdaten</div>
<div class="f"><label>Gesamtbuchung (Zubringer + Langstrecke)</label>
<input type="text" id="u2" placeholder="z.B. BER - IST - BKK"></div>
<div class="f2">
<div><label>Upgrade-Teilstrecke</label>
<input type="text" id="u8" placeholder="z.B. IST - BKK" style="text-transform:uppercase"></div>
<div><label>Flugnummer (Segment)</label>
<input type="text" id="u9" placeholder="z.B. TK 68" style="text-transform:uppercase"></div>
</div>
<div class="f"><label>Abflugdatum des Upgrade-Flugs (ggf. Folgetag!)</label>
<input type="date" id="u1" min="2026-11-15"></div>
<div class="f"><label class="req-lbl">Airline-Buchungscode (PNR, 6-stellig – Pflichtfeld)</label>
<div class="cpb"><input type="text" id="u3" class="req" placeholder="PFLICHT: 6-stellig (z.B. TW8ZRK)" style="text-transform:uppercase">
<button type="button" onclick="cp('u3','Buchungscode')">📋</button></div></div>
<div class="f"><label>Ticketnummer (13-stellig, z.B. 235-...)</label>
<div class="cpb"><input type="text" id="u4" placeholder="z.B. 2354817365876">
<button type="button" onclick="cp('u4','Ticketnummer')">📋</button></div></div>
</div>
<div class="card">
<div class="ct">🛂 Passagier, Airline & Upgrade-Limit</div>
<div class="f"><label class="req-lbl">Airline / Reiseveranstalter (Pflichtfeld)</label><select id="u5">
<option value="https://turkishairlines.com">Turkish Airlines (Buchung verwalten / Upgrade)</option>
<option value="https://expedia.de">Expedia (Meine Reisen / PNR ablesen)</option>
<option value="https://lufthansa.com">Lufthansa (Meine Buchungen)</option>
<option value="https://qatarairways.com">Qatar Airways (Manage Booking)</option>
<option value="https://emirates.com">Emirates (Manage Booking)</option>
<option value="https://singaporeair.com">Singapore Airlines (Manage Booking)</option>
<option value="https://thaiairways.com">Thai Airways (My Booking)</option>
<option value="https://cathaypacific.com">Cathay Pacific (Manage Booking)</option>
<option value="https://philippineairlines.com">Philippine Airlines (Manage Booking)</option>
<option value="https://cebupacificair.com">Cebu Pacific (Manage Booking)</option>
<option value="https://airasia.com">AirAsia (My Bookings)</option>
<option value="https://trip.com?">Trip.com (Meine Buchungen)</option>
<option value="https://kiwi.com">Kiwi.com (Buchungen)</option>
</select></div>
<div class="f"><label class="req-lbl">Nachname wie im Reisepass (Pflichtfeld, ohne Vornamen!)</label>
<div class="cpb"><input type="text" id="u6" class="req" placeholder="PFLICHT: Nur Nachname (z.B. MÜLLER)" style="text-transform:uppercase">
<button type="button" onclick="cp('u6','Nachname')">📋</button></div></div>
<div class="f2">
<div><label>Max. Upgrade-Preis (€)</label>
<input type="number" id="u10" placeholder="z.B. 450"></div>
<div><label>Vorhandene Meilen / Budget</label>
<input type="number" id="u11" placeholder="z.B. 35000"></div>
</div>
</div>
</div>
<div class="bb">
<a id="go" href="https://turkishairlines.com"
target="_blank" onclick="cp('u3','Buchungscode')" class="btn">
🚀 Upgrade & Buchung bei Airline prüfen</a>
<div id="info" class="info">💡 Tipp: Bei der Airline unter „Buchung verwalten“ PNR + Nachname eingeben und gezielt das Langstrecken-Segment wählen.</div>
<div id="ts"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const keys="u1;u2;u3;u4;u5;u6;u8;u9;u10;u11".split(";");
function cp(id,lbl){
  const v=$(id).value.trim();if(!v)return;
  try{navigator.clipboard.writeText(v);
  $("ts").textContent="✅ "+lbl+" kopiert: "+v;
  $("ts").style.display="block"}catch(e){}
}
function sv(){
  $("go").href=$("u5").value;
  const seg=$("u8").value.trim().toUpperCase();
  const fnr=$("u9").value.trim().toUpperCase();
  const prc=$("u10").value.trim();
  const mls=$("u11").value.trim();
  let txt="🎯 <b>Upgrade-Fokus:</b> "+(seg||"Langstrecke")+(fnr?" ("+fnr+")":"");
  if(prc)txt+=" • <b>Limit:</b> max. "+prc+" €";
  if(mls)txt+=" • <b>Meilen:</b> "+mls;
  if(seg||fnr||prc||mls){
    $("info").innerHTML=txt+" – bei der Airline PNR & Nachname eingeben.";
  }else{
    $("info").textContent="💡 Tipp: Bei der Airline unter „Buchung verwalten“ PNR + Nachname eingeben und gezielt das Langstrecken-Segment wählen.";
  }
  const d={};keys.forEach(k=>d[k]=$(k).value);
  const s=JSON.stringify(d);
  try{localStorage.setItem("rk_upg",s)}catch(e){}
  try{window.name="UPG:"+s}catch(e){}
}
(function ld(){
  let raw="";
  try{raw=localStorage.getItem("rk_upg")||""}catch(e){}
  if(!raw&&window.name&&window.name.startsWith("UPG:"))raw=window.name.slice(4);
  if(raw){
    try{
      const d=JSON.parse(raw);
      keys.forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]});
    }catch(e){}
  }
  sv();
})();
keys.forEach(k=>{
  $(k).addEventListener("input",sv);
  $(k).addEventListener("change",sv);
});
</script>
</body>
</html>
