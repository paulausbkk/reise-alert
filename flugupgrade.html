<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✈️ Flugcockpit</title>
<style>
:root{--r:#991b1b;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;
color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;
border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;
flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.cp{display:flex;gap:6px;background:#1e293b;padding:4px;border-radius:6px;
align-items:center}
.seg{font-size:.75rem;padding:6px 10px;border-radius:4px;font-weight:bold;
color:#fff;text-transform:uppercase;background:var(--v);text-decoration:none}
.bk{background:#475569}
.card{max-width:650px;margin:0 auto 20px auto;border:2px solid var(--r);
border-radius:8px;padding:20px;background:#fef2f2;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);
border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column;transition:.2s}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.f.off{opacity:.35;pointer-events:none}
.f.off input{background:#cbd5e1!important}
.f.off label{color:#64748b!important}
.f.off input::placeholder{color:#64748b!important}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#ff0000}
label.opt{color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);
border-radius:4px;box-sizing:border-box;font-size:.98rem;background:#fff;
width:100%;color:#000}
input::placeholder{color:#ff0000;font-weight:bold;opacity:1}
input.opt::placeholder{color:#94a3b8;font-weight:normal}
.cpb{display:flex;gap:6px}
.cpb button{width:46px;height:40px;border:1px solid var(--b);background:#fff;
border-radius:4px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
.bb{max-width:650px;margin:0 auto;border:2px solid var(--b);background:#fff;
border-radius:8px;padding:15px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;
background:var(--v);color:#fff;font-weight:bold;border-radius:6px;
font-size:.95rem;text-transform:uppercase;text-decoration:none;cursor:pointer;border:none}
.btn.note{background:#1e293b;height:44px;font-size:.9rem}
.hinweis{background:#fff;border:1px solid var(--r);color:#991b1b;
padding:8px 12px;border-radius:4px;font-size:.85rem;margin-bottom:14px;font-weight:bold}
#ts{display:none;background:#dcfce7;border:1px solid var(--v);
color:#14532d;padding:8px 12px;border-radius:4px;font-weight:bold;
font-size:.88rem}
</style>
</head>
<body>
<div class="hdr">
<h1 class="tit">✈️ Flugcockpit – Meine Buchungen</h1>
<div class="cp">
<div class="seg" id="dt">16.11.2026</div>
<a href="index.html" class="seg bk">⬅️ Zurück zur Flugsuche</a>
</div>
</div>
<div class="card">
<div class="ct">1️⃣ Airline / Veranstalter & Reisedaten</div>
<div class="f"><label>Airline / Reiseveranstalter</label>
<select id="u5">
<optgroup label="✈️ Airlines">
<option value="tk|pnr_ln|https://turkishairlines.com">Turkish Airlines</option>
<option value="lh|pnr_ln|https://lufthansa.com">Lufthansa</option>
<option value="qr|pnr_ln|https://qatarairways.com">Qatar Airways</option>
<option value="ek|pnr_ln|https://emirates.com">Emirates</option>
<option value="sq|pnr_ln|https://singaporeair.com">Singapore Airlines</option>
<option value="tg|pnr_ln|https://thaiairways.com">Thai Airways</option>
<option value="cx|pnr_ln|https://cathaypacific.com">Cathay Pacific</option>
<option value="pr|pnr_ln|https://philippineairlines.com">Philippine Airlines</option>
<option value="5j|pnr_ln|https://cebupacificair.com">Cebu Pacific (Low-Cost Asien)</option>
<option value="tr|pnr_ln|https://flyscoot.com">Scoot (Low-Cost Asien)</option>
<option value="pg|pnr_ln|https://bangkokair.com">Bangkok Airways</option>
<option value="vj|pnr_fn_ln|https://vietjetair.com">VietJet Air (Low-Cost Asien)</option>
<option value="ak|mail_pnr|https://airasia.com">AirAsia (Low-Cost Asien)</option>
</optgroup>
<optgroup label="🧳 Reisevermittler & Portale">
<option value="gtg|mail_pnr|https://gotogate.de">Gotogate (Meine Buchungen)</option>
<option value="exp|mail_only|https://expedia.de">Expedia (Reiseplan)</option>
<option value="trp|mail_pnr|https://trip.com?">Trip.com (Buchungen)</option>
<option value="kwi|mail_only|https://kiwi.com">Kiwi.com (Buchungen)</option>
<option value="sky|mail_only|https://skyscanner.de">Skyscanner (Mein Konto)</option>
<option value="kyk|mail_only|https://kayak.de">Kayak (Trips)</option>
<option value="mom|mail_only|https://momondo.de">Momondo (Trips)</option>
<option value="opo|mail_pnr|https://opodo.de">Opodo (Meine Reisen)</option>
</optgroup>
</select></div>
<div id="hint" class="hinweis">Benötigt: Buchungscode (PNR) + Nachname</div>
<div id="f_pnr" class="f"><label>Airline- / Vermittler-Buchungscode (PNR)</label>
<div class="cpb"><input type="text" id="u3" autocomplete="off" placeholder="PFLICHT: Buchungscode (z.B. TW8ZRK)" style="text-transform:uppercase">
<button type="button" onclick="cp('u3','Buchungscode')">📋</button></div></div>

<div id="f_fn" class="f"><label>Vorname wie im Reisepass</label>
<div class="cpb"><input type="text" id="u_fn" autocomplete="off" placeholder="PFLICHT: Vorname (z.B. MAX)" style="text-transform:uppercase">
<button type="button" onclick="cp('u_fn','Vorname')">📋</button></div></div>

<div id="f_ln" class="f"><label>Nachname wie im Reisepass (ohne Vornamen!)</label>
<div class="cpb"><input type="text" id="u6" autocomplete="off" placeholder="PFLICHT: Nur Nachname (z.B. MUSTERMANN)" style="text-transform:uppercase">
<button type="button" onclick="cp('u6','Nachname')">📋</button></div></div>

<div id="f_mail" class="f"><label>Buchungs-E-Mail / Konto-Login</label>
<div class="cpb"><input type="email" id="u4" autocomplete="off" placeholder="PFLICHT: E-Mail-Adresse der Buchung">
<button type="button" onclick="cp('u4','E-Mail')">📋</button></div></div>

<div class="f2">
<div><label class="opt">Ticketnummer (für Notizzettel)</label>
<div class="cpb"><input type="text" id="u_tknr" class="opt" autocomplete="off" placeholder="z.B. 2354817365876">
<button type="button" onclick="cp('u_tknr','Ticketnummer')">📋</button></div></div>
<div><label class="opt">Reisepassnummer (für Notizzettel)</label>
<div class="cpb"><input type="text" id="u_pp" class="opt" autocomplete="off" placeholder="z.B. C01X00T47" style="text-transform:uppercase">
<button type="button" onclick="cp('u_pp','Reisepass')">📋</button></div></div>
</div>
</div>

<div class="bb">
<button type="button" onclick="openNote()" class="btn note">
📌 1. Schwebenden Spickzettel starten (Immer im Vordergrund)</button>
<a id="go" href="https://turkishairlines.com" target="_blank" class="btn">
🚀 2. Airline-Seite öffnen</a>
<div id="ts"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const keys="u_fn;u3;u4;u5;u6;u_tknr;u_pp".split(";");
let ci=0;
const cols="#2563eb;#7c3aed;#ea580c;#0891b2;#db2777;#15803d".split(";");
const guides={
  tk:"1. Reiter „Buchung verwalten“ antippen.|2. Reservierungscode (PNR) oder Ticketnummer eingeben.|3. Nachnamen des Passagiers eingeben & Pfeil drücken.",
  lh:"1. Auf „Meine Buchungen“ / „Buchung aufrufen“ klicken.|2. Buchungscode (PNR) einfügen.|3. Nachnamen eingeben & bestätigen.",
  qr:"1. Feld „Manage Booking“ öffnen.|2. Buchungsreferenz (PNR) einfügen.|3. Nachnamen (Last Name) eingeben & abrufen.",
  ek:"1. Bereich „Buchung verwalten“ (Manage Booking) nutzen.|2. Buchungsreferenz (PNR) eingeben.|3. Nachnamen eingeben & Buchung aufrufen.",
  sq:"1. Reiter „Manage Booking“ wählen.|2. Buchungsreferenz (PNR) oder E-Ticket-Nr. eingeben.|3. Nachnamen eingeben & fortfahren.",
  tg:"1. Feld „My Booking“ öffnen.|2. Buchungscode (PNR) einfügen.|3. Nachnamen eingeben & absenden.",
  cx:"1. Auf „Buchung verwalten“ (Manage Booking) klicken.|2. Buchungsreferenz (PNR) einfügen.|3. Vor- oder Nachnamen laut Maske eingeben.",
  pr:"1. Bereich „Manage Booking“ öffnen.|2. Booking Reference (PNR) einfügen.|3. Nachnamen (Last Name) eingeben.",
  "5j":"1. Auf „Manage Booking“ klicken.|2. Buchungscode (PNR) einfügen.|3. Nachnamen (Last Name) eingeben.",
  tr:"1. Bereich „Manage My Booking“ wählen.|2. Buchungsreferenz (PNR) einfügen.|3. Nachnamen + ggf. Abflugstadt eingeben.",
  pg:"1. Feld „Manage My Booking“ öffnen.|2. Buchungscode (PNR) einfügen.|3. Nachnamen eingeben.",
  vj:"1. Bereich „My Booking / Search Booking“ öffnen.|2. Reservation Code (PNR) einfügen.|3. Vorname UND Nachname eingeben.",
  ak:"1. Bei AirAsia MOVE mit E-Mail einloggen.|2. Unter „Purchases / My Bookings“ Buchung wählen.|3. Ggf. PNR zum Verknüpfen nutzen.",
  gtg:"1. Auf „Meine Buchungen“ klicken.|2. Buchungs-E-Mail & Auftragsnummer (PNR) eingeben.|3. Dort Airline-PNR für Direkt-Check-in ablesen.",
  exp:"1. Oben rechts auf „Meine Reisen“ / Anmelden klicken.|2. Mit Buchungs-E-Mail einloggen.|3. Im Reiseplan den 6-stelligen Airline-PNR ablesen.",
  trp:"1. Auf „Buchungen verwalten“ klicken.|2. Mit Buchungs-E-Mail oder Bestellnummer anmelden.|3. Airline-PNR aus dem E-Ticket kopieren.",
  kwi:"1. Auf „Meine Buchungen“ / Anmelden klicken.|2. Mit Buchungs-E-Mail einloggen.|3. Airline-PNR im E-Ticket für den Check-in nutzen.",
  sky:"1. Oben rechts im Profil anmelden.|2. Weiterleitung zum eigentlichen Buchungsanbieter prüfen.",
  kyk:"1. Bereich „Trips“ öffnen & mit E-Mail anmelden.|2. Buchungsbestätigung / Anbieter-Link aufrufen.",
  mom:"1. Bereich „Trips“ öffnen & mit E-Mail anmelden.|2. Buchungsbestätigung / Anbieter-Link aufrufen.",
  opo:"1. Auf „Meine Reisen“ klicken.|2. Buchungsnummer (PNR) & Buchungs-E-Mail eingeben.|3. Airline-Referenz für Check-in ablesen."
};
function cp(id,lbl){
  const v=$(id).value.trim();if(!v)return;
  try{navigator.clipboard.writeText(v);
  $("ts").textContent="✅ "+lbl+" kopiert: "+v;
  $("ts").style.display="block"}catch(e){}
}
async function openNote(){
  sv();
  const parts=$("u5").value.split("|");
  const code=parts.shift();
  const airlineName=$("u5").options[$("u5").selectedIndex].text;
  const steps=(guides[code]||"").split("|");
  const items="PNR|u3;Vorname|u_fn;Nachname|u6;E-Mail|u4;Ticket-Nr.|u_tknr;Pass-Nr.|u_pp".split(";");
  let clipAll="";
  items.forEach(it=>{
    const p=it.split("|");const lbl=p.shift();const val=$(p.join("")).value.trim();
    if(val)clipAll+=lbl+": "+val+" | ";
  });
  if(clipAll){
    try{navigator.clipboard.writeText(clipAll);
    $("ts").textContent="✅ Spickzettel gestartet! Jetzt auf Button 2 klicken.";
    $("ts").style.display="block";}catch(e){}
  }
  if("documentPictureInPicture" in window){
    try{
      const pip=await window.documentPictureInPicture.requestWindow({width:330,height:480});
      const b=pip.document.body;
      b.style.margin="0";b.style.padding="10px";b.style.background="#fef2f2";b.style.fontFamily="sans-serif";
      const h=pip.document.createElement("div");
      h.textContent="📌 "+airlineName;
      h.style.fontWeight="bold";h.style.color="#991b1b";h.style.fontSize="15px";h.style.marginBottom="8px";
      h.style.borderBottom="2px solid #991b1b";h.style.paddingBottom="4px";
      b.appendChild(h);
      if(steps.length&&steps[0]){
        const box=pip.document.createElement("div");
        box.style.background="#fef08a";box.style.border="1px solid #eab308";box.style.borderRadius="5px";
        box.style.padding="7px 9px";box.style.marginBottom="10px";box.style.fontSize="12px";box.style.color="#1e293b";box.style.lineHeight="1.4";
        box.innerHTML="<div style='font-weight:bold;color:#854d0e;margin-bottom:3px'>🧭 So geht es auf der Seite weiter:</div>"+steps.join("<br>");
        b.appendChild(box);
      }
      items.forEach(it=>{
        const p=it.split("|");const lbl=p.shift();const val=$(p.join("")).value.trim();
        if(val){
          const row=pip.document.createElement("div");
          row.style.display="flex";row.style.justifyContent="space-between";row.style.alignItems="center";
          row.style.background="#fff";row.style.border="1px solid #cbd5e1";row.style.padding="6px 8px";
          row.style.borderRadius="5px";row.style.marginBottom="6px";
          const txt=pip.document.createElement("div");
          txt.innerHTML="<div style='font-size:10px;color:#64748b;font-weight:bold'>"+lbl+"</div><div style='font-size:14px;font-weight:bold;color:#0f172a'>"+val+"</div>";
          const btn=pip.document.createElement("button");
          btn.textContent="📋";btn.style.background="#15803d";btn.style.color="#fff";btn.style.border="none";
          btn.style.borderRadius="4px";btn.style.padding="6px 10px";btn.style.cursor="pointer";
          btn.onclick=()=>{navigator.clipboard.writeText(val);btn.textContent="✅";};
          row.appendChild(txt);row.appendChild(btn);b.appendChild(row);
        }
      });
      return;
    }catch(e){}
  }
}
function sv(){
  const now=new Date();
  const dtEl=$("dt");
  dtEl.textContent=now.toLocaleDateString("de-DE")+" • "+now.toLocaleTimeString("de-DE");
  const idx=ci++%cols.length;
  dtEl.style.setProperty("background-color",cols.slice(idx,idx+1).join(""),"important");
  const parts=$("u5").value.split("|");
  parts.shift();
  const mode=parts.shift();
  $("go").href=parts.join("|");
  $("f_pnr").classList.toggle("off",mode==="mail_only");
  $("f_fn").classList.toggle("off",mode!=="pnr_fn_ln");
  $("f_ln").classList.toggle("off",mode!=="pnr_ln"&&mode!=="pnr_fn_ln");
  $("f_mail").classList.toggle("off",mode!=="mail_pnr"&&mode!=="mail_only");
  if(mode==="pnr_ln")$("hint").textContent="Benötigt: Buchungscode (PNR) + Nachname";
  if(mode==="pnr_fn_ln")$("hint").textContent="Benötigt (VietJet Air): Buchungscode (PNR) + Vorname + Nachname";
  if(mode==="mail_pnr")$("hint").textContent="Benötigt: Buchungs-E-Mail + Buchungscode (PNR)";
  if(mode==="mail_only")$("hint").textContent="Benötigt: Login mit deiner Buchungs-E-Mail beim Portal";
  const d={};keys.forEach(k=>d[k]=$(k).value);
  try{localStorage.setItem("rk_upg",JSON.stringify(d))}catch(e){}
}
(function ld(){
  try{
    const raw=localStorage.getItem("rk_upg");
    if(raw){
      const d=JSON.parse(raw);
      keys.forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]});
    }
  }catch(e){}
  sv();
})();
keys.forEach(k=>{
  $(k).addEventListener("input",sv);
  $(k).addEventListener("change",sv);
});
</script>
</body>
</html>
