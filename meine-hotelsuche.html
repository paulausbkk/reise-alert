<a id="h5" href="https://agoda.com" target="_blank" rel="noopener" class="btn b5 htl">Agoda</a>
<form id="f6" action="https://trivago.de" method="get" target="_blank" class="htl" style="margin:0">
<input type="hidden" name="search" id="t_s">
<button type="submit" class="btn b6">Trivago</button>
</form>
<a id="h8" href="https://airbnb.de" target="_blank" class="btn b8 off">Airbnb</a>
</div>
<div class="hint">ℹ️ <b>Wichtiger Hinweis:</b> Detailfilter wie z. B. <b>Hotel am Strand</b>, <b>Terrasse</b>, <b>inklusive Frühstück</b> oder <b>All-Inclusive</b> – sowie bei <b>Booking.com</b> und <b>Trivago</b> der <b>Zielort (Stadt)</b> – müssen auf der Website des jeweiligen Anbieters direkt eingegeben werden.</div>
</div>
<script>
const $ = id => document.getElementById(id);
const P = "https://";
const cities = "Bangkok;Phuket;Chiang Mai;Koh Samui;Krabi;Da Nang;Quy Nhon;Ho-Chi-Minh-Stadt;Hanoi;Manila;Cebu;Dumaguete;Pagadian;Singapur;Kuala Lumpur;Denpasar Bali;Dubai;Doha;Tokio;Istanbul;Faro;Christchurch;Berlin;München;Frankfurt".split(";");
const cols = "#0284c7;#0369a1;#1d4ed8;#0077b6;#0ea5e9;#1e40af".split(";");
const agIds = {
  "bangkok": "9395", "phuket": "16056", "chiang mai": "7401", "koh samui": "17198",
  "krabi": "14865", "da nang": "16440", "quy nhon": "17264", "ho-chi-minh-stadt": "13170",
  "hanoi": "2758", "manila": "16592", "cebu": "4001", "dumaguete": "16562",
  "pagadian": "18952", "singapur": "4064", "kuala lumpur": "14524", "denpasar bali": "17193",
  "dubai": "2994", "doha": "11977", "tokio": "5085", "istanbul": "14932",
  "faro": "15356", "christchurch": "13726", "berlin": "2128", "muenchen": "14163",
  "frankfurt": "14223"
};
let cidx = 0;

function norm(s) {
  return s.toLowerCase().replace(/ü/g,"ue").replace(/ö/g,"oe").replace(/ä/g,"ae");
}

function slug(s) {
  return norm(s).replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function fakeGuid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function buildAgodaUrl(city, aid, ci, co, n, px, rm) {
  const g = fakeGuid();
  const base = P + "://agoda.com";
  const params = new URLSearchParams({
    guid: g,
    asq: btoa(city + "|" + ci),
    cid: "-218",
    tick: String(Date.now()),
    locale: "de-de",
    ckuid: g,
    prid: "0",
    currency: "EUR",
    correlationId: fakeGuid(),
    analyticsSessionId: String(Math.floor(Math.random() * 9e15) + 1e15),
    pageTypeId: aid ? "103" : "1",
    realLanguageId: "6",
    languageId: "6",
    origin: "DE",
    userId: g,
    whitelabelid: "1",
    loginLvl: "0",
    storefrontId: "3",
    currencyId: "1",
    currencyCode: "EUR",
    htmlLanguage: "de-de",
    cultureInfoName: "de-DE",
    checkIn: ci,
    checkOut: co,
    los: String(n),
    rooms: String(rm),
    adults: String(px),
    children: "0",
    travellerType: px === 1 ? "0" : "1",
    familyMode: "off",
    productType: "-1",
    textToSearch: city
  });
  if (aid) params.set("city", aid);
  return base + "?" + params.toString();
}
function ac(inp, box) {
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    box.innerHTML = "";
    if (!q) { box.style.display = "none"; upd(); return; }
    const hits = cities.filter(x => x.toLowerCase().includes(q));
    if (!hits.length) { box.style.display = "none"; upd(); return; }
    hits.forEach(h => {
      const d = document.createElement("div");
      d.textContent = h;
      d.onclick = () => { inp.value = h; box.style.display = "none"; upd(); };
      box.appendChild(d);
    });
    box.style.display = "block";
    upd();
  });
  document.addEventListener("click", e => {
    if (!box.contains(e.target) && e.target !== inp) box.style.display = "none";
  });
}

function upd() {
  const now = new Date(), dtEl = $("dt");
  dtEl.textContent = now.toLocaleDateString("de-DE") + " • " + now.toLocaleTimeString("de-DE");
  dtEl.style.setProperty("background-color", cols[cidx++ % cols.length], "important");

  const city = $("city").value.trim();
  const ci = $("ci").value;
  const co = $("co").value;
  const px = +$("px").value || 2;
  const rm = +$("rm").value || 1;
  const st = +$("st").value || 0;
  const ab = $("ab").checked;

  document.querySelectorAll(".htl").forEach(el => el.classList.toggle("off", ab));
  $("h8").classList.toggle("off", !ab);

  const badDate = (ci && co && co <= ci);
  $("cob").classList.toggle("err", badDate);

  if (ci && co && !badDate) {
    const n = Math.round((new Date(co) - new Date(ci)) / 86400000);
    $("nt").textContent = n + (n === 1 ? " NACHT" : " NÄCHTE");
    $("info").textContent = (ab ? "(AIRBNB) " : "") + "Auswahl: " + (city || "Ziel offen") +
      " • " + n + (n === 1 ? " Nacht" : " Nächte") + " • " + px + " Pers. • " + rm + " Zi.";
  } else {
    $("nt").textContent = "ZEITRAUM WÄHLEN";
    $("info").textContent = "Bitte Reiseziel, Check-in und Check-out wählen.";
  }

  if (city && ci && co && !badDate) {
    const q = encodeURIComponent(city);
    const key = norm(city);
    const sl = slug(city);
    const n = Math.round((new Date(co) - new Date(ci)) / 86400000);
    const aid = agIds[key] || "";
    const dt1 = ci.replace(/-/g, "");
    const dt2 = co.replace(/-/g, "");
    const bFilt = st > 0 ? "class=" + st : "";

    $("h1").href = P + "www.kayak.de/hotels/" + q + "/" + ci + "/" + co + "/" + px + "adults/" + rm + "rooms";

    $("e_dest").value = city;
    $("e_ci").value = ci;
    $("e_co").value = co;
    $("e_rm").value = rm;
    $("e_px").value = px;
    $("e_st").disabled = !(st > 0);
    $("e_st").value = st > 0 ? (st * 10) : "";

    $("h3").href = P + "www.momondo.de/hotels/" + q + "/" + ci + "/" + co + "/" + px + "adults/" + rm + "rooms";

    $("b_ss").value = city;
    $("b_ci").value = ci;
    $("b_co").value = co;
    $("b_px").value = px;
    $("b_rm").value = rm;
    $("b_flt").disabled = !bFilt;
    $("b_flt").value = bFilt;

    $("h5").href = buildAgodaUrl(city, aid, ci, co, n, px, rm);

    $("f6").action = P + "www.trivago.de/de/lm/hotels-" + sl;
    $("t_s").value = "dr-" + dt1 + "-" + dt2 + ";rc-" + rm + "-" + px;

    $("h8").href = P + "www.airbnb.de/s/" + q + "/homes?checkin=" + ci + "&checkout=" + co + "&adults=" + px;
  }

  try {
    localStorage.setItem("rk_hotel", JSON.stringify({
      city: $("city").value, ci, co, px, rm, st, ab
    }));
  } catch (e) {}
}

(function() {
  const t = new Date().toISOString().slice(0, 10);
  $("ci").min = t;
  $("co").min = t;
  try {
    const d = JSON.parse(localStorage.getItem("rk_hotel") || "null");
    if (d) {
      if (d.city) $("city").value = d.city;
      if (d.ci) $("ci").value = d.ci;
      if (d.co) $("co").value = d.co;
      if (d.px) $("px").value = d.px;
      if (d.rm) $("rm").value = d.rm;
      if (d.st) $("st").value = d.st;
      if (d.ab !== undefined) $("ab").checked = d.ab;
    }
  } catch (e) {}

  ac($("city"), $("lc"));
  "city;ci;co;px;rm;st;ab".split(";").forEach(id => {
    $(id).addEventListener("input", upd);
    $(id).addEventListener("change", upd);
  });
  "h1;h3;h5;h8".split(";").forEach(id => {
    $(id).addEventListener("click", upd);
  });
  "f2;f4;f6".split(";").forEach(id => {
    $(id).addEventListener("submit", upd);
  });
  upd();
})();
</script>
</body>
</html>
