<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🏨 Meine Hotelsuche PRO</title>
<style>
:root{--r:#0369a1;--bg:#f0f4f8;--t:#1e293b;--b:#cbd5e1;--v:#15803d;--lg:#22c55e;--ly:#fef08a}
html,body{margin:0;padding:15px;background:var(--bg);font-family:sans-serif;color:var(--t)}
.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--b);padding-bottom:10px;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.tit{font-weight:bold;color:var(--r);font-size:1.3rem;margin:0}
.cp{display:flex;gap:6px;background:#1e293b;padding:4px;border-radius:6px;align-items:center;flex-wrap:wrap}
.seg{font-size:.75rem;padding:4px 10px;border-radius:4px;font-weight:bold;color:#fff;text-transform:uppercase;background:var(--v);text-decoration:none}
.seg.nav{background:#991b1b;font-size:.92rem;padding:8px 16px}
.seg.upg{background:#dc2626;font-size:.92rem;padding:8px 16px}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.card{flex:1 1 420px;border:2px solid var(--r);border-radius:8px;padding:20px;background:#f0f9ff;box-sizing:border-box}
.ct{font-weight:bold;font-size:1.1rem;color:var(--r);border-bottom:1px solid var(--b);padding-bottom:6px;margin-bottom:15px}
.f{margin-bottom:14px;display:flex;flex-direction:column;position:relative}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
label{font-weight:bold;font-size:.85rem;margin-bottom:5px;color:#475569}
input,select{height:40px;padding:0 10px;border:1px solid var(--b);border-radius:4px;box-sizing:border-box;font-size:.98rem;background:#fff;width:100%}
.ac{position:absolute;top:65px;left:0;right:0;background:#fff;border:1px solid var(--r);border-radius:4px;z-index:99;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.ac div{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:.95rem}
.ac div:hover{background:#e0f2fe;font-weight:bold}
.bn{background:#fff;border:2px solid var(--r);border-radius:4px;padding:9px 12px;color:var(--r);font-weight:bold;font-size:.9rem;line-height:1.35}
.bb{border:2px solid var(--b);background:#fff;border-radius:8px;padding:15px}
.bf{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;height:46px;color:#fff;font-weight:bold;border-radius:4px;font-size:.82rem;text-transform:uppercase;text-decoration:none;text-align:center;padding:0 4px;transition:.2s}
.b1{background:#ff690f}.b2{background:#1e3a8a}.b3{background:#84329b}.b8{background:#ff5a5f}
.b4{background:#003580}.b5{background:#1d4ed8}.b6{background:#007faf}.b7{background:#2563eb}
.off{opacity:.25;pointer-events:none;filter:grayscale(100%)}
.err{opacity:.35}.err input{background:#cbd5e1!important}
.swc{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:0 10px;border:1px solid var(--b);border-radius:4px;min-height:40px;gap:6px}
.swc.ab{background:#ffe4e6;border:1px solid #fb7185}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:20px;transition:.3s}
.sl:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.sw input:checked+.sl{background:var(--lg)!important}
.sw input:checked+.sl:before{transform:translateX(18px)}
</style>
</head>
<body>
<div class="hdr"><h1 class="tit">🏨 Meine Hotelsuche PRO - DASHBOARD</h1>
<div class="cp"><div class="seg" id="dt">18.11.2026</div><div class="seg" id="nt">1 NACHT</div>
<a href="index.html" class="seg nav">⬅️ Zurück zur Flugsuche</a>
<a href="meine-flugbuchungen.html" class="seg upg">✈️ Meine Flugbuchungen ➡️</a></div></div>
<div class="row">
<div class="card"><div class="ct">📍 Zielort & Reisedaten</div>
<div class="f"><label>Reiseziel (Stadt oder Region)</label><input type="text" id="city" placeholder="z.B. Bangkok, Da Nang, Cebu" autocomplete="off"><div id="lc" class="ac"></div></div>
<div class="f"><label>Check-in (Anreise)</label><input type="date" id="ci"></div>
<div class="f" id="cob"><label>Check-out (Abreise)</label><input type="date" id="co"></div></div>
<div class="card"><div class="ct">🛏️ Gäste, Zimmer & Hotel-Filter</div>
<div class="f2"><div class="f" style="margin:0"><label for="px">Personenzahl</label><select id="px"><option value="1">1 Erwachsener</option><option value="2" selected>2 Erwachsene</option><option value="3">3 Erwachsene</option><option value="4">4 Erwachsene</option></select></div>
<div class="f" style="margin:0"><label for="rm">Zimmer</label><select id="rm"><option value="1" selected>1 Zimmer</option><option value="2">2 Zimmer</option><option value="3">3 Zimmer</option></select></div></div>
<div class="f2"><div class="f" style="margin:0"><label for="st">Mindest-Sterne</label><select id="st"><option value="0">Alle Kategorien</option><option value="3">Ab 3 Sterne ⭐⭐⭐</option><option value="4">Ab 4 Sterne ⭐⭐⭐⭐</option><option value="5">5 Sterne ⭐⭐⭐⭐⭐</option></select></div>
<div class="f" style="margin:0"><label for="mp">Verpflegung</label><select id="mp"><option value="0">Alle Verpflegungen</option><option value="ro">Nur Übernachtung</option><option value="1">Frühstück inbegriffen</option><option value="9">Halbpension</option><option value="3">Vollpension</option><option value="4">All-Inclusive</option></select></div></div>
<div class="f"><div class="swc ab"><label for="ab" style="margin:0;cursor:pointer">Nur Airbnb (Ferienwohnung / Apartment)</label><label class="sw"><input type="checkbox" id="ab"><span class="sl"></span></label></div></div>
<div class="bn" id="info">Bitte Reiseziel, Check-in und Check-out wählen.</div></div></div>
<div class="bb"><div class="bf">
<a id="h1" href="https://kayak.de" target="_blank" class="btn b1 htl">Kayak Hotels</a>
<a id="h2" href="https://expedia.de" target="_blank" class="btn b2 htl">Expedia Hotels</a>
<a id="h3" href="https://momondo.de" target="_blank" class="btn b3 htl">Momondo Hotels</a>
<a id="h4" href="https://booking.com" target="_blank" class="btn b4 htl">Booking.com</a>
<a id="h5" href="https://agoda.com" target="_blank" class="btn b5 htl">Agoda</a>
<a id="h6" href="https://trivago.de" target="_blank" class="btn b6 htl">Trivago</a>
<a id="h7" href="https://trip.com" target="_blank" class="btn b7 htl">Trip.com</a>
<a id="h8" href="https://airbnb.de" target="_blank" class="btn b8 off">Airbnb</a>
</div></div>
<script>
const $ = id => document.getElementById(id);
const P = "https://";
const cities = "Bangkok;Phuket;Chiang Mai;Koh Samui;Krabi;Da Nang;Quy Nhon;Ho-Chi-Minh-Stadt;Hanoi;Manila;Cebu;Dumaguete;Pagadian;Singapur;Kuala Lumpur;Denpasar Bali;Dubai;Doha;Tokio;Istanbul;Faro;Christchurch;Berlin;München;Frankfurt".split(";");
const cols = "#0369a1;#7c3aed;#ea580c;#0891b2;#db2777;#15803d".split(";");
const db = {
  "bangkok": "9395,359,200-15666",
  "phuket": "16056,725,200-15685",
  "chiang mai": "7401,623,200-15669",
  "koh samui": "17198,1218,200-15678",
  "krabi": "14865,1221,200-15680",
  "da nang": "16440,1356,200-16364",
  "quy nhon": "17264,42616,200-74074",
  "ho-chi-minh-stadt": "13170,301,200-16368",
  "hanoi": "2758,286,200-16365",
  "manila": "16592,364,200-15192",
  "cebu": "4001,1239,200-15177",
  "dumaguete": "16562,18253,200-72186",
  "pagadian": "18952,56414,200-72235",
  "singapur": "4064,73,200-15517",
  "kuala lumpur": "14524,315,200-14912",
  "denpasar bali": "17193,723,200-14201",
  "dubai": "2994,220,200-16164",
  "doha": "11977,297,200-15342",
  "tokio": "5085,228,200-14575",
  "istanbul": "14932,532,200-15971",
  "faro": "15356,1384,200-15318",
  "christchurch": "13726,682,200-15080",
  "berlin": "2128,193,200-8514",
  "muenchen": "14163,363,200-8746",
  "frankfurt": "14223,250,200-8582"
};
const exMeal = { ro:"ROOM_ONLY", "1":"FREE_BREAKFAST", "9":"HALF_BOARD", "3":"FULL_BOARD", "4":"ALL_INCLUSIVE" };
const mpTxt = { ro:"Nur Übernachtung", "1":"Frühstück", "9":"Halbpension", "3":"Vollpension", "4":"All-Inclusive" };
let cidx = 0;

function norm(s) {
  return s.toLowerCase().replace(/ü/g,"ue").replace(/ö/g,"oe").replace(/ä/g,"ae");
}

function ac(inp, box) {
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    box.innerHTML = "";
    if (!q) { box.style.display = "none"; upd(); return; }
    const hits = cities.filter(x => x.toLowerCase().includes(q));
    if (!hits.length) { box.style.display = "none"; upd(); return; }
    hits.forEach(h => {
      const d = document.createElement("div");
      d.textContent = h;
      d.onclick = () => { inp.value = h; box.style.display = "none"; upd(); };
      box.appendChild(d);
    });
    box.style.display = "block";
    upd();
  });
  document.addEventListener("click", e => {
    if (!box.contains(e.target) && e.target !== inp) box.style.display = "none";
  });
}

function upd() {
  const now = new Date(), dtEl = $("dt");
  dtEl.textContent = now.toLocaleDateString("de-DE") + " • " + now.toLocaleTimeString("de-DE");
  dtEl.style.setProperty("background-color", cols.at(cidx++ % cols.length), "important");

  const city = $("city").value.trim();
  const ci = $("ci").value;
  const co = $("co").value;
  const px = +$("px").value || 2;
  const rm = +$("rm").value || 1;
  const st = +$("st").value || 0;
  const mp = $("mp").value || "0";
  const ab = $("ab").checked;

  document.querySelectorAll(".htl").forEach(el => el.classList.toggle("off", ab));
  $("h8").classList.toggle("off", !ab);

  const badDate = (ci && co && co <= ci);
  $("cob").classList.toggle("err", badDate);

  if (ci && co && !badDate) {
    const n = Math.round((new Date(co) - new Date(ci)) / 86400000);
    const mInfo = (!ab && mp !== "0" && mpTxt.hasOwnProperty(mp)) ? " • " + Reflect.get(mpTxt, mp) : "";
    $("nt").textContent = n + (n === 1 ? " NACHT" : " NÄCHTE");
    $("info").textContent = (ab ? "(AIRBNB) " : "") + "Auswahl: " + (city || "Ziel offen") +
      " • " + n + (n === 1 ? " Nacht" : " Nächte") + " • " + px + " Pers. • " + rm + " Zi." + mInfo;
  } else {
    $("nt").textContent = "ZEITRAUM WÄHLEN";
    $("info").textContent = "Bitte Reiseziel, Check-in und Check-out wählen.";
  }

  if (city && ci && co && !badDate) {
    const q = encodeURIComponent(city);
    const raw = Reflect.get(db, norm(city)) || "";
    const parts = raw ? raw.split(",") : null;
    const aid = parts ? parts.at(0) : "";
    const tid = parts ? parts.at(1) : "";
    const vid = parts ? parts.at(2) : "";
    const dt1 = ci.replace(/-/g, "");
    const dt2 = co.replace(/-/g, "");
    const exExtra = (st > 0 ? "&star=" + (st * 10) : "") + (Reflect.has(exMeal, mp) ? "&mealPlan=" + Reflect.get(exMeal, mp) : "");

    $("h1").href = P + "www.kayak.de/hotels/" + q + "/" + ci + "/" + co + "/" + px + "adults/" + rm + "rooms";
    $("h2").href = P + "www.expedia.de/Hotel-Search?destination=" + q + "&startDate=" + ci + "&endDate=" + co + "&adults=" + px + "&rooms=" + rm + exExtra;
    $("h3").href = P + "www.momondo.de/hotels/" + q + "/" + ci + "/" + co + "/" + px + "adults/" + rm + "rooms";
    $("h4").href = P + "://booking.com" + q + "&checkin=" + ci + "&checkout=" + co + "&group_adults=" + px + "&no_rooms=" + rm;
    $("h5").href = aid
      ? P + "://agoda.com" + aid + "&checkIn=" + ci + "&checkOut=" + co + "&adults=" + px + "&rooms=" + rm
      : P + "://agoda.com" + q + "&checkIn=" + ci + "&checkOut=" + co + "&adults=" + px + "&rooms=" + rm;
    $("h6").href = vid
      ? P + "www.trivago.de/de/srl?search=" + vid + ";dr-" + dt1 + "-" + dt2 + ";rc-" + rm + "-" + px
      : P + "www.trivago.de/de/srl?q=" + q + "&search=dr-" + dt1 + "-" + dt2;
    $("h7").href = tid
      ? P + "://trip.com" + tid + "&checkin=" + ci + "&checkout=" + co + "&adult=" + px + "&crn=" + rm
      : P + "://trip.com" + q + "&checkin=" + ci + "&checkout=" + co + "&adult=" + px + "&crn=" + rm;
    $("h8").href = P + "www.airbnb.de/s/" + q + "/homes?checkin=" + ci + "&checkout=" + co + "&adults=" + px;
  }

  try {
    localStorage.setItem("rk_hotel", JSON.stringify({
      city: $("city").value, ci, co, px, rm, st, mp, ab
    }));
  } catch (e) {}
}

(function() {
  const t = new Date().toISOString().slice(0, 10);
  $("ci").min = t;
  $("co").min = t;
  try {
    const d = JSON.parse(localStorage.getItem("rk_hotel") || "null");
    if (d) {
      if (d.city) $("city").value = d.city;
      if (d.ci) $("ci").value = d.ci;
      if (d.co) $("co").value = d.co;
      if (d.px) $("px").value = d.px;
      if (d.rm) $("rm").value = d.rm;
      if (d.st) $("st").value = d.st;
      if (d.mp !== undefined) $("mp").value = d.mp;
      else if (d.bf) $("mp").value = "1";
      if (d.ab !== undefined) $("ab").checked = d.ab;
    }
  } catch (e) {}

  ac($("city"), $("lc"));
  "city;ci;co;px;rm;st;mp;ab".split(";").forEach(id => {
    $(id).addEventListener("input", upd);
    $(id).addEventListener("change", upd);
  });
  "h1;h2;h3;h4;h5;h6;h7;h8".split(";").forEach(id => {
    $(id).addEventListener("click", upd);
  });
  upd();
})();
</script>
</body>
</html>
