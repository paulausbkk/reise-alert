<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✈️ Reisekonfiguration PRO v30 (Pure HTML/CSS)</title>
<style>
:root{--r:#0369a1;--d:#0c4a6e;--bg:#e8f1f8;--t:#0f172a;--b:#bae6fd;
--g:#0ea5e9;--v:#0284c7;--lg:#0284c7;--ly:#e0f2fe}
html,body{margin:0;padding:14px;
background:linear-gradient(180deg,#dbeafe 0%,#f0f9ff 100%);
min-height:100vh;font-family:sans-serif;color:var(--t);
box-sizing:border-box}
.hdr{display:flex;justify-content:space-between;align-items:center;
background:#0f2942;padding:13px 18px;border-radius:12px;
margin-bottom:16px;flex-wrap:wrap;gap:10px;
box-shadow:0 4px 14px rgba(15,41,66,.18)}
.tit{font-weight:bold;color:#fff;font-size:1.22rem;margin:0;
letter-spacing:.3px}
.cp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{font-size:.78rem;padding:6px 12px;border-radius:6px;
font-weight:bold;color:#fff;text-transform:uppercase;
background:#0284c7;text-decoration:none;border:1px solid #38bdf8}
.seg.upg{background:#1e40af;font-size:.86rem;padding:8px 14px;
border-color:#60a5fa}
.seg.htl{background:#0369a1;border-color:#7dd3fc}
.row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:16px}
.card{flex:1 1 420px;border:1px solid #93c5fd;border-radius:12px;
padding:18px 20px;background:#ffffff;box-sizing:border-box;
box-shadow:0 4px 12px rgba(3,105,161,.08)}
.ct{font-weight:bold;font-size:1.06rem;color:var(--d);
border-bottom:2px solid #e0f2fe;padding-bottom:7px;margin-bottom:14px}
.f{margin-bottom:13px;display:flex;flex-direction:column;
position:relative}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;
margin-bottom:13px}
label{font-weight:bold;font-size:.84rem;margin-bottom:4px;
color:#1e3a8a}
.inp,.dat,select{height:41px;padding:0 12px;border:1px solid #93c5fd;
border-radius:8px;box-sizing:border-box;font-size:.96rem;
background:#f8fafc;color:var(--t);width:100%;transition:.2s}
.inp:focus,.dat:focus,select:focus{outline:none;border-color:#0284c7;
background:#fff;box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.rng{width:100%;accent-color:#0284c7;cursor:pointer;height:36px}
@keyframes pulseHint{
0%,100%{border-color:#7f1d1d;box-shadow:0 0 0 rgba(185,28,28,0)}
50%{border-color:#dc2626;box-shadow:0 0 14px rgba(185,28,28,.7)}
}
.bn{background:#0f2942;border:3px solid #991b1b;
border-left:7px solid #991b1b;border-radius:8px;padding:11px 14px;
color:#fff;font-weight:bold;font-size:.88rem;line-height:1.4;
animation:pulseHint 2.2s infinite ease-in-out}
.bb{border:1px solid #93c5fd;background:#ffffff;border-radius:12px;
padding:16px 20px;box-shadow:0 4px 12px rgba(3,105,161,.08)}
.bf{display:grid;
grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.btn{display:flex;flex-direction:column;align-items:center;
justify-content:center;height:46px;color:#fff;font-weight:bold;
border:none;border-radius:8px;font-size:.84rem;cursor:pointer;
text-transform:uppercase;text-decoration:none;text-align:center;
line-height:1.15;padding:0 6px;transition:.2s;
box-shadow:0 2px 6px rgba(15,41,66,.15)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn .sub{font-size:.64rem;font-weight:bold;text-transform:none;
opacity:1;margin-top:2px;color:#e0f2fe}
.b2{background:#0284c7}.b3{background:#1d4ed8}.b4{background:#0369a1}
.b5{background:#1e3a8a}.b6{background:#2563eb}.b7{background:#0077b6}
body:has(#ow:checked) #rb{opacity:.28;pointer-events:none}
body:has(#ow:checked) #rb input{background:#e2e8f0!important}
body:has(#ow:checked) .st{background:#0369a1!important;color:#fff;
border-color:#7dd3fc}
.swc{display:flex;align-items:center;justify-content:space-between;
background:#f0f9ff;padding:0 12px;border:1px solid #bae6fd;
border-radius:8px;min-height:41px;gap:8px}
.swc.yl{background:#e0f2fe;border:1px solid #7dd3fc}
.swc.split{flex-direction:column;justify-content:center;
align-items:stretch;padding:0;gap:0;overflow:hidden}
.swh{display:flex;align-items:center;justify-content:space-between;
padding:4px 10px;gap:6px;min-height:28px}
.swh:first-child{border-bottom:1px solid #7dd3fc}
.sw{position:relative;display:inline-block;width:42px;height:24px;
flex-shrink:0}
.sw.sm{width:34px;height:18px}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;
border-radius:20px;transition:.3s}
.sl:before{position:absolute;content:"";height:18px;width:18px;
left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.sw.sm .sl:before{height:14px;width:14px;left:2px;bottom:2px}
.sw input:checked+.sl{background:#0284c7!important}
.sw input:checked+.sl:before{transform:translateX(18px)}
.sw.sm input:checked+.sl:before{transform:translateX(16px)}
</style>
</head>
<body>
<datalist id="ap">
<option value="BER">Berlin Brandenburg</option>
<option value="FRA">Frankfurt am Main</option>
<option value="MUC">München</option>
<option value="LEJ">Leipzig/Halle</option>
<option value="DUS">Düsseldorf</option>
<option value="HAM">Hamburg</option>
<option value="CGN">Köln/Bonn</option>
<option value="STR">Stuttgart</option>
<option value="HAJ">Hannover</option>
<option value="NUE">Nürnberg</option>
<option value="VIE">Wien</option>
<option value="ZRH">Zürich</option>
<option value="BKK">Bangkok Suvarnabhumi</option>
<option value="DMK">Bangkok Don Mueang</option>
<option value="HKT">Phuket</option>
<option value="CNX">Chiang Mai</option>
<option value="USM">Koh Samui</option>
<option value="KBV">Krabi</option>
<option value="DAD">Da Nang</option>
<option value="UIH">Quy Nhon</option>
<option value="SGN">Ho-Chi-Minh-Stadt</option>
<option value="HAN">Hanoi</option>
<option value="MNL">Manila</option>
<option value="CEB">Cebu</option>
<option value="DGT">Dumaguete</option>
<option value="PAG">Pagadian</option>
<option value="SIN">Singapur</option>
<option value="KUL">Kuala Lumpur</option>
<option value="DPS">Denpasar Bali</option>
<option value="DXB">Dubai</option>
<option value="DOH">Doha</option>
<option value="IST">Istanbul</option>
<option value="TYO">Tokio</option>
<option value="FAO">Faro</option>
<option value="CHC">Christchurch</option>
</datalist>
<div class="hdr"><h1 class="tit">✈️ Reisekonfiguration PRO v30</h1>
<div class="cp"><div class="seg" id="dt">18.11.2026</div>
<div class="seg st" id="st">HIN & RÜCK</div>
<a href="meine-hotelsuche.html" class="seg upg htl">🏨 Meine Hotelsuche ➡️</a>
<a href="meine-flugbuchungen.html" class="seg upg">✈️ Meine Flugbuchungen ➡️</a></div>
</div>
<form target="_blank" method="get">
<div class="row">
<div class="card">
<div class="ct">📋 Kern-Reisedaten (Direkt-Absprung)</div>
<div class="f2" style="margin-bottom:14px">
<div class="f" style="margin:0"><label for="i1">Abflug (IATA-Code)</label>
<input type="text" class="inp" id="i1" name="from" list="ap"
placeholder="z.B. BER, FRA, MUC" maxlength="3" required></div>
<div class="f" style="margin:0"><label for="i2">Ziel (IATA-Code)</label>
<input type="text" class="inp" id="i2" name="to" list="ap"
placeholder="z.B. BKK, DAD, CEB" maxlength="3" required></div>
</div>
<div class="f2" style="margin-bottom:0">
<div class="f" style="margin:0"><label for="od">Hinflug</label>
<input type="date" class="dat" id="od" name="departure" required></div>
<div class="f" id="rb" style="margin:0"><label for="rd">Rückflug</label>
<input type="date" class="dat" id="rd" name="return"></div>
</div>
</div>
<div class="card">
<div class="ct">⚙️ Filter & Flug-Parameter</div>
<div class="f2" style="align-items:end">
<div class="swc">
<label for="ow" style="margin:0;cursor:pointer;font-size:.82rem">Nur Hinflug (One-Way)</label>
<label class="sw"><input type="checkbox" id="ow" name="oneway" value="1">
<span class="sl"></span></label>
</div>
<div class="f" style="margin:0"><label for="px">Personenzahl</label>
<select id="px" name="adults">
<option value="1">1 Person</option>
<option value="2">2 Personen</option>
<option value="3">3 Personen</option>
<option value="4">4 Personen</option>
</select></div>
</div>
<div class="f"><label for="rng">Max. Reisezeit (1 – 36 Std.)</label>
<input type="range" class="rng" id="rng" name="maxDuration"
min="1" max="36" value="14"></div>
<div class="f2">
<div class="swc yl">
<label for="ns" style="margin:0;cursor:pointer;font-size:.82rem">Nur Direktflüge (Non-Stop)</label>
<label class="sw"><input type="checkbox" id="ns" name="stopNumber" value="0">
<span class="sl"></span></label>
</div>
<div class="swc yl split">
<div class="swh">
<label for="s1" style="margin:0;cursor:pointer;font-size:.8rem">Max. 1 Stop</label>
<label class="sw sm"><input type="checkbox" id="s1" name="stopNumber" value="1">
<span class="sl"></span></label>
</div>
<div class="swh">
<label for="s2" style="margin:0;cursor:pointer;font-size:.8rem">Max. 2 Stopps</label>
<label class="sw sm"><input type="checkbox" id="s2" name="stopNumber" value="2">
<span class="sl"></span></label>
</div>
</div>
</div>
<div class="f" style="margin-bottom:12px"><div class="swc">
<label for="lc" style="margin:0;cursor:pointer;font-size:.82rem">Inkl. Low-Cost Airlines (zusätzlich)</label>
<label class="sw"><input type="checkbox" id="lc" name="lowcost" value="1">
<span class="sl"></span></label>
</div></div>
<div class="bn">ℹ️ <b>Hinweis:</b> Gepäck muss auf der entsprechend angeklickten Website beim Anbieter ausgewählt werden.</div>
</div>
</div>
<div class="bb">
<div class="bf">
<button type="submit" formaction="https://skyscanner.de"
class="btn b2">Skyscanner</button>
<button type="submit" formaction="https://kayak.de"
class="btn b3">Kayak</button>
<button type="submit" formaction="https://momondo.de"
class="btn b4">Momondo</button>
<button type="submit" formaction="https://expedia.de"
class="btn b5">Expedia<span class="sub">Stopps auf Website wählen</span></button>
<button type="submit" formaction="https://kiwi.com"
class="btn b6">Kiwi.com</button>
<button type="submit" formaction="https://trip.com"
class="btn b7">Trip.com</button>
</div>
</div>
</form>
</body>
</html>
